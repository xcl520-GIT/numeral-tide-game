<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tide-sim</title>
</head>
<body>
<pre id="out">running...</pre>
<script src="../src/js/data.js"></script>
<script src="../src/js/core.js"></script>
<script>
/* ============================================================
   无头平衡模拟入口。
   用 Edge 的 --headless --dump-dom 直接跑，命令行就能验收：
     msedge.exe --headless=new --dump-dom "file:///.../tools/sim.html?n=400"
   好处是**和游戏共用同一份 core.js**。之前用 Python 复刻核心逻辑，
   两份实现一旦漂移，平衡数据就全是假的（这个坑已经踩过一次）。
   参数：?n=400&diff=standard&cls=all&seed=1
   ============================================================ */
(function () {
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    q[p[0]] = decodeURIComponent(p[1] || '');
  });
  var n = parseInt(q.n || '200', 10);
  var diff = q.diff || 'all';
  var lines = [];
  // fumble = AI 的"算错率"，模拟不同水平的玩家。
  // counter = 克制奖励倍率；传 0 可以把它关掉，单独观察重构本身的影响。
  // 关键用法：fumble=0 & counter=0 时随机流与改造前完全一致 —— 用来证明"重构零影响"。
  // 默认 0.2 而不是 0 —— 这个默认值决定了"标准回归命令跑出来的数是什么意思"。
  // 改造前引擎替玩家择优，那时的基线其实是**完美玩法的上限**；
  // 手动化之后上限和均值分离了，默认必须给均值，否则拿到的数会虚高且看不出来。
  var fumble = (q.fumble === undefined || q.fumble === '') ? 0.2 : parseFloat(q.fumble);
  var counter = (q.counter === undefined || q.counter === '') ? undefined : parseFloat(q.counter);
  // stance = 战斗内姿态轮换。默认开。
  // 传 0 得到的是**干净对照组**：姿态不在战斗里翻面，AI 也就不必逐轮重算，
  // 随机流与 v11.3-a 完全一致 —— 于是"通关率差了多少"可以被 100% 归因到
  // 这一件事上，而不是混在"顺手改了 AI 策略"里。
  var stance = (q.stance === undefined || q.stance === '') ? 1 : parseInt(q.stance, 10);
  // squad = 群战：踩上敌人格时把主角上下左右（最多 4 个）的敌人一起拉进对决。
  // 默认开。传 0 得到的是**一对一对照组** —— 重标基线时唯一的归因抓手：
  // 通关率的变化必须能拆成"群战造成的"和"数值改造成的"两份，而不是一锅粥。
  var squad = (q.squad === undefined || q.squad === '') ? 1 : parseInt(q.squad, 10);
  // v11.4-h 的三件套，一律同一套用法：传 0 得到干净对照组。
  //   slots=0  每只怪各自寻路到玩家（旧的排队行为）
  //   tick=0   战斗期间地图冻结（一场仗只推进一个世界回合）
  //   alert=0  没被惊动的房间按老节奏每 2 回合挪一步
  var slots = (q.slots === undefined || q.slots === '') ? 1 : parseInt(q.slots, 10);
  var tick = (q.tick === undefined || q.tick === '') ? 1 : parseInt(q.tick, 10);
  var alert = (q.alert === undefined || q.alert === '') ? 0 : parseInt(q.alert, 10);
  // hold=0 回到旧的区域门禁（玩家进区才动）—— 本轮的对照组。
  var hold = (q.hold === undefined || q.hold === '') ? 1 : parseInt(q.hold, 10);
  // cleave=0 关掉横扫（三个来源一起关）—— 量【群攻值多少】的对照组。
  var cleave = (q.cleave === undefined || q.cleave === '') ? 1 : parseInt(q.cleave, 10);
  // keeppay=0 关掉守门堆的保费 —— 用来把"布局的代价"和"保费的补偿"分开量。
  var keeppay = (q.keeppay === undefined || q.keeppay === '') ? 1 : parseInt(q.keeppay, 10);
  // P1（v11.5）的两个开关，默认都是**旧行为** —— 所以基线命令逐位不变。
  //   waitcost=0|a|b   a = 等待额外推进一个潮汐节拍 / b = 累积惊动（已醒的敌人免费挪一步）
  //   aiwait=0|1       无头 AI 会不会刷回合（0 = 旧 AI，一次都不等）
  var waitcost = (q.waitcost === 'a' || q.waitcost === 'b') ? q.waitcost : '0';
  var aiwait = (q.aiwait === undefined || q.aiwait === '') ? 0 : parseInt(q.aiwait, 10);
  lines.push('fumble=' + fumble + '（AI 失误率）  counterBonus=' +
    (counter === undefined ? '(默认)' : counter) + '  战斗内姿态轮换=' + (stance ? '开' : '关') +
    '  群战=' + (squad ? '开' : '关'));
  lines.push(fumble <= 0
    ? '  ⚠ fumble=0 表示完美玩法 —— 这是**上限**，不是玩家均值。'
    : '  → 该失误率模拟"普通水平玩家"的均值。');
  lines.push('  等待的代价=' + (waitcost === '0' ? '关（等待免费 = 旧行为）'
    : (waitcost === 'a' ? 'a · 额外推进一个潮汐节拍'
      : 'b · 累积惊动（已醒的敌人免费挪一步）')) +
    '  AI刷回合=' + (aiwait ? '开' : '关（一次都不等 = 旧行为）'));

  function fmt(o) {
    return 'winRate=' + o.winRate + '%  turns=' + o.turns + '  kills=' + o.kills +
      '  relics=' + o.avgRelics + '  endDepth=' + JSON.stringify(o.byDepth);
  }
  /* 群战占比按"被接战那只从哪来"劈开（v11.4 的 C）。
     判据沿用探针那条：名字和它的模板同名 = 野生；被改过名 = 召唤物
     （孢子母的"幼体"是用黏液怪模板现造的）。不把"幼体"两个字写死在这里。
     量具包在 prototype 上，不改游戏 —— 这类统计一旦混进模型，
     平衡数据就会开始依赖"谁在看着它"。 */
  var byKind = { wild: { n: 0, sq: 0 }, minion: { n: 0, sq: 0 } };
  /* 常驻指标①「一轮结束占比」（v11.5 P0）。
     口径沿用 A1 探针：**1v1 + tier<=1 + kind normal + 野生**。
     为什么卡这么窄：把精英 / 首领 / 群战 / 召唤物混进来，这个数会被几头
     完全不同的分布夹住 —— 看起来一直在动，却说不清是谁在动。
     tier 只在**模板**上（arc.tier），实例上有的只是 stats。 */
  var round1 = { n: 0, one: 0 };
  /* 常驻指标②「战斗轮数」。顺带说一句：out.fightRounds 从 v11.4-k 起就是
     个死字段（声明了从来没写过）。真值在这里补 —— 量具放工具里，
     不往模型里塞统计：模型一旦开始依赖"谁在看着它"，平衡数据就不干净了。 */
  var fr = { n: 0, rounds: 0 };
  var PP = TideCore.Game.prototype;
  if (!PP.__splitWrapped) {
    PP.__splitWrapped = true;
    var _osW = PP._fightSettle;
    PP._fightSettle = function (L) {
      var r = _osW.apply(this, arguments);
      if (L && L.duel && L.duel.bs && L.duel.bs.length) {
        var u = L.duel.bs[0];
        var isWild = (!u.src || u.name === u.src.arc.name);
        var g = isWild ? byKind.wild : byKind.minion;
        g.n++; if (L.duel.bs.length > 1) g.sq++;
        fr.n++; fr.rounds += L.duel.round;
        var e0 = L.enemies && L.enemies[0];
        if (isWild && L.duel.bs.length === 1 && e0 && e0.kind === 'normal' &&
            e0.arc && e0.arc.tier <= 1) {
          round1.n++;
          if (L.duel.round <= 1) round1.one++;
        }
      }
      return r;
    };
  }

  function resetStats() {
    byKind.wild.n = 0; byKind.wild.sq = 0;
    byKind.minion.n = 0; byKind.minion.sq = 0;
    round1.n = 0; round1.one = 0;
    fr.n = 0; fr.rounds = 0;
  }
  function pct(g) { return g.n ? Math.round(g.sq / g.n * 100) + '%' : '-'; }
  function pct1() { return round1.n ? Math.round(round1.one / round1.n * 1000) / 10 + '%' : '-'; }
  function avgFr() { return fr.n ? Math.round(fr.rounds / fr.n * 100) / 100 : 0; }
  /* 四个常驻指标钉成一行 —— 趋势线要能一眼扫过去，而不是每次重新解释。
     第 4 项按难度各自显示，不只深渊有（休闲 22 / 标准 111 也都是信息）。 */
  function resident(o) {
    return '常驻 一轮结束 ' + pct1() + ' (n=' + round1.n + ')' +
      ' | 群战 野生 ' + pct(byKind.wild) + ' 召唤物 ' + pct(byKind.minion) +
      ' | 等待 ' + o.waitRate + '% | 承伤/局 ' + o.dmgTaken +
      ' | 战斗 ' + avgFr() + ' 轮/场' +
      ' | 第1层死亡 ' + (o.byDepth['1'] || 0);
  }

  var t0 = Date.now();
  try {
  var diffs = diff === 'all' ? ['casual', 'standard', 'abyss'] : [diff];
  for (var i = 0; i < diffs.length; i++) {
    var d = diffs[i];
    resetStats();
    var o = TideCore.Game.simulate(n, { difficulty: d, seedBase: 1000, maxTurns: 2400,
      aiFumble: fumble, counterBonus: counter, aiStance: !!stance, squad: !!squad,
      slots: !!slots, tick: !!tick, alert: !!alert, hold: !!hold,
      cleave: !!cleave, keepPay: !!keeppay, waitCost: waitcost, aiWait: !!aiwait });
    lines.push('[' + d + '] ' + fmt(o));
    lines.push('        群战拆分 野生 ' + pct(byKind.wild) + ' (n=' + byKind.wild.n + ')' +
      '  召唤物 ' + pct(byKind.minion) + ' (n=' + byKind.minion.n + ')' +
      '  ← 达标线看的是**野生**这一列');
    lines.push('        ' + resident(o));
    lines.push('        outcome: ' + JSON.stringify(o.outcome));
    if (o.stalls) lines.push('        STALL: ' + JSON.stringify(o.stalls));
    lines.push('        relics: ' + JSON.stringify(o.relicPick));
    lines.push('        lootRarity: ' + JSON.stringify(o.avgRarity));
    lines.push('        deathBy: ' + JSON.stringify(o.deathCause));
  }
  // 分职业跑标准难度，检查职业之间是否失衡
  if (q.cls !== '0' && diff !== 'all') {
    ['warlord', 'arcanist', 'ranger', 'warden'].forEach(function (c) {
      /* 分职业行必须**和大盘行走同一组开关**（v11.5 P0 修正）。
         原来这里只传 difficulty / classKey，于是 aiFumble 落到
         num(undefined) = 0 —— 那是"完美玩法的上限"，而大盘行跑的是
         fumble=0.2 的玩家均值。两张表摆在一起会被当成同一把尺子读，
         实际上中间差着一整个失误率。 */
      resetStats();
      var o = TideCore.Game.simulate(n, {
        difficulty: diffs[0], classKey: c, seedBase: 1000, maxTurns: 2400,
        aiFumble: fumble, counterBonus: counter, aiStance: !!stance, squad: !!squad,
        slots: !!slots, tick: !!tick, alert: !!alert, hold: !!hold,
        cleave: !!cleave, keepPay: !!keeppay, waitCost: waitcost, aiWait: !!aiwait
      });
      lines.push('[cls:' + c + '] ' + fmt(o));
      lines.push('        ' + resident(o));
    });
  }
  lines.push('elapsed=' + (Date.now() - t0) + 'ms  n=' + n);
  document.getElementById('out').textContent = 'SIMDONE\n' + lines.join('\n');
  } catch (e) {
    document.getElementById('out').textContent = 'SIMFAIL\n' + (e && e.stack ? e.stack : String(e)) +
      '\npartial:\n' + lines.join('\n');
  }
})();
</script>
</body>
</html>
