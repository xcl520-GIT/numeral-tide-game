    } catch (e) { fail('背包三件事测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 32. 选牌界面：← → 选择 + 空格确认 ----------
    // 这一节要盯两件事：
    //   ① 高亮**真的**跟着走（算了但没画 = 玩家不知道自己会选到谁）
    //   ② 空格确认的是"当前高亮那一张"，而且不能顺带消耗一个回合
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gR = w.TideMain.game;
      var relAll = w.TideData.RELICS;
      gR.pendingRelic = [relAll[0], relAll[1], relAll[2]];
      gR.relics = [];
      var turnR = gR.turn;
      w.TideUI.render(gR);                 // 让秘藏弹窗渲染出来

      var cardsR = d.querySelectorAll('#relic-cards .relic-card');
      if (cardsR.length !== 3) fail('秘藏弹窗没有渲染出 3 张牌: ' + cardsR.length);
      else if (!cardsR[0].classList.contains('on')) fail('打开时第 1 张没有被标记为选中');
      else ok('选牌界面：3 张牌都渲染出来了，默认选中第 1 张');

      var kdR = function (k) {
        w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
      };

      kdR('ArrowRight');
      var sel1 = w.TideUI.relicSelectedIndex();
      if (sel1 !== 1) fail('→ 没有把光标移到第 2 张: ' + sel1);
      else if (!cardsR[1].classList.contains('on') || cardsR[0].classList.contains('on')) {
        fail('光标移了，但卡片上的高亮没跟着走（算了但没画）');
      } else ok('按 → 光标移到第 2 张，高亮同步跟走');

      kdR('ArrowLeft'); kdR('ArrowLeft');   // 应从第 2 张回绕到第 3 张
      var sel2 = w.TideUI.relicSelectedIndex();
      if (sel2 !== 2) fail('← ← 没有两端回绕到第 3 张: ' + sel2);
      else ok('光标两端回绕正确（← 从第 1 张绕到第 3 张）');

      kdR('ArrowRight');                    // 从第 3 张绕回第 1 张（六步一步就够）
      if (w.TideUI.relicSelectedIndex() !== 0) fail('→ 回绕失败');
      else ok('→ 两端回绕也正确（从第 3 张绕回第 1 张）');

      // 空格确认「当前高亮」那一张 —— 先把它挪到第 3 张，看选的到底是谁
      kdR('ArrowLeft');
      var wantId = gR.pendingRelic[2].id;
      if (w.TideUI.relicSelectedIndex() !== 2) fail('准备阶段：光标没停在第 3 张');
      kdR(' ');
      if (gR.pendingRelic) fail('空格没有确认选牌（pendingRelic 还在）');
      else if (gR.relics.indexOf(wantId) < 0) {
        fail('空格确认的不是当前高亮那张（拿到 ' + JSON.stringify(gR.relics) + '，期望 ' + wantId + '）');
      } else if (gR.turn !== turnR) {
        fail('选牌顺带消耗了一个回合: ' + turnR + ' → ' + gR.turn);
      } else {
        ok('空格确认的是**当前高亮**那一张（' + wantId + '），且没有顺带消耗回合');
      }

      // 回车等价于空格
      gR.pendingRelic = [relAll[3], relAll[4], relAll[5]];
      gR.relics = [];
      w.TideUI.render(gR);
      var cardsR2 = d.querySelectorAll('#relic-cards .relic-card');
      if (cardsR2.length !== 3 || !cardsR2[0].classList.contains('on')) {
        fail('重开一次选牌没有重置光标到第 1 张');
      } else {
        kdR('Enter');
        if (gR.pendingRelic) fail('回车没有确认选牌');
        else ok('回车同样可以确认，且重开选牌时光标会重置到第 1 张');
      }
    } catch (e) { fail('选牌键盘测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 33. 选牌界面：← → 选择 + 空格确认 ----------
    // 最关键的一条：空格必须选中**光标所在的那一张**。
    // 写成"空格 = 选第一张"同样能让大部分检查通过，但玩家一按就发现不对。
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gR2 = w.TideMain.game;
      gR2.pendingRelic = gR2._offerRelics();
      w.TideUI.render(gR2);
      var rmod2 = d.getElementById('relic-modal');
      var cards2 = d.querySelectorAll('#relic-cards .relic-card');
      if (rmod2.classList.contains('hidden') || cards2.length < 2) {
        fail('秘藏弹窗没打开或卡片太少，测不了键盘选牌');
      } else {
        var onIdx = function () {
          var r = -1;
          Array.prototype.forEach.call(cards2, function (el, i) { if (el.classList.contains('on')) r = i; });
          return r;
        };
        var kR = function (k) {
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
        };

        // ① 打开就默认选中第一张，且 .on **真的画在那一张上**
        if (w.TideUI.relicSelectedIndex() !== 0) fail('选牌打开时没有默认选中第一张');
        else if (onIdx() !== 0) fail('选中态没画到第一张上（.on 不生效 = 玩家看不见）');
        else ok('选牌界面打开时默认选中第一张，且高亮真的画在卡片上');

        // ② → 移动、← 回退、两端回绕
        kR('ArrowRight');
        if (w.TideUI.relicSelectedIndex() !== 1) fail('按 → 没有移动选中项: ' + w.TideUI.relicSelectedIndex());
        else if (onIdx() !== 1) fail('移动后高亮没有跟着走');
        else ok('→ 能移动选中项，视觉高亮同步');

        var nR = cards2.length;
        for (var ri2 = 0; ri2 < nR; ri2++) kR('ArrowRight');
        if (w.TideUI.relicSelectedIndex() !== 1) {
          fail('两端回绕不对：绕一圈应回到 1，实际 ' + w.TideUI.relicSelectedIndex());
        } else ok('选中项两端会回绕（绕一圈回到原位，不卡住也不越界）');
        kR('ArrowLeft');
        if (w.TideUI.relicSelectedIndex() !== 0) fail('按 ← 没有回退');

        // ③ **空格确认的是光标那一张**，不是第一张
        kR('ArrowRight');
        var targetR = cards2[1].dataset.id;
        var relicsB2 = gR2.relics.length;
        kR(' ');
        if (gR2.relics.length !== relicsB2 + 1) fail('空格没有确认选牌');
        else if (gR2.relics[gR2.relics.length - 1] !== targetR) {
          fail('空格选中的不是光标那一张（期望 ' + targetR + '，实际 ' +
            gR2.relics[gR2.relics.length - 1] + '）');
        } else if (gR2.pendingRelic) fail('空格确认后 pendingRelic 没有清空');
        else if (!d.getElementById('relic-modal').classList.contains('hidden')) fail('确认后弹窗没关');
        else ok('空格确认的是**光标那一张**，且状态正确清空、弹窗关闭');

        // ④ 鼠标悬停要与键盘光标同步（否则"我指着 B，按空格却选了 A"）
        gR2.pendingRelic = gR2._offerRelics();
        w.TideUI.render(gR2);
        var cards3 = d.querySelectorAll('#relic-cards .relic-card');
        if (cards3.length >= 2) {
          cards3[1].dispatchEvent(new w.MouseEvent('mouseenter', { bubbles: false }));
          if (w.TideUI.relicSelectedIndex() !== 1) {
            fail('鼠标移到第 2 张时键盘光标没同步: ' + w.TideUI.relicSelectedIndex());
          } else ok('鼠标悬停会同步键盘光标（两套输入不各记一套状态）');

          // ⑤ 新一次三选一要把光标复位到第一张
          gR2.pendingRelic = null;
          w.TideUI.render(gR2);
          gR2.pendingRelic = gR2._offerRelics();
          w.TideUI.render(gR2);
          if (w.TideUI.relicSelectedIndex() !== 0) {
            fail('新一次三选一没有复位光标: ' + w.TideUI.relicSelectedIndex());
          } else ok('新一次三选一会把光标复位到第一张（不沿用上一轮的位置）');
        }
        // 收尾：把待选状态清干净，别影响后面的断言
        if (gR2.pendingRelic) w.TideMain.chooseRelic(gR2.pendingRelic[0].id);
      }
    } catch (e) { fail('选牌键盘测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 32. 选牌界面：← → 选择 + 空格确认 ----------
    // 关键判据：**空格确认的必须是光标所在那一张**。
    // 写成"空格 = 选第一张"也能骗过一半检查，但玩家一按就发现不对 ——
    // 而那一刻恰好是"这一局往哪走"的决策点，错不起。
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gK = w.TideMain.game;
      gK.pendingRelic = gK._offerRelics();
      var nK = gK.pendingRelic.length;
      w.TideUI.render(gK);
      var cardsK = d.querySelectorAll('#relic-cards .relic-card');
      if (cardsK.length !== nK) fail('选牌卡片数量不对: ' + cardsK.length + ' vs ' + nK);
      else {
        var keyK = function (k) { w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true })); };

        // ① 打开时默认选中第一张，而且**画面上真的标出来了**
        if (w.TideUI.relicSelectedIndex() !== 0) fail('打开选牌时没有默认选中第一张');
        else if (!cardsK[0].classList.contains('on')) fail('选中项没有视觉标记（缺 .on）');
        else ok('选牌界面默认选中第一张，且视觉上有标记');

        // ② → 移动光标，高亮跟着走
        keyK('ArrowRight');
        if (w.TideUI.relicSelectedIndex() !== 1) fail('→ 没有移动光标: ' + w.TideUI.relicSelectedIndex());
        else if (!cardsK[1].classList.contains('on') || cardsK[0].classList.contains('on')) {
          fail('光标动了，但高亮标记没跟着走');
        } else ok('→ 能移动光标，高亮标记同步（0 → 1）');

        // ③ 两端回绕
        for (var wk = 0; wk < nK - 1; wk++) keyK('ArrowRight');
        if (w.TideUI.relicSelectedIndex() !== 0) fail('→ 走到末尾没有回绕: ' + w.TideUI.relicSelectedIndex());
        keyK('ArrowLeft');
        if (w.TideUI.relicSelectedIndex() !== nK - 1) fail('← 在开头没有回绕到最后一张');
        else ok('光标两端会回绕（' + nK + ' 张来回都能走通）');

        // ④ **空格确认的是光标那张** —— 此刻光标在最后一张，正好能把"永远选第一张"抓出来
        var beforeK = gK.relics.length;
        var wantIdx = w.TideUI.relicSelectedIndex();
        var wantId = cardsK[wantIdx].dataset.id;
        keyK(' ');
        if (gK.relics.length !== beforeK + 1) fail('空格没有确认选牌');
        else if (gK.relics[gK.relics.length - 1] !== wantId) {
          fail('空格确认的不是光标那张：期望第 ' + wantIdx + ' 张(' + wantId + ')，实际拿到 ' +
            gK.relics[gK.relics.length - 1]);
        } else if (gK.pendingRelic) fail('确认后 pendingRelic 没有清空');
        else ok('空格确认的是光标所在那一张（第 ' + wantIdx + ' 张），不是永远选第一张');

        // ⑤ 下一轮选牌要把光标复位（不能沿用上一轮的落点）
        gK.pendingRelic = gK._offerRelics();
        w.TideUI.render(gK);
        if (w.TideUI.relicSelectedIndex() !== 0) fail('新一次选牌没有把光标复位到第一张');
        else ok('新一次选牌光标复位到第一张（不沿用上一轮的位置）');

        // ⑥ 鼠标移到某张上，键盘光标必须跟着同步 ——
        //    两套输入各记一套状态的话，会出现"我指着 B，按空格却选了 A"
        var cardsK2 = d.querySelectorAll('#relic-cards .relic-card');
        cardsK2[cardsK2.length - 1].dispatchEvent(new w.MouseEvent('mouseenter', { bubbles: true }));
        if (w.TideUI.relicSelectedIndex() !== cardsK2.length - 1) {
          fail('鼠标移到某张上，键盘光标没有同步: ' + w.TideUI.relicSelectedIndex());
        } else ok('鼠标与键盘光标同步（不会出现「指着 B 却选了 A」）');

        if (gK.pendingRelic) w.TideMain.chooseRelic(gK.pendingRelic[0].id);
      }
    } catch (e) { fail('选牌键盘测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 34. 开始菜单层：入口、设置、音量、退出 ----------
    // 音量这一节要盯的是"分轨"：只有一条总音量的话，
    // 调 BGM 会把音效一起改掉，而玩家根本看不出来 —— 那种 bug 只能靠断言抓。
    try {
      var TS4 = w.TideSettings, AU4 = w.TideAudio, MU4 = w.TideMeta;
      if (!d.getElementById('menu-screen')) fail('没有开始菜单层（#menu-screen）');
      else {
        // 本节取元素的别名。**不要用 q** —— 它在第 213/306 行当过循环计数器，
        // 而 var 是函数作用域，重名会互相覆盖（sloppy 模式下不报错，只是行为变了）。
        var el4 = function (id) { return d.getElementById(id); };

        // ① 菜单是第 0 层：显示菜单、藏起选人界面
        w.TideUI.showMenu();
        if (el4('menu-screen').classList.contains('hidden')) fail('showMenu 之后菜单还是隐藏的');
        else if (!el4('title-screen').classList.contains('hidden')) fail('菜单显示时选人界面没有藏起来');
        else ok('开始菜单是第 0 层（菜单可见、选人界面隐藏）');

        // ② 作者名必须在
        var credit = d.querySelector('.menu-credit');
        if (!credit || (credit.textContent || '').indexOf('此冬歌咏') < 0) {
          fail('菜单里没有作者名（此冬歌咏）');
        } else ok('菜单里署了作者名（' + credit.textContent.trim() + '）');

        // ③ 开始游戏 → 进选人界面；Esc → 回菜单
        //    这一条要同时区分两种可能：按钮没绑上 / showTitle 本身坏了。
        //    只报"没进去"是查不动的，所以诊断信息随失败一起带出来。
        var bStart = el4('btn-menu-start');
        var hasFn = typeof bStart.onclick === 'function';
        bStart.click();
        if (el4('title-screen').classList.contains('hidden')) {
          w.TideUI.showTitle();       // 绕过按钮直接调一次，区分责任
          var directOk = !el4('title-screen').classList.contains('hidden');
          fail('点开始游戏没有进到选人界面【诊断】按钮onclick已绑=' + hasFn +
            ' disabled=' + bStart.disabled +
            ' 菜单当时可见=' + !el4('menu-screen').classList.contains('hidden') +
            ' 直接调showTitle能进去=' + directOk +
            (directOk ? '（→ 问题在按钮绑定）' : '（→ 问题在 showTitle 本身）'));
        } else if (!el4('menu-screen').classList.contains('hidden')) {
          fail('进选人界面后菜单没藏起来');
        } else {
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          if (el4('menu-screen').classList.contains('hidden')) fail('在选人界面按 Esc 没有回主菜单');
          else ok('开始游戏 → 选人界面，Esc → 回主菜单（层级是对的）');
        }

        // ④ 无尽模式：没通关时锁着
        MU4.reset();
        w.TideUI.renderMenu();
        if (!el4('btn-menu-endless').disabled) fail('一次都没通关，无尽模式却是可点的');
        else if ((el4('menu-endless-note').textContent || '').indexOf('未解锁') < 0) {
          fail('锁着的时候没有说明原因: ' + el4('menu-endless-note').textContent);
        } else ok('无尽模式未通关时锁着，并且写清了原因（不是只置灰）');

        // ⑤ 设置：滑块要反映存档，拖动要真的改音量且**分轨**
        w.TideUI.showSettings();
        if (el4('settings-modal').classList.contains('hidden')) fail('设置弹窗没打开');
        else {
          TS4.set('volSfx', 1); TS4.set('volBgm', 1);
          AU4.setVolume(1, 1);
          w.TideUI.renderSettings();
          if (Number(el4('set-vol-sfx').value) !== 100) fail('音效滑块没有反映存档值: ' + el4('set-vol-sfx').value);
          // 拖音效滑块
          el4('set-vol-sfx').value = 40;
          el4('set-vol-sfx').dispatchEvent(new w.Event('input', { bubbles: true }));
          var vv = AU4.getVolume();
          if (Math.abs(vv.sfx - 0.4) > 0.001) fail('拖音效滑块没有改到运行时音量: ' + vv.sfx);
          else if (Math.abs(vv.bgm - 1) > 0.001) fail('调音效竟然把 BGM 一起改了（没有分轨）: ' + vv.bgm);
          else if (Math.abs(TS4.get('volSfx') - 0.4) > 0.001) fail('音效音量没有写进存档');
          else ok('音量分轨正确：拖音效只改音效（0.4），BGM 保持 1.0，且写进存档');

          // 拖 BGM 滑块
          el4('set-vol-bgm').value = 20;
          el4('set-vol-bgm').dispatchEvent(new w.Event('input', { bubbles: true }));
          var vv2 = AU4.getVolume();
          if (Math.abs(vv2.bgm - 0.2) > 0.001) fail('拖 BGM 滑块没有改到 BGM 音量: ' + vv2.bgm);
          else if (Math.abs(vv2.sfx - 0.4) > 0.001) fail('调 BGM 把音效一起改了: ' + vv2.sfx);
          else ok('拖 BGM 只改 BGM（0.2），音效保持 0.4');
        }

        // ⑥ 清档要两步，不能一击抹掉
        var mBefore = w.TideMeta.load();
        MU4.save({ crystals: 777, total: 777, owned: { pouch1: 1 }, runs: 9, wins: 1, best: 5 });
        el4('btn-wipe').click();
        if (w.TideMeta.load().crystals !== 777) fail('清档一次点击就生效了（不可逆操作不该一击致命）');
        else if ((el4('btn-wipe').textContent || '').indexOf('再点') < 0) fail('第一次点击没有提示需要再点一次');
        else {
          el4('btn-wipe').click();
          if (w.TideMeta.load().crystals !== 0) fail('第二次点击没有真的清空存档');
          else ok('清档是两步确认：第一次只提示，第二次才真的清空');
        }
        w.TideUI.closeSettings();

        // ⑦ 排行榜弹窗能开、空状态有话说
        w.TideUI.showBoard();
        if (el4('board-modal').classList.contains('hidden')) fail('排行榜弹窗没打开');
        else if ((el4('board-list').textContent || '').indexOf('还没有记录') < 0) {
          fail('排行榜空状态没有给出说明');
        } else if ((el4('board-modal').textContent || '').indexOf('本机') < 0) {
          fail('排行榜没有说明它是"本机"榜 —— 玩家会以为分数上传了');
        } else ok('排行榜弹窗可打开，空状态有说明，并写明是「本机」榜');
        w.TideUI.closeBoard();

        // ⑧ 退出游戏：浏览器里没有宿主，必须给实话而不是静默失败
        var threwQ = false;
        try { w.TideUI.quitGame(); } catch (e) { threwQ = true; }
        if (threwQ) fail('退出游戏在浏览器环境里抛异常了（没有宿主时要能优雅退化）');
        else ok('退出游戏在没有宿主（浏览器）时会优雅退化，不抛异常');
      }
    } catch (e) { fail('开始菜单测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 35. 区域画面层：染色 / 标签 / 小地图 / 出口导航 / 横幅 ----------
    // 区域划分在模型层已经是对的（core._buildRegions）。这一节盯的是另一件事：
    // **划分是玩家看不见的东西，看不见的规则等于没有规则。**
    // 所以这里查的是"画出来了没有""画的位置对不对"——
    // 这类 bug（算了但没画 / 标签浮在墙里）在模型层测试里永远抓不到。
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gRg = w.TideMain.game;
      var rgs = gRg.regions || [];

      // ① 划分本身存在，且数量在合理区间
      if (rgs.length < 3 || rgs.length > 6) fail('区域数不在 3~6: ' + rgs.length);
      else ok('区域划分存在：' + rgs.length + ' 个 [' +
        rgs.map(function (r) { return r.type; }).join(' ') + ']');

      // ② 每个可走格都有归属（是划分，不是重叠/漏掉）
      var orphan = 0, walkTotal = 0;
      for (var ri0 = 0; ri0 < gRg.W * gRg.H; ri0++) {
        if (!gRg.walkable(ri0 % gRg.W, (ri0 / gRg.W) | 0)) continue;
        walkTotal++;
        if (gRg.regionOf[ri0] < 0) orphan++;
      }
      if (orphan) fail('有 ' + orphan + ' 个可走格没有归属区域');
      else ok('每个可走格都恰好属于一个区域（' + walkTotal + ' 格，0 个孤儿）');

      // ③ 出口必须在守门区里 —— 否则"往哪走"就没有确定的答案
      var gateR = rgs[gRg.gateRegion];
      if (!gateR || gateR.type !== 'gate') fail('出口不在守门区里: ' + (gateR && gateR.type));
      else ok('出口固定落在守门区（gateRegion=' + gRg.gateRegion + '）');

      // ④ 标签锚点必须落在自己区域内。
      //    这是最容易错又最难肉眼发现的一条：区域重心常常正好落在一堵墙里，
      //    粗暴取重心会让名字浮在墙上，看起来像地图糊了一块。
      var badAnchor = 0, anchorTxt = [];
      for (var ri = 0; ri < rgs.length; ri++) {
        var at = w.TideRender.regionLabelAnchor(gRg, rgs[ri]);
        if (!at || gRg.regionAt(at.x, at.y) !== rgs[ri].id) { badAnchor++; continue; }
        anchorTxt.push(rgs[ri].type + '@' + at.x + ',' + at.y);
      }
      if (badAnchor) fail('有 ' + badAnchor + ' 个区域标签的锚点不在自己区域内（会浮在墙上）');
      else ok('区域标签锚点全部落在自己区域内（' + anchorTxt.join('  ') + '）');

      // ⑤ 真的画出来了：渲染一帧后标签计数必须 > 0
      w.TideRender.resize();
      w.TideRender.render(gRg, {}, { x: 0, y: 0 }, 16);
      var drawnLabels = w.TideRender.regionLabels;
      if (!drawnLabels) fail('渲染一帧后一个区域标签都没画出来（算了但没画）');
      else ok('区域标签真的画出来了：这一帧 ' + drawnLabels + ' 个');

      // ⑥ 小地图按区域上色 —— 读的是烘焙出来的**真实像素**，
      //    而不是"照着配置再算一遍颜色"（那等于把配置抄两遍）
      var pickFloor = function (regId) {
        for (var yy = 0; yy < gRg.H; yy++) {
          for (var xx = 0; xx < gRg.W; xx++) {
            var ii = yy * gRg.W + xx;
            if (gRg.regionOf[ii] === regId && gRg.tiles[ii] === w.TideCore.T.FLOOR) return { x: xx, y: yy };
          }
        }
        return null;
      };
      // 小地图只画"走过的地方"，不全开探索就只能采到背景色 ——
      // 那样断言会**假通过**（背景色上下确实不一样），却什么也没验证到。
      gRg.explored.fill(1);
      w.TideRender.markDirty();
      w.TideRender.render(gRg, {}, { x: 0, y: 0 }, 16);
      var isBg = function (p) {
        return Math.abs(p[0] - 6) < 4 && Math.abs(p[1] - 9) < 4 && Math.abs(p[2] - 17) < 4;
      };
      var fa = pickFloor(0), fb = null, fbId = -1;
      for (var rk0 = 1; rk0 < rgs.length; rk0++) {
        fb = pickFloor(rk0);
        if (fb) { fbId = rk0; break; }
      }
      if (!fa || !fb) fail('找不到两个区域的地板格来对比小地图配色');
      else {
        var pa = w.TideRender.miniPixelAt(fa.x, fa.y);
        var pb = w.TideRender.miniPixelAt(fb.x, fb.y);
        if (!pa || !pb) fail('小地图没有烘焙出来（拿不到像素）');
        else if (isBg(pa) || isBg(pb)) {
          fail('采样点是小地图底色，说明这两格压根没画出来（这条断言会假通过）: ' +
            pa.join(',') + ' / ' + pb.join(','));
        } else if (pa[0] === pb[0] && pa[1] === pb[1] && pa[2] === pb[2]) {
          fail('两个不同区域在小地图上是同一个颜色（等于没上色）: ' +
            pa.join(',') + ' vs ' + pb.join(','));
        } else {
          ok('小地图按区域上色：区域0 rgb(' + pa.slice(0, 3).join(',') +
            ') ≠ 区域' + fbId + ' rgb(' + pb.slice(0, 3).join(',') + ')');
        }
      }

      // ⑦ 出口导航：要能说清"往哪走"
      var navTxt = w.TideRender.exitNav || '';
      if (!navTxt) fail('出口导航是空的（小地图上方那一行没写出来）');
      else if (navTxt.indexOf('出口') !== 0) fail('出口导航没有以「出口」开头: ' + navTxt);
      else if (!/北|南|东|西|本区/.test(navTxt)) fail('出口导航既没有方向也没说"就在本区": ' + navTxt);
      else ok('出口导航：' + navTxt);

      // ⑧ 跨区横幅 —— 这条链是「模型事件 → 主循环消费 → 界面画出来」，
      //    缺任何一环都只剩一个没人看的 events 数组
      //    （v10.5 的"融合没有弹出东西"就是这条链断在半路）
      var farReg = null;
      for (var rj = 0; rj < rgs.length; rj++) {
        if (rgs[rj].id !== gRg.playerRegion) { farReg = rgs[rj]; break; }
      }
      if (!farReg) fail('没有第二个区域可以走进去');
      else {
        var spot = w.TideRender.regionLabelAnchor(gRg, farReg);
        gRg.px = spot.x; gRg.py = spot.y;
        gRg._checkRegion();
        var hadEv = false;
        for (var ke = 0; ke < gRg.events.length; ke++) {
          if (gRg.events[ke].kind === 'region') hadEv = true;
        }
        if (!hadEv) fail('走进新区域后模型层没有产出 region 事件');
        w.TideMain.flush();                 // 和真实流程走同一条消费路径
        var bs = w.TideUI.regionBannerState();
        if (!bs) fail('界面上根本没有区域横幅元素');
        else if (!bs.shown) fail('跨区之后横幅没有显示出来');
        else if ((bs.text || '').indexOf('进入') < 0) fail('横幅文案不对: ' + bs.text);
        else if ((bs.text || '').indexOf('\u2605') < 0) fail('横幅里没有危险度星: ' + bs.text);
        else if (bs.rtype !== farReg.type) {
          fail('横幅报的是别的区域: ' + bs.rtype + ' vs ' + farReg.type);
        } else {
          ok('跨区会弹横幅：「' + bs.text.replace(/\s+/g, '') + '」（类别 ' + bs.rtype + '）');
        }
      }

      // ⑨ 区域类型得**真的有玩法差异**，否则它只是一种颜色。
      //    这里必须扫多个种子：区域类型是随机的，某一层恰好没有精英区很正常，
      //    而"恰好没有"如果让断言直接跳过，那这条断言就等于不存在
      //    （教训：可变条件上的断言，要么保证能跑到，要么就是在装样子）。
      var eliteSeen = 0, eliteWithMob = 0, eliteBad = 0;
      var rewardSeen = 0, rewardGood = 0, rewardBad = [];
      // 第 1 层是教学层，按设计不设精英 / 危险区（见 core.js 的 5b）——
      // 所以"扫精英区"必须往下一层看，否则扫 8 个种子也扫不到（这正是它的联动）。
      var g1 = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 70001 });
      var t1 = (g1.regions || []).map(function (r) { return r.type; });
      if (t1.indexOf('elite') >= 0 || t1.indexOf('hazard') >= 0) {
        fail('第 1 层出现了高难区域（它是教学层，不该开局就劝退）: ' + t1.join('/'));
      } else ok('第 1 层是教学层：只有 ' + t1.join('/') + '，没有精英区 / 危险区');

      for (var sd = 0; sd < 8; sd++) {
        var gg = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 70001 + sd });
        gg.depth = 2; gg._buildLevel(2);      // 往下一层看，高难区在那里
        var grs2 = gg.regions || [];
        for (var qi = 0; qi < grs2.length; qi++) {
          var rg2 = grs2[qi];
          if (rg2.type === 'elite') {
            eliteSeen++;
            var nE = 0, nElite = 0;
            for (var ei = 0; ei < gg.enemies.length; ei++) {
              if (gg.enemies[ei].region !== rg2.id) continue;
              nE++;
              if (gg.enemies[ei].kind === 'elite') nElite++;
            }
            if (nE > 0) eliteWithMob++;
            // 只要求"至少一只精英"：敌人原型里本来就有天生 elite 的，
            // 它们会和"区域把第一只提拔成精英"叠加 —— "恰好一只"是过强的断言。
            if (nE > 0 && nElite < 1) eliteBad++;
          } else if (rg2.type === 'reward') {
            rewardSeen++;
            var nR = 0;
            for (var ei2 = 0; ei2 < gg.enemies.length; ei2++) {
              if (gg.enemies[ei2].region === rg2.id) nR++;
            }
            var hasChest = false;
            for (var ti = 0; ti < gg.W * gg.H; ti++) {
              if (gg.regionOf[ti] === rg2.id && gg.tiles[ti] === w.TideCore.T.CHEST) {
                hasChest = true; break;
              }
            }
            if (nR <= 1 && hasChest) rewardGood++;
            else rewardBad.push('seed' + (70001 + sd) + ':怪' + nR + ' 箱' + (hasChest ? '有' : '无'));
          }
        }
      }

      else ok('精英区真的不一样：' + eliteWithMob + ' 个有怪的精英区里都出现了精英怪（共扫到 ' +
        eliteSeen + ' 个精英区）');

      if (!rewardSeen) fail('扫了 8 个种子一个奖励区都没有');
      else if (rewardBad.length) fail('奖励区不满足"≤1 只怪 + 保底宝箱": ' + rewardBad.join(' | '));
      else ok('奖励区真的更安全：' + rewardSeen + ' 个奖励区全部满足「≤1 只怪 + 保底宝箱」');
    } catch (e) { fail('区域画面层测试异常: ' + (e && e.stack ? e.stack : e)); }
    // ---------- 36. 无尽模式 + 本机排行榜 ----------
    // 这一节盯三件事：
    //   ① 无尽模式**真的**没有终点（而不是按钮亮着、进去还是四层就结算）
    //   ② 分数只有一个执行点，两个模式用同一把尺子
    //   ③ 榜能吃下脏数据 —— 存档是可手改的，榜还是要画出来的
    try {
      /* ---- ① 无尽模式：走到门是"下一层"，不是"通关" ---- */
      var gEnd = new w.TideCore.Game({
        classKey: 'warlord', difficulty: 'standard', seed: 20260922, endless: true
      });
      if (!gEnd.endless) fail('Game 没有收下 endless 标志');
      else ok('无尽模式标志确实传到了模型层');

      gEnd.bossAlive = false;
      gEnd.px = gEnd.exit.x; gEnd.py = gEnd.exit.y;

      else if (gEnd.depth !== gEnd.diff.depth + 1) {

      } else ok('无尽模式走到门会继续下潜到第 ' + gEnd.depth + ' 层，不结算通关');

      // 对照组：普通模式在同一位置**必须**通关，否则就是把两边一起改坏了
      var gNrm = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 20260922 });
      gNrm.depth = gNrm.diff.depth;
      gNrm.bossAlive = false;
      gNrm.px = gNrm.exit.x; gNrm.py = gNrm.exit.y;
      gNrm._enterTile();

      else ok('对照：普通模式在最后一层走到门仍然正常通关');

      /* ---- ② 无尽模式的强度曲线：正篇之内不动，越过之后逐层加码 ---- */
      var RBASE = gEnd.diff.depth;
      var bk = [0, 1, 3, 6, 12].map(function (o) { return gEnd.endlessBoost(RBASE + o); });
      if (bk[0] !== 1) fail('正篇层数之内的无尽加成不是 1（会污染原有平衡）: ' + bk[0]);
      else if (!(bk[1] > 1 && bk[2] > bk[1] && bk[3] > bk[2] && bk[4] >= bk[3])) {
        fail('越出正篇之后的强度不是"单调递增且增速收敛": ' + bk.join(' → '));
      } else if (bk[4] > 3) fail('无尽加成没有上限（后期会变成直接秒杀）: ' + bk[4]);
      else ok('无尽强度曲线：正篇内 ×1，越出后 ' + bk.slice(1).map(function (v) {
        return '×' + v.toFixed(2);
      }).join(' → '));

      var gPlain = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 1 });
      if (gPlain.endlessBoost(20) !== 1) fail('非无尽模式的加成不是 1');
      else ok('非无尽模式的越级加成恒为 ×1（无尽没有污染正篇）');

      /* ---- ③ 击杀分类统计：分数要靠它们分类计价 ---- */
      var gK = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 4242 });
      if (gK.eliteKills !== 0 || gK.bossKills !== 0) fail('击杀分类没有从 0 开始');
      var fakeN = gK._makeEnemy(gK.px, gK.py, 1); fakeN.kind = 'normal';   // 池子里有 elite 原型，必须钉死
      gK._killEnemy(fakeN, true);
      if (gK.kills !== 1 || gK.eliteKills !== 0) fail('普通击杀被错记成精英');
      var fakeE = gK._makeEnemy(gK.px, gK.py, 1); fakeE.kind = 'elite';
      gK._killEnemy(fakeE, true);
      var fakeB = gK._makeEnemy(gK.px, gK.py, 1); fakeB.kind = 'boss'; fakeB.isBoss = true;
      gK._killEnemy(fakeB, true);
      if (gK.kills !== 3) fail('总击杀数不对: ' + gK.kills);
      else if (gK.eliteKills !== 1) fail('精英击杀没有被单独计数: ' + gK.eliteKills);
      else if (gK.bossKills !== 1) fail('守卫击杀没有被单独计数: ' + gK.bossKills);
      else ok('击杀分类正确：总 3 / 精英 1 / 守卫 1（分数才能分类计价）');

      /* ---- ④ 分数公式：只有一个执行点，难度越高分越高 ---- */
      var std = w.TideData.DIFFICULTIES.standard;
      var aby = w.TideData.DIFFICULTIES.abyss;
      var sMid = w.TideData.scoreOf({
        depth: 3, kills: 10, eliteKills: 2, bossKills: 1, status: 'dead', diff: std
      });
      if (sMid.base !== 800 || sMid.total !== 800) {
        fail('分数公式不对：base=' + sMid.base + ' total=' + sMid.total + '（期望 800）');
      } else ok('分数公式：第 3 层 / 10 杀 / 2 精英 / 1 守卫 = ' + sMid.total + ' 分（含逐项明细）');

      var sAbyss = w.TideData.scoreOf({
        depth: 3, kills: 10, eliteKills: 2, bossKills: 1, status: 'dead', diff: aby
      });
      if (sAbyss.total !== Math.round(800 * 1.25)) {
        fail('深渊难度系数没有生效: ' + sAbyss.total + '（期望 ' + Math.round(800 * 1.25) + '）');
      } else ok('难度是乘系数：同一份战绩在深渊 = ' + sAbyss.total + ' 分（×1.25）');

      // 反挂检查：**刷低难度不该赢过高难度**。
      // 这正是"乘系数而不是加分"要防的事，所以显式钉住。
      var sCasualD5 = w.TideData.scoreOf({ depth: 5, kills: 0, status: 'dead', diff: w.TideData.DIFFICULTIES.casual });
      var sStdD6 = w.TideData.scoreOf({ depth: 6, kills: 0, status: 'dead', diff: std });
      var sAbyssD5 = w.TideData.scoreOf({ depth: 5, kills: 0, status: 'dead', diff: aby });
      if (!(sAbyssD5.total > sStdD6.total && sStdD6.total > sCasualD5.total)) {
        fail('难度系数被层数盖过了（刷低难度更划算）: 休闲5层=' + sCasualD5.total +
          ' 标准6层=' + sStdD6.total + ' 深渊5层=' + sAbyssD5.total);
      } else ok('难度不会被层数盖过：休闲 5 层 ' + sCasualD5.total + ' < 标准 6 层 ' +
        sStdD6.total + ' < 深渊 5 层 ' + sAbyssD5.total);

      // 通关奖励要显著高于"多打一层"，否则最优解会变成在门口反复刷怪
      var sWin = w.TideData.scoreOf({ depth: 4, kills: 0, status: 'win', diff: std });
      var sDead = w.TideData.scoreOf({ depth: 4, kills: 0, status: 'dead', diff: std });
      if (sWin.total - sDead.total !== w.TideData.SCORE.winBonus) {
        fail('通关奖励没有算进去: ' + (sWin.total - sDead.total));
      } else if (sWin.total - sDead.total <= w.TideData.SCORE.perDepth) {
        fail('通关奖励不比"多打一层"高（最优解会变成刷怪）');
      } else ok('通关奖励 ' + w.TideData.SCORE.winBonus + ' 分，明显高于多打一层（' +
        w.TideData.SCORE.perDepth + ' 分）');

      /* ---- ⑤ 本机排行榜：入榜、排序、限长 ---- */
      w.TideMeta.reset();
      var rk1 = w.TideMeta.addScore({
        score: 500, mode: '普通', clsName: '破军', diffName: '标准', depth: 3, date: '2026-09-23'
      });
      if (rk1 !== 1) fail('榜里的第一条记录不是第 1 名: ' + rk1);
      var rk2 = w.TideMeta.addScore({
        score: 900, mode: '无尽', clsName: '幽影', diffName: '标准', depth: 6, date: '2026-09-23'
      });
      if (rk2 !== 1) fail('更高分没有排到第 1: ' + rk2);
      var mb = w.TideMeta.load();
      if (mb.board.length !== 2 || mb.board[0].score !== 900 || mb.board[1].score !== 500) {
        fail('榜没有按分数降序: ' + JSON.stringify((mb.board || []).map(function (x) { return x.score; })));
      } else ok('入榜正确：900 分排第 1、500 分排第 2');

      w.TideMeta.reset();
      for (var bi = 0; bi < 15; bi++) w.TideMeta.addScore({ score: bi * 10, depth: 1 });
      var fullB = w.TideMeta.load();
      if (fullB.board.length !== 10) fail('榜没有截到 10 条: ' + fullB.board.length);
      else if (fullB.board[0].score !== 140) fail('截断后首名不对: ' + fullB.board[0].score);
      else ok('榜只留前 10 条，且截断后仍然按分数降序');

      /* ---- ⑥ 榜要吃下脏数据 ---- */
      var dirty = w.TideMeta.sanitize({
        crystals: -5,
        board: [{}, { score: 1e30 }, null, 'not-an-object',
          { score: 100, depth: -3, mode: { a: 1 }, clsName: null }]
      });
      if (!Array.isArray(dirty.board)) fail('board 没有净化成数组');
      else if (dirty.board.some(function (b) { return !isFinite(b.score) || b.score < 0; })) {
        fail('榜里出现了非法分数: ' + JSON.stringify(dirty.board));
      } else if (dirty.board.some(function (b) { return typeof b.mode !== 'string'; })) {
        fail('榜里的 mode 没有转成字符串（界面上会显示 [object Object]）');
      } else {
        ok('排行榜净化：空对象 / 超天数字 / 非对象全部就地修好或丢弃（' +
          dirty.board.length + ' 条存活）');
      }

      /* ---- ⑦ 界面：无尽模式 HUD 与结算上的分数 ---- */
      w.TideMeta.reset();
      w.TideMain.start({ mode: 'endless', seed: 20260922, meta: null });
      var gUI = w.TideMain.game;
      if (!gUI.endless) fail('start({mode:"endless"}) 没有把无尽标志传进模型层');
      w.TideUI.render(gUI);
      var hdTxt = (el4('h-depth').textContent || '');
      if (hdTxt.indexOf('\u221e') < 0) fail('无尽模式的深度显示不是 "n / ∞": ' + hdTxt);
      else ok('无尽模式 HUD 深度显示：' + hdTxt);

      gUI.status = 'dead';
      gUI.reason = '冒烟测试';
      w.TideUI.showOver(gUI);
      var ovTxt = (el4('over-body').textContent || '');
      if (ovTxt.indexOf('分') < 0) fail('结算界面没有显示分数');
      else if (ovTxt.indexOf('本机第') < 0) fail('结算界面没有显示本机名次');
      else if (ovTxt.indexOf('难度') < 0) fail('结算界面没有显示难度');
      else ok('结算界面：显示了总分 / 本机名次 / 逐项明细');
      var ranked = w.TideMeta.load().board.length;
      if (ranked !== 1) fail('结算没有把这一局写进榜: ' + ranked);
      else ok('结算确实写进了本机榜（' + ranked + ' 条）');

      // 幂等：结算界面会被重绘，写榜必须只发生一次
      w.TideUI.showOver(gUI);
      w.TideUI.showOver(gUI);
      var again = w.TideMeta.load().board.length;
      if (again !== 1) fail('重复打开结算界面给同一局插了 ' + again + ' 条榜');
      else ok('结算幂等：重复打开结算界面不会给同一局重复写榜');

      w.TideUI.showBoard();
      var bTxt = (el4('board-list').textContent || '');
      if (bTxt.length < 4 || bTxt.indexOf('还没有记录') >= 0) fail('排行榜弹窗没有画出记录');
      else ok('排行榜弹窗画出了记录（含职业 / 难度 / 层数 / 日期）');
      w.TideUI.closeBoard();
      w.TideMeta.reset();
    } catch (e) { fail('无尽模式与排行榜测试异常: ' + (e && e.stack ? e.stack : e)); }
    // ---------- 37. 操作指南：一份数据 + 与真实按键一致 ----------
    try {

      if (K.length < 8) fail('按键表条目太少: ' + K.length);
      else ok('按键表存在：' + K.length + ' 条（这是全项目唯一一份按键说明）');

      var brokenK = K.filter(function (k) {

      });

      else ok('按键表每条都有：动作名 / 适用界面 / 键面 / 说明');

      // 三个界面都得有内容 —— 缺一个就说明"随界面变化"是假的
      var scopeMiss = ['game', 'inv', 'relic'].filter(function (s) {
        return !K.some(function (k) { return k.scope.indexOf(s) >= 0; });
      });
      if (scopeMiss.length) fail('这些界面没有对应的按键条目: ' + scopeMiss.join(','));
      else ok('三个界面（局内 / 背包 / 选牌）都有对应的按键条目');

      // ---- 面板本身 ----
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gGd = w.TideMain.game;
      w.TideUI.render(gGd);
      var gs0 = w.TideUI.guideState();
      if (!gs0) fail('界面上没有操作指南面板');
      else if (gs0.hidden) fail('局内没有显示操作指南');
      else if (gs0.scope !== 'game') fail('局内指南的 scope 不对: ' + gs0.scope);
      else if (!gs0.rows) fail('指南一行都没画出来');
      else ok('局内指南渲染正常：' + gs0.rows + ' 行，scope=game');

      // ---- 随界面变化（这条是"指南"存在的理由）----
      w.TideUI.openInventory('bag');
      w.TideUI.render(gGd);
      var gs1 = w.TideUI.guideState();
      w.TideUI.closeInventory();

      gGd.pendingRelic = [w.TideData.RELICS[0], w.TideData.RELICS[1], w.TideData.RELICS[2]];
      w.TideUI.render(gGd);
      var gs2 = w.TideUI.guideState();
      gGd.pendingRelic = null;

      if (gs1.scope !== 'inv') fail('背包打开时指南没有换成背包那一套: ' + gs1.scope);
      else if (gs1.text.indexOf('关闭背包') < 0) fail('背包指南里没有"关闭背包"');
      else if (gs2.scope !== 'relic') fail('选牌时指南没有换成选牌那一套: ' + gs2.scope);
      else if (gs2.text.indexOf('移动光标') < 0) fail('选牌指南里没有"移动光标"');
      else if (gs0.text === gs1.text || gs1.text === gs2.text) {
        fail('三套指南的内容没有真正区分开（换界面等于没换）');
      } else ok('指南随界面变化：局内 ' + gs0.rows + ' 行 / 背包 ' + gs1.rows +
        ' 行 / 选牌 ' + gs2.rows + ' 行，内容各不相同');

      // ---- 折叠：要能收起来，且状态写进存档 ----
      w.TideSettings.reset();
      var openBefore = w.TideUI.guideState().open;
      var openAfter = w.TideUI.toggleGuide();
      if (openAfter === openBefore) fail('折叠没有切换状态');
      else if (w.TideSettings.get('guide') !== openAfter) {
        fail('折叠状态没有写进存档（下次进来会弹回去）');
      } else {
        ok('折叠生效且写进存档（' + openBefore + ' → ' + openAfter + '）');
      }
      w.TideUI.toggleGuide();                       // 恢复
      if (!w.TideUI.guideState().open) fail('再折叠一次没能展开回来');

      /* ============================================================
         ⑦ 最要紧的一条：**表里写的键，按下去必须真的有效**

         为什么用行为验证而不是"查代码里有没有这个字符串"：
         后者只能证明代码里提到了它，证明不了按下去有用。
         而"指南上写着、按下去没反应"恰恰是最坏的一种不一致 ——
         玩家会先怀疑自己按错了。

         豁免名单：不靠键盘的条目（鼠标双击 / 滚轮 / 点页签）必须显式登记，
         否则新增一条"没有验证"的说明会被默默放过。
         ============================================================ */
      var NO_KEY = { autoEquip: 1, zoom: 1, bagTab: 1 };
      var fire = function (key) {
        w.dispatchEvent(new w.KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
        w.dispatchEvent(new w.KeyboardEvent('keyup', { key: key, bubbles: true, cancelable: true }));
      };
      var closeAllUI = function () {
        try { if (w.TideUI.isPauseOpen()) w.TideUI.closePause(); } catch (e) { }
        try { if (w.TideUI.isInventoryOpen()) w.TideUI.closeInventory(); } catch (e) { }
        try { if (w.TideUI.isHelpOpen()) w.TideUI.closeHelp(); } catch (e) { }
        try { if (w.TideUI.isMetaOpen()) w.TideUI.closeMeta(); } catch (e) { }
        try { if (w.TideUI.isBoardOpen()) w.TideUI.closeBoard(); } catch (e) { }
        try { if (w.TideUI.isSettingsOpen()) w.TideUI.closeSettings(); } catch (e) { }
      };

      var PROBE = {
        move: function () {
          var g = w.TideMain.game, t0 = g.turn;
          ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].forEach(fire);
          return g.turn > t0;
        },
        wait: function () {
          var g = w.TideMain.game, t0 = g.turn;
          fire(' ');
          return g.turn > t0;
        },
        atkP: function () {
          // 先掰到对侧再按：否则"本来就是 p"会让按键看起来没反应，
          // 探针就退化成了永真的假验证。
          var g = w.TideMain.game;
          g.atkType = 'm';
          fire('1');
          return g.atkType === 'p';
        },
        atkM: function () {
          var g = w.TideMain.game;
          g.atkType = 'p';
          fire('2');
          return g.atkType === 'm';
        },
        skill: function () {
          var g = w.TideMain.game;
          var foe = g._makeEnemy(g.px, g.py, g.depth);
          foe.x = g.px + 1; foe.y = g.py;
          g.enemies.push(foe);
          var u0 = g.skillUses;
          fire('q');
          var used = g.skillUses > u0;
          var at = g.enemies.indexOf(foe);
          if (at >= 0) g.enemies.splice(at, 1);
          return used;
        },
        bag: function () {
          var v0 = w.TideUI.isInventoryOpen();
          fire('e');
          var v1 = w.TideUI.isInventoryOpen();
          if (v1 !== v0) { if (v1) fire('e'); return true; }
          return false;
        },
        help: function () {
          var v0 = w.TideUI.isHelpOpen();
          fire('h');
          var v1 = w.TideUI.isHelpOpen();
          if (v1 !== v0) { if (v1) fire('h'); return true; }
          return false;
        },
        mute: function () {
          var o0 = w.TideAudio.isOn();
          fire('m');
          var o1 = w.TideAudio.isOn();
          if (o1 !== o0) { fire('m'); return true; }
          return false;
        },
        pause: function () {
          fire('Escape');
          var p = w.TideUI.isPauseOpen();
          if (p) fire('Escape');
          return p;
        },
        guide: function () {
          var o0 = w.TideUI.guideState().open;
          fire('g');
          var o1 = w.TideUI.guideState().open;
          if (o1 !== o0) { fire('g'); return true; }
          return false;
        },
        closeInv: function () {
          w.TideUI.openInventory('bag');
          fire('e');
          return !w.TideUI.isInventoryOpen();
        },
        relicMove: function () {
          var g = w.TideMain.game;
          g.pendingRelic = [w.TideData.RELICS[0], w.TideData.RELICS[1], w.TideData.RELICS[2]];
          w.TideUI.render(g);
          var i0 = w.TideUI.relicSelectedIndex();
          fire('ArrowRight');
          var i1 = w.TideUI.relicSelectedIndex();
          g.pendingRelic = null;
          return i1 !== i0;
        },
        relicPick: function () {
          var g = w.TideMain.game;
          g.pendingRelic = [w.TideData.RELICS[0], w.TideData.RELICS[1], w.TideData.RELICS[2]];
          w.TideUI.render(g);
          fire(' ');
          var gone = !g.pendingRelic;
          g.pendingRelic = null;
          return gone;
        }
      };

      var acts = [];
      K.forEach(function (k) { if (acts.indexOf(k.act) < 0) acts.push(k.act); });

      var noProbe = acts.filter(function (a) { return !NO_KEY[a] && !PROBE[a]; });
      var badAct = [];
      var goodAct = [];
      acts.forEach(function (a) {
        if (NO_KEY[a]) { goodAct.push(a + '(非键盘)'); return; }
        w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
        closeAllUI();
        try {
          if (PROBE[a]()) goodAct.push(a); else badAct.push(a);
        } catch (e) { badAct.push(a + '(' + (e && e.message) + ')'); }
      });

      if (noProbe.length) {
        fail('按键表里有动作既没登记豁免、也没有行为验证: ' + noProbe.join(', '));
      } else if (badAct.length) {
        fail('这些动作在指南里写着、按下去却没反应: ' + badAct.join(', '));
      } else {
        ok('指南与真实按键一致：' + acts.length + ' 个动作逐条验证通过（' +
          goodAct.length + ' 个有实际行为，' + (acts.length - goodAct.length) + ' 个已登记为非键盘）');
      }
      closeAllUI();
      w.TideMeta.reset();
    } catch (e) { fail('操作指南测试异常: ' + (e && e.stack ? e.stack : e)); }

// ---------- 38. 逐回合战斗：走进敌人 → 菜单 → 出手 → 收尾 ----------
/* 要断言的五件事：
     ① 走进敌人 → 战斗层打开 + 指令菜单只出入参（不给结论）
     ② 开战瞬间**不许**动模型 —— 收尾必须等对决真正打完
     ③ 1 / 2 / 空格 三个入口都能出手，而且用的是选中的那一路
     ④ 对决内的姿态轮换会发生；不传 src 的合成对决不会
     ⑤ aiStance 开关能关掉整件事（对照组必须真实存在）

   两条硬要求：

   一、必须用**真实按键**走进去，不能直接调 g.stepTo()。
       战斗界面是 main.js 的 afterAction 打开的，绕开输入层直接调模型，
       战斗层根本不会出现 —— 那样测到的只是模型，
       测不到"玩家到底见不见得到这个界面"，而这一节的重点恰恰是界面。

   二、冒烟是同步的，演出是 setTimeout 驱动的。
       所以每验完一个键就立刻 closeBattle() 掐掉定时器，改为直接驱动模型。
       不这么做的话，断言会取决于动画跑到第几帧 —— 也就是时好时坏。 */
try {
  w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
  var gB = w.TideMain.game;
  closeAllUI();

  var kd = function (key) {
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: key, bubbles: true }));
    w.dispatchEvent(new w.KeyboardEvent('keyup', { key: key, bubbles: true }));
  };
  var KEYDIR = [['ArrowRight', 1, 0], ['ArrowLeft', -1, 0], ['ArrowDown', 0, 1], ['ArrowUp', 0, -1]];
  /* 把最近的敌人挪到玩家旁边，再按**真实的移动键**走进去。
     返回 null 表示失败（四周没有空位 / 按了键却没进战斗）。 */
  var enterDuel = function () {
    if (!gB.enemies.length || gB.status !== 'playing') return 'no-enemy';
    var pick = null;
    for (var i = 0; i < 4; i++) {
      var nx = gB.px + KEYDIR[i][1], ny = gB.py + KEYDIR[i][2];
      if (gB.walkable(nx, ny) && !gB.enemyAt(nx, ny)) {
        pick = { k: KEYDIR[i][0], x: nx, y: ny };
        break;
      }
    }
    if (!pick) return 'blocked';
    var e = gB.enemies[0];
    e.x = pick.x; e.y = pick.y;
    kd(pick.k);
    return w.TideUI.isBattleOpen() ? null : 'not-open';
  };
  var playerRec = function (duel, from) {
    for (var i = from; i < duel.log.length; i++) {
      if (duel.log[i].from === gB.cls.name) return duel.log[i];
    }
    return null;
  };
  var drainDuel = function () {
    var guard = 0;
    while (gB.liveFight && guard++ < 300) {
      var rr = gB.duelRound('p');
      if (!rr || rr.finished) break;
    }
    return guard;
  };

  // ---- A. 走进敌人 → 菜单 → 1 键出手 ----
  var errA = enterDuel();
  if (errA) fail('第一场：没能用真实按键进入战斗（' + errA + '）');
  else if (!gB.liveFight) fail('战斗层开了，但模型里没有 liveFight');
  else {
    var t0 = gB.turn;
    var cmdEl = d.getElementById('bs-cmd');
    if (!cmdEl || cmdEl.classList.contains('hidden')) {
      fail('战斗层开了，但指令菜单没显示 —— 逐回合模式等于没生效');
    } else ok('走进敌人 → 战斗层打开 + 指令菜单出现');

    // ① 菜单只出入参，不给结论
    var tp = (d.getElementById('bs-cmd-p').textContent || '');
    var tm = (d.getElementById('bs-cmd-m').textContent || '');
    if (tp.indexOf('攻') < 0 || tp.indexOf('防') < 0 ||
        tm.indexOf('攻') < 0 || tm.indexOf('防') < 0) {
      fail('菜单没有给出攻 / 防入参：' + tp + ' | ' + tm);
    } else if (/建议|推荐|最优|适合/.test(tp + tm)) {
      fail('菜单给出了结论（应当只出入参）：' + tp + ' | ' + tm);
    } else ok('菜单只出入参：' + tp + ' ／ ' + tm);

    // ② 开战瞬间不许动模型
    if (gB.turn !== t0) {
      fail('开战瞬间就推进了回合（' + t0 + ' → ' + gB.turn + '）：收尾提前跑了');
    } else ok('开战瞬间不动模型：收尾确实等到对决结束');

    // ③ 1 键（真实按键） = 用物理打这一轮；出手之后菜单必须收起
    var duelA = gB.liveFight.duel, n0 = duelA.log.length;
    kd('1');
    if (duelA.log.length <= n0) fail('菜单显示时按 1 没有推进任何一轮');
    else if (!cmdEl.classList.contains('hidden')) {
      fail('出手之后菜单没有收起（会让人以为还能再点一次）');
    } else {
      var recA = playerRec(duelA, n0);
      if (!recA) fail('按 1 出手后找不到我方的结算记录');
      else if (recA.type !== 'p') fail('按 1 用的是 ' + recA.type + '，应当是物理');
      else ok('按 1 → 用物理打一轮，菜单收起等演出');
    }
    // 演出期间空格**不再**属于菜单 —— 它留给"快进 / 托管"
    if (w.TideUI.battleKey({ key: ' ' })) {
      fail('演出期间空格被判给了菜单（那时它应当是"快进 / 托管"）');
    } else ok('演出期间空格不再属于菜单，留给快进 / 托管');

    // ④ 掐掉定时器，改为直接驱动模型，然后收尾
    w.TideUI.closeBattle();
    if (w.TideUI.isBattleOpen()) fail('closeBattle() 之后战斗层还开着（会吞掉所有输入）');
    else ok('closeBattle() 能无条件关掉战斗层（切屏 / 重开靠它）');
    drainDuel();
    var resA = gB.finishDuel();
    if (!resA) fail('finishDuel() 没有返回结果');
    else if (gB.liveFight !== null) fail('finishDuel() 之后 liveFight 没有清空');
    else if (gB.turn !== t0 + 1) {
      fail('对决收尾没有走常规回合结算（turn ' + t0 + ' → ' + gB.turn + '）');
    } else ok('对决收尾：写回模型并走完一次回合结算（turn ' + t0 + ' → ' + gB.turn + '）');
    w.TideUI.closeBattle();
  }

  // ---- B. 空格 = 用 HUD 上选好的那一路（低摩擦入口）----
  if (gB.status !== 'playing' || !gB.enemies.length) {
    // 上一场把人打死了 / 场上没怪了：重开一局。
    // 直接 fail 会把"运气"写进测试结果 —— 那不叫验证。
    w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260923, meta: null });
    gB = w.TideMain.game;
    closeAllUI();
  }
  gB.atkType = 'm';                       // HUD 上先选法术
  var errB = enterDuel();
  if (errB) fail('第二场：没能用真实按键进入战斗（' + errB + '）');
  else if (!gB.liveFight) fail('第二场：没有建立 liveFight');
  else {
    // 菜单高亮必须跟着 HUD 走 —— 否则"空格用哪一路"就没有依据
    var onEl = d.querySelector('#bs-cmd [data-atk].on');
    if (!onEl || onEl.getAttribute('data-atk') !== 'm') {
      fail('菜单高亮没有跟随 HUD 的出手类型（HUD=法术）');
    } else ok('菜单高亮跟随 HUD 的出手类型（HUD=法术 → 高亮法术）');
    var duelB = gB.liveFight.duel, n1 = duelB.log.length;
    kd(' ');
    if (duelB.log.length <= n1) fail('菜单显示时按空格没有推进任何一轮');
    else {
      var recB = playerRec(duelB, n1);
      if (!recB) fail('按空格出手后找不到我方的结算记录');
      else if (recB.type !== 'm') fail('空格用的是 ' + recB.type + '，应当是 HUD 上选的法术');
      else ok('空格 = 用 HUD 上选好的那一路出手（实际打出法术）');
    }
    w.TideUI.closeBattle();
    drainDuel();
    gB.finishDuel();
    w.TideUI.closeBattle();
  }

  // ---- C. 对决内的姿态轮换 ----
  // 用假想敌直接驱动 newDuel：不依赖地图上恰好有一只能带姿态的怪，
  // 也不依赖真实战斗长度（那两件事都会让断言时好时坏）。
  var stDummy = { hp: 400, maxHp: 400, atkP: 5, atkM: 5, penP: 0, penM: 0,
                  defP: 40, defM: 40, spd: 5, crit: 0, dodge: 0, leech: 0 };
  var dummyFoe = function () {
    return { name: '假想敌', stance: 'p', stanceT: 1,
      stats: { hp: 400, atkP: 20, atkM: 20, penP: 0, penM: 0, defP: 20, defM: 20,
               spd: 5, crit: 0, dodge: 0, leech: 0 } };
  };
  var fk = dummyFoe();
  var dd = gB.newDuel(stDummy, fk.stats, {}, {}, true,
    { name: '我', isPlayer: true, atkType: 'p' }, { name: fk.name, src: fk });
  var flips = 0, sd = 0;
  while (sd < 6 && !dd.finished) { dd.step('p'); sd++; if (dd.lastFlip) flips += 1; }
  if (sd !== 6) fail('6 轮之内对决就结束了（假想敌的参数不该致死）: ' + sd);
  else if (flips !== 2) fail('6 轮里姿态该翻 2 次（every=3），实际 ' + flips);
  else ok('对决内姿态轮换：6 轮翻 ' + flips + ' 次 —— 题目确实会在战斗中改变');

  // ---- D. 不传 src 的合成对决**不许**轮换（伤害数学靠这条保持纯净）----
  var fk2 = dummyFoe();
  var dd2 = gB.newDuel(stDummy, fk2.stats, {}, {}, true,
    { name: '我', isPlayer: true, atkType: 'p' }, { name: fk2.name });
  var flips2 = 0, sd2 = 0;
  while (sd2 < 6 && !dd2.finished) { dd2.step('p'); sd2++; if (dd2.lastFlip) flips2 += 1; }
  if (flips2 !== 0) fail('没有传 src 的合成对决不该轮换姿态，实际翻了 ' + flips2 + ' 次');
  else ok('合成对决（不传 src）不做姿态轮换 —— 伤害数学保持纯净');

  // ---- E. 开关能关掉整件事（对照组的存在性也要验）----
  var gOff = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard',
    seed: 20260922, aiStance: false });
  if (gOff.aiStance !== false) fail('aiStance:false 没有传进模型（对照组就不存在了）');
  else if (gOff._autoPicker() !== null) {
    fail('aiStance 关掉时 _autoPicker 应当返回 null（否则会白耗随机数，逐位比对失效）');
  } else ok('aiStance 开关：关掉时 AI 不做逐轮选路，随机流与改造前一致');

  w.TideUI.closeBattle();
  w.TideMeta.reset();
} catch (e) { fail('逐回合战斗测试异常: ' + (e && e.stack ? e.stack : e)); }

// ---------- 39. 高分辨率战斗立绘：还是同一个角色 ----------
/* 这一节守的不是"好不好看"（那要靠眼睛，它在这里没有发言权），
   守的是**"还是不是同一个角色"**。

   art.js 里现在有两套绘制器：小立绘（32×32，地图用）和战斗立绘
   （96×96 / 64×64，战斗场景用）。它们共用 heroGeo / monsterGeo 这段几何，
   所以形体必须一致。而"几何被复制成两份"是这里最危险的漂移 ——
   它的症状只是"战斗里的主角看着有点陌生"，没有人会立刻发现、更不会有人报。

   把这件事变成一条会红的断言，就不用指望有人记得去比对。 */
try {
  var A2 = w.TideArt, D2 = w.TideData;
  var clsBig = D2.classByKey ? D2.classByKey('warlord') : D2.CLASSES[0];

  if (!A2.paintHeroBig || !A2.paintMonsterBig) {
    fail('TideArt 没有导出 paintHeroBig / paintMonsterBig（战斗立绘没接上）');
  } else {
    /**
     * 大立绘按 mult 下采样后应当覆盖小立绘的轮廓，**允许一格边界容差**。
     * 容差是必需的：outline 给小立绘加的是"一整格"（1 格 = 1 像素），
     * 给大立绘加的是"一个原生像素"（= 半格）。同一个描边操作在不同分辨率下
     * 厚度本来就不一样。真要抓的是"形体变了" —— 那会让格子离对方最近的
     * 像素远到两格以上，一格容差挡不住。
     */
    function bigCover(small, big, mult) {
      var tol = 1;
      /* ⚠ m 必须显式传进来。写成"读外层 mult"的话，
         near(small, ...) 会拿大立绘的倍数去索引小立绘，
         索引一大半越界、全部返回 false，onlyBig 会被灌成几百格 ——
         而这个断言本来就是为了防误报，自己误报就毫无意义了。 */
      function blockHas(px, cx2, cy2, m) {
        var X = cx2 * m, Y = cy2 * m;
        for (var j = 0; j < m; j++) {
          for (var i = 0; i < m; i++) if (px.get(X + i, Y + j)) return true;
        }
        return false;
      }
      function near(px, cx2, cy2, m) {
        for (var dy = -tol; dy <= tol; dy++) {
          for (var dx = -tol; dx <= tol; dx++) if (blockHas(px, cx2 + dx, cy2 + dy, m)) return true;
        }
        return false;
      }
      var onlySmall = 0, onlyBig = 0;
      for (var y = 0; y < small.h; y++) {
        for (var x = 0; x < small.w; x++) {
          var sa = !!small.get(x, y), sb = blockHas(big, x, y, mult);
          if (sa && !near(big, x, y, mult)) onlySmall++;
          else if (sb && !near(small, x, y, 1)) onlyBig++;
        }
      }
      return { onlySmall: onlySmall, onlyBig: onlyBig };
    }
    function colorCount(px) {
      var s = {}, n = 0;
      for (var i = 0; i < px.d.length; i++) {
        var c = px.d[i];
        if (c && !s[c]) { s[c] = 1; n++; }
      }
      return n;
    }

    // ---- 英雄：两种朝向都验 ----
    var hBigUp = A2.paintHeroBig(clsBig, 'up', 0, 3);
    var hBigDown = A2.paintHeroBig(clsBig, 'down', 0, 3);
    if (hBigUp.w !== 96 || hBigUp.h !== 96) {
      fail('英雄战斗立绘不是 96x96（= 32 x 3）: ' + hBigUp.w + 'x' + hBigUp.h);
    } else ok('英雄战斗立绘 96x96（地图立绘的正好 3 倍）');
    var cUp = bigCover(A2.paintHero(clsBig, 'up', 0), hBigUp, 3);
    var cDown = bigCover(A2.paintHero(clsBig, 'down', 0), hBigDown, 3);
    if (cUp.onlySmall > 0 || cDown.onlySmall > 0 || cUp.onlyBig > 8 || cDown.onlyBig > 8) {
      fail('英雄战斗立绘的形体和小立绘对不上：背面缺 ' + cUp.onlySmall + '/多 ' + cUp.onlyBig +
        '，正面缺 ' + cDown.onlySmall + '/多 ' + cDown.onlyBig);
    } else {
      ok('英雄战斗立绘与小立绘**同一个形体**（背面 缺' + cUp.onlySmall + '/多' + cUp.onlyBig +
        '，正面 缺' + cDown.onlySmall + '/多' + cDown.onlyBig + '）');
    }
    var colSmallH = colorCount(A2.paintHero(clsBig, 'up', 0));
    var colBigH = colorCount(hBigUp);
    if (colBigH < colSmallH * 6) {
      fail('英雄战斗立绘的用色只多了 ' + (colBigH - colSmallH) + ' 种 —— 那不是"重画"，是"放大"');
    } else {
      ok('英雄战斗立绘真的加了细节：用色 ' + colSmallH + ' → ' + colBigH + ' 种');
    }

    // ---- 怪物：每一种 body 都要验（共 6 种）----
    var seen2 = {}, shapes2 = [];
    for (var mi = 0; mi < D2.ENEMIES.length; mi++) {
      var sp2 = D2.ENEMIES[mi].shape;
      if (sp2 && !seen2[sp2.body]) { seen2[sp2.body] = 1; shapes2.push(sp2); }
    }
    if (shapes2.length < 5) fail('只取到 ' + shapes2.length + ' 种 monster body，覆盖不全');
    else {
      var badShape = [];
      for (var si = 0; si < shapes2.length; si++) {
        var mB2 = A2.paintMonsterBig(shapes2[si], 2);
        if (mB2.w !== 64 || mB2.h !== 64) { badShape.push(shapes2[si].body + '(尺寸)'); continue; }
        var mc2 = bigCover(A2.paintMonster(shapes2[si]), mB2, 2);
        if (mc2.onlySmall > 0 || mc2.onlyBig > 16) {
          badShape.push(shapes2[si].body + '(缺' + mc2.onlySmall + '/多' + mc2.onlyBig + ')');
        }
      }
      if (badShape.length) fail('这些怪物体的战斗立绘和小立绘对不上：' + badShape.join(', '));
      else ok('6 种怪物体型的战斗立绘都是 64x64，且与小立绘同形体（' +
        shapes2.length + ' 种全部通过）');
    }

    // ---- 确定性：同输入必须同输出，否则进战斗时立绘会抖 ----
    var url1 = A2.paintHeroBig(clsBig, 'up', 0, 3).toCanvas(1).toDataURL();
    var url2 = A2.paintHeroBig(clsBig, 'up', 0, 3).toCanvas(1).toDataURL();
    if (url1 !== url2) fail('战斗立绘本绘不是确定性的（两次调用结果不同）');
    else ok('战斗立绘是确定性的（同输入同输出）');

    // ---- 材质契约：CSS 里的显示尺寸必须是原生尺寸的整数倍 ----
    // 非整数倍会让每个色块落在半个像素上，边缘发糊 —— 而这种糊不报错，只有肉眼。
    // 必须先让战斗层可见再量：display:none 的元素拿到的宽度是 "auto"，
    // 量出来是 0，断言就会变成"拿不到宽度"而不是"倍数不对"。
    var bsEl2 = d.getElementById('battle-screen');
    var wasHidden2 = bsEl2 ? bsEl2.classList.contains('hidden') : true;
    if (bsEl2) bsEl2.classList.remove('hidden');
    var heroW = 0, foeW = 0;
    var hi2 = d.getElementById('bs-hero-art'), fi2 = d.getElementById('bs-foe-art');
    if (hi2) heroW = Math.round(parseFloat(w.getComputedStyle(hi2).width) || 0);
    if (fi2) foeW = Math.round(parseFloat(w.getComputedStyle(fi2).width) || 0);
    if (wasHidden2 && bsEl2) bsEl2.classList.add('hidden');

    if (!heroW || !foeW) {
      fail('拿不到战斗立绘的显示宽度（元素或样式缺失）: hero=' + heroW + ' foe=' + foeW);
    } else if (heroW % 96 !== 0) {
      fail('战斗立绘的显示宽度 ' + heroW + 'px 不是原生 96px 的整数倍（会被非整数缩放糊掉）');
    } else if (foeW % 64 !== 0) {
      fail('敌人立绘的显示宽度 ' + foeW + 'px 不是原生 64px 的整数倍（同上）');
    } else {
      ok('战斗立绘按整数倍显示：主角 ' + heroW + 'px = 96 x ' + (heroW / 96) +
        '，敌人 ' + foeW + 'px = 64 x ' + (foeW / 64));
    }
  }
  w.TideUI.closeBattle();
} catch (e) { fail('战斗立绘测试异常: ' + (e && e.stack ? e.stack : e)); }

// ---------- 40. 开始界面背景：一块画布只允许一条循环 ----------
/* 这一节守的是一个真把眼睛晃到的 bug：
   原来 tideBackground 每次调用都新开一条 requestAnimationFrame 循环，
   而保存句柄的 bgRaf 是模块级单例（只记得最后一个，旧的永远取消不掉）。
   于是"每进一次标题页"就多一条全屏绘制循环 + 多一个 window.resize 监听，
   而每个监听都会给 canvas.width 赋值 —— **赋值即清空画布**。
   最大化时 resize 会连着来一串，画布被反复清空，蓝色波形擦了又画 ——
   看起来就是"背景蓝色一闪一闪"。

   两条断言各自对应一半修法：
     · 循环不累积   ← 一块画布一条循环
     · resize 不再清画布 ← 尺寸改成帧内查、只在真变了才赋值 */
try {
  var bgLoops0 = typeof w.TideUI.bgLoopCount === 'function' ? w.TideUI.bgLoopCount() : -1;
  if (bgLoops0 < 0) fail('TideUI 没有导出 bgLoopCount（这个 bug 就没法被数出来）');
  else {
    // 回到主菜单。注意：循环是**按画布**长期存活的（不可见时只是跳过绘制），
    // 所以菜单上也可以已经是 2 条 —— 这里要断言的是"不增长"，不是"恰好 1 条"。
    w.TideUI.showMenu();
    var n0 = w.TideUI.bgLoopCount();
    if (n0 < 1 || n0 > 2) fail('背景循环数应当在 1~2 之间，实际 ' + n0);
    else ok('主菜单背景循环数 = ' + n0 + '（不可能超过 2：一块画布一条）');

    // 进标题页 4 次 —— 修之前这里会每次 +1（变成 n0 + 4）
    for (var bi = 0; bi < 4; bi++) w.TideUI.showTitle();
    var n1 = w.TideUI.bgLoopCount();
    if (n1 !== n0 && n1 !== 2) {
      fail('连进 4 次标题页之后循环数从 ' + n0 + ' 变成 ' + n1 + ' —— 循环在累积');
    } else if (n1 > 2) {
      fail('背景循环数超过 2 了（' + n1 + '）—— 一块画布跑了多条循环');
    } else ok('连进 4 次标题页，背景循环数仍是 ' + n1 + ' —— 没有累积');

    // 来回切也不涨
    w.TideUI.showMenu();
    w.TideUI.showTitle();
    w.TideUI.showMenu();
    var n2 = w.TideUI.bgLoopCount();
    if (n2 > 2) fail('菜单 / 标题来回切之后循环数变成了 ' + n2 + '（不该超过 2）');
    else ok('菜单 / 标题来回切，循环数不增长（' + n2 + '）');

    // ---- 核心：一次 window.resize 不该清空背景画布 ----
    // 修之前：每个 resize 监听都会给 canvas.width 赋值 → 清空一次。
    // 赋值计数器说明：canvas.width 的 setter 被调用 ≠ 值变了，
    // 所以这条断言直接测"有没有人去碰它"，比测像素靠谱得多。
    var wsets = 0;
    var wdesc = Object.getOwnPropertyDescriptor(w.HTMLCanvasElement.prototype, 'width');
    if (!wdesc || !wdesc.set) fail('拿不到 canvas.width 的 setter，断言无法进行');
    else {
      Object.defineProperty(w.HTMLCanvasElement.prototype, 'width', {
        get: wdesc.get, configurable: true,
        set: function (v) { wsets++; return wdesc.set.call(this, v); }
      });
      var before = wsets;
      w.dispatchEvent(new w.Event('resize'));
      var used = wsets - before;
      Object.defineProperty(w.HTMLCanvasElement.prototype, 'width', {
        get: wdesc.get, configurable: true, set: wdesc.set
      });
      if (used !== 0) {
        fail('一次 window.resize 让 canvas.width 被赋值 ' + used +
          ' 次 —— 那就是"窗口一变就清空画布"，也是背景闪烁的直接原因');
      } else ok('一次 window.resize 不会清空任何背景画布（尺寸改成帧内查了）');
    }

    w.TideUI.showMenu();
    if (w.TideUI.bgLoopCount() > 2) {
      fail('收回主菜单后循环数异常：' + w.TideUI.bgLoopCount());
    } else ok('背景循环全程不超过 2 条（每块画布一条）');
  }
  w.TideMeta.reset();
} catch (e) { fail('背景循环测试异常: ' + (e && e.stack ? e.stack : e)); }

// ---------- 41. 规则层补漏 + 门禁不变量 ----------
/* 这一节填的是"功能都对、但没人测过规则边界"的那一块。
   体检（tools/probe_audit.html）先扫出盲区：复活 / 踩水腐蚀 / 背包满 /
   Boss 必掉 / 秘藏池抽干后的馈赠 / 文案与实现一致 —— 全是 0 覆盖。

   另外把两条**门禁不变量**固化进来（它们本来是体检里的临时断言）：
     · 说明 / 设置 / 排行榜开着时，按键不许推进回合
     · 切屏后**自动枚举**所有浮层，不许有残留
   第二条特意不写死名单：手写名单已经漏过 pause、meta、relic-modal。 */
try {
  var D3 = w.TideData, C3 = w.TideCore;

  function freshG(seed) {
    w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: seed || 5150, meta: null });
    return w.TideMain.game;
  }
  function drain(g) { return g.drainEvents(); }
  function findEvent(list, kind) {
    for (var i = 0; i < list.length; i++) if (list[i].kind === kind) return list[i];
    return null;
  }

  /* ---- ① 复活：回一半血 + 把近处的敌人推开 ----
     第二条规则（推开 4 格内的敌人）此前**一次都没被测过** ——
     它不是从文案推得出来的，只能从 core.js 的 _die 里读出来。
     顺手也验"远处的不受影响"：否则"推开近处的"就成了"清空全场"，
     而那种写法一样能让"复活后安全"这条断言通过。 */
  var gr = freshG(5151);
  var maxHpR = gr.stats().hp;
  gr.enemies.length = 0;
  // 用**真实的**敌人工厂，不手搓假对象：假对象缺 arc 之类的字段，
  // 一进 endTurn 就会炸 —— 那种失败测的是"我的假数据不全"，
  // 而不是游戏本身，白白把一次真实的断言变成噪音。
  var mkFoe = function (x, y, nm) {
    var e = gr._makeEnemy(x, y, gr.depth);
    e.x = x; e.y = y; e.name = nm;
    e.hp = e.maxHp = 5;         // 压小血量：它不该在这一步里反杀
    return e;
  };
  var dirsR = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (var ri2 = 0; ri2 < 2; ri2++) {
    gr.enemies.push(mkFoe(gr.px + dirsR[ri2][0], gr.py + dirsR[ri2][1], '贴身兵' + ri2));
  }
  var farX = (gr.px + 9 < gr.W) ? gr.px + 9 : gr.px - 9;
  gr.enemies.push(mkFoe(farX, gr.py, '远处兵'));
  gr.lives = 2; gr.hp = 1;
  drain(gr);
  gr._die('体检');
  var evR = findEvent(drain(gr), 'revive');
  var wantHp = Math.round(maxHpR * 0.5);
  if (gr.status !== 'playing') fail('有复活次数时 _die 把状态改成了 ' + gr.status + '（应当在场上）');
  else if (gr.lives !== 1) fail('复活没有扣次数：lives=' + gr.lives);
  else if (Math.round(gr.hp) !== wantHp) {
    fail('复活后的生命应为上限的一半（' + wantHp + '），实际 ' + gr.hp);
  } else if (!evR) fail('复活没有推 revive 事件（界面/音效就接不到）');
  else if (gr.enemies.length !== 1) {
    fail('复活应当只推开 4 格内的敌人（留下 1 只远处的），实际剩 ' + gr.enemies.length + ' 只');
  } else {
    // 复活之后必须**能动** —— 不能只是"活着但卡住"
    var stepOk = false;
    for (var di2 = 0; di2 < 4 && !stepOk; di2++) {
      var nx2 = gr.px + dirsR[di2][0], ny2 = gr.py + dirsR[di2][1];
      if (gr.walkable(nx2, ny2) && !gr.enemyAt(nx2, ny2)) stepOk = gr.stepTo(nx2, ny2);
    }
    if (!stepOk) fail('复活之后走不动了（活着但被卡住）');
    else ok('复活：回满一半生命（' + gr.hp + '/' + maxHpR + '）、推开近处敌人（留 ' +
      gr.enemies.length + ' 只远处的）、并且立刻能继续行动');
  }

  var gr2 = freshG(5151);
  gr2.lives = 1; gr2.hp = 1;
  gr2._die('体检');
  if (gr2.status !== 'dead') fail('复活次数用尽后仍然没有进入死亡状态：' + gr2.status);
  else if (gr2.reason !== '体检') fail('死亡原因没有被记下来：' + gr2.reason);
  else ok('复活次数用尽 → 状态 dead、原因已记录（"' + gr2.reason + '"）');

  /* ---- ② 踩水腐蚀：伤害必须等于公式，且是真实伤害 ---- */
  var gw = freshG(5152);
  gw.enemies.length = 0;                     // 清场：只留踩水这一项伤害来源
  var wt = null;
  for (var wy = 0; wy < gw.H && !wt; wy++) {
    for (var wx = 0; wx < gw.W; wx++) {
      if (gw.tileAt(wx, wy) === C3.T.WATER) { wt = { x: wx, y: wy }; break; }
    }
  }
  if (!wt) fail('这一层没有水格，踩水腐蚀测不了');
  else {
    gw.px = wt.x; gw.py = wt.y;
    var hpW0 = gw.hp;
    drain(gw);
    gw.endTurn();
    var evW = findEvent(drain(gw), 'corrode');
    var stW = gw.stats();
    var want = Math.max(1, Math.round(stW.hp * (0.006 + gw.tideLevel * 0.005)));
    if (!evW) fail('站在水里结束回合没有产生 corrode 事件');
    else if (evW.dmg !== want) fail('踩水伤害 ' + evW.dmg + ' 与公式 ' + want + ' 不符');
    else if (evW.type !== 't') fail('踩水伤害没有被标成真实伤害（type=' + evW.type + '）');
    else if (Math.round(gw.hp) !== Math.round(hpW0 - want)) {
      fail('踩水扣的血不等于伤害值：' + hpW0 + '→' + gw.hp);
    } else ok('踩水腐蚀：伤害 ' + evW.dmg + ' 与公式一致、标为真实伤害、血量对得上');
  }

  /* ---- ③ Boss 必掉：chance 1.6 被夹到 1.0，所以 20 次都不该为空 ---- */
  var gd = freshG(5153);
  var miss = 0;
  for (var di = 0; di < 20; di++) if (!gd._rollDrop({ kind: 'boss', name: '测试' })) miss++;
  if (miss) fail('Boss 掉落 20 次里有 ' + miss + ' 次是空的（"必掉"没成立）');
  else ok('Boss 掉落必中：20 次全部有东西（掉落两件取更好的那件）');

  /* ---- ④ 背包已满：掉落要被"收纳成事件"，不能静默丢 ---- */
  var gb = freshG(5154);
  gb.enemies.length = 0;
  var cap = gb.bagCap();
  while (gb.bag.length < cap) gb.bag.push(gb.makeItem({ depth: 1 }));
  var bossLike = { kind: 'boss', name: '测试守卫', x: gb.px, y: gb.py,
    hp: 1, maxHp: 1, stats: { hp: 1 } };
  drain(gb);
  gb._killEnemy(bossLike, true);
  var evB = findEvent(drain(gb), 'bagfull');
  if (!evB) fail('背包满时击杀没有产生 bagfull 事件（掉落被静默吞了）');
  else if (gb.bag.length > cap) fail('背包超过了上限：' + gb.bag.length + ' > ' + cap);
  else ok('背包满：掉落转成 bagfull 事件，背包没有超上限（' + gb.bag.length + '/' + cap + '）');

  /* ---- ⑤ 秘藏池抽干：必须仍然给得出三张牌 ---- */
  var gs = freshG(5155);
  gs.relics = D3.RELICS.map(function (r) { return r.id; });   // 假装全拿过了
  var offer = gs._offerRelics();
  if (!offer || !offer.length) fail('秘藏池抽干后没有给出任何候选（会把玩家锁在选牌外）');
  else if (offer.length !== 3) fail('秘藏池抽干后的候选不是三张：' + offer.length);
  else if (!offer[0].id) fail('兜底候选缺少 id（界面画不出来）');
  else ok('秘藏池抽干 → 仍然给出 3 张兜底候选（' + offer.map(function (x) { return x.name; }).join(' / ') + '）');

  /* ---- ⑥ 文案 ↔ 实现：吞噬系的数字必须和实测一致 ---- */
  var gt = freshG(5156);
  gt.enemies.length = 0;
  gt.relics.push('devourR');                  // 吞噬者：文案写 +6 物攻
  var txt = '';
  for (var ri = 0; ri < D3.RELICS.length; ri++) {
    if (D3.RELICS[ri].id === 'devourR') txt = D3.RELICS[ri].text;
  }
  var atk0 = gt.stats().atkP;
  gt._killEnemy({ kind: 'normal', name: '测试', x: gt.px, y: gt.py,
    hp: 1, maxHp: 1, stats: { hp: 1 } }, true);
  var got = Math.round(gt.stats().atkP - atk0);
  var m = /\+(\d+)\s*物攻/.exec(txt);
  var promised = m ? parseInt(m[1], 10) : -1;
  if (promised < 0) fail('拿不到「吞噬者」文案里的数字：' + txt);
  else if (promised !== got) {
    fail('文案写 +' + promised + ' 物攻，实测击杀后涨了 +' + got + ' —— 文案在撒谎');
  } else ok('文案与实现一致：吞噬者写 +' + promised + '，实测 +' + got + '');

  /* ---- ⑦ 门禁不变量：这三个层开着时按键不许推进回合 ---- */
  var gateCases = [
    { n: '说明', up: function () { w.TideUI.showHelp(); } },
    { n: '设置', up: function () { w.TideUI.showSettings(); } },
    { n: '排行榜', up: function () { w.TideUI.showBoard(); } }
  ];
  var gateKeys = ['ArrowRight', 'ArrowUp', ' ', '1', 'q', 'e'];
  var gateBad = [];
  for (var gi = 0; gi < gateCases.length; gi++) {
    var gg = freshG(5200 + gi);
    w.TideUI.closeHelp(); w.TideUI.closeSettings(); w.TideUI.closeBoard();
    gateCases[gi].up();
    var gt0 = gg.turn, gx0 = gg.px, gy0 = gg.py;
    for (var ki = 0; ki < gateKeys.length; ki++) {
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: gateKeys[ki], bubbles: true }));
      w.dispatchEvent(new w.KeyboardEvent('keyup', { key: gateKeys[ki], bubbles: true }));
    }
    if (gg.turn !== gt0 || gg.px !== gx0 || gg.py !== gy0) {
      gateBad.push(gateCases[gi].n + '(回合 ' + gt0 + '→' + gg.turn + ')');
    }
  }
  if (gateBad.length) {
    fail('这些层没有挡住输入，角色在面板后面自己走：' + gateBad.join(', '));
  } else ok('说明 / 设置 / 排行榜开着时，方向键与动作键都不会推进回合');

  /* ---- ⑧ 切屏必须清掉**所有**浮层（自动枚举，不写死名单）---- */
  function overlaysStay() {
    var stay = [];
    var nodes = d.querySelectorAll('.modal, [id$="-screen"]');
    for (var i = 0; i < nodes.length; i++) {
      var id = nodes[i].id;
      if (!id || id === 'game-screen' || id === 'menu-screen' || id === 'title-screen') continue;
      if (!nodes[i].classList.contains('hidden')) stay.push(id);
    }
    return stay;
  }
  var gz = freshG(5300);
  w.TideUI.openInventory('bag');
  w.TideUI.showHelp();
  w.TideUI.showSettings();
  w.TideUI.showBoard();
  gz.pendingRelic = [D3.RELICS[0]];
  w.TideUI.render(gz);
  var relEl = d.getElementById('relic-modal');
  var relicWasUp = relEl && !relEl.classList.contains('hidden');
  w.TideMain.restart();                        // 跨局残留：最容易漏的一条路
  var stayZ = overlaysStay();
  if (!relicWasUp) fail('选秘藏面板没能被打开，这条断言就失去意义了');
  else if (stayZ.length) fail('重开一局后有浮层残留：' + stayZ.join(', '));
  else ok('重开一局后没有任何浮层残留（自动枚举 ' +
    d.querySelectorAll('.modal, [id$="-screen"]').length + ' 个）');


/* ---------- 42. 群战（1vN）：相邻入战 · 选目标 · 多杀结算 · squad=0 对照 ----------
   为什么这一节必须存在：群战的三个后果全都**不可见** ——
     ① 名单算错 → 参战人数不对，但战斗照样能打完；
     ② 目标选择失效 → 玩家永远只打第一只，看起来也正常；
     ③ 多杀结算漏了 → 掉落凭空少一半，更难看出来。
   所以每一条都要有断言盯着，并且要有一条断言盯着"代价"本身：
   一轮会挨 N 次打 —— 那是这个机制唯一的成本，也是它改变平衡的方式。 */
try {
  var DIRQ = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  /* 造一局，把怪放进主角四邻。spd 统一压到 4：
     这样"一轮挨几次打"就不会混进速度碾压的追加击。 */
  var mkSquad = function (opts, hp) {
    var g = new w.TideCore.Game(opts);
    g.enemies = [];
    for (var i = 0; i < 4; i++) {
      var x = g.px + DIRQ[i][0], y = g.py + DIRQ[i][1];
      if (!g.walkable(x, y)) continue;
      var e = g._makeEnemy(x, y, g.depth);
      e.stats.spd = 4;
      e.maxHp = e.hp = hp;
      g.enemies.push(e);
    }
    return g;
  };
  var SEEDQ = 20260924;
  var gQ = mkSquad({ classKey: 'warlord', difficulty: 'standard', seed: SEEDQ, meta: null }, 500);
  if (gQ.enemies.length < 4) fail('群战测试：主角四邻只放下 ' + gQ.enemies.length + ' 只怪');

  // (a) 名单：被踩中的那只排第一，四邻都进来，上限 4
  var tgtQ = gQ.enemies[0];
  var listQ = gQ._squadAt(tgtQ.x, tgtQ.y);
  if (listQ.length !== gQ.enemies.length) {
    fail('群战名单不对：' + listQ.length + ' vs ' + gQ.enemies.length);
  } else if (listQ[0] !== tgtQ) {
    fail('群战名单第一只应当是被踩中的那只');
  } else if (listQ.length > 4) {
    fail('群战名单超过 4 只：' + listQ.length);
  } else ok('群战名单：被踩中的排第一，共 ' + listQ.length + ' 只（上限 4）');

  // (b) 对照组：squad=false 时必须退化成只打那一只
  var gQ0 = mkSquad({ classKey: 'warlord', difficulty: 'standard', seed: SEEDQ, squad: false }, 500);
  var listQ0 = gQ0._squadAt(gQ0.enemies[0].x, gQ0.enemies[0].y);
  if (listQ0.length !== 1) fail('squad=false 应当只打一只，实际 ' + listQ0.length);
  else ok('squad=false 对照组：只打被踩中的那一只');

  // (c) 代价：一轮要挨 N 次打
  gQ.hp = 999999;
  gQ.liveFight = gQ._fightBegin(listQ);
  var rQ = gQ.duelRound('p', 0);
  if (!rQ) fail('群战：duelRound 返回空');
  else {
    var hitsQ = 0;
    for (var qi = 0; qi < rQ.rounds.length; qi++) {
      if (rQ.rounds[qi].to === gQ.cls.name) hitsQ++;
    }
    if (hitsQ !== listQ.length) {
      fail('群战：一轮应当挨 ' + listQ.length + ' 次打，实际 ' + hitsQ);
    } else ok('群战代价：一轮挨 ' + hitsQ + ' 次打（每只各出手一次）');
  }

  // (d) 选目标：指定打第 2 只 → 只有它掉血
  // 血量的权威在**对决单位**上（d.bs[i].hp）；模型要等 _fightSettle 才写回。
  // 读模型会读到"一点没掉" —— 那是测试读错了地方，不是规则错了。
  var dQ = gQ.liveFight.duel;
  var hpBeforeQ = dQ.bs.map(function (u) { return u.hp; });
  var rQ2 = gQ.duelRound('p', 1);
  if (!rQ2) fail('群战：第二次 duelRound 返回空');
  else if (!(dQ.bs[1].hp < hpBeforeQ[1])) fail('群战：指定的第 2 只没有掉血');
  else if (dQ.bs[0].hp !== hpBeforeQ[0]) fail('群战：没被选中的第 1 只也掉血了');
  else ok('群战选目标：只打指定的那一只');
  gQ.liveFight = null;

  // (e) 多杀结算：四只各 1 血 → 一场对决清场 → 击杀 / 金币按只数累计
  var gR = mkSquad({ classKey: 'warlord', difficulty: 'standard', seed: SEEDQ, meta: null }, 1);
  var nR = gR.enemies.length;
  gR.hp = 999999;
  var k0 = gR.kills, gold0 = gR.gold;
  var sqR = gR._squadAt(gR.enemies[0].x, gR.enemies[0].y);
  var resR = gR.fight(sqR, 'p');
  if (!resR || !resR.killed || resR.killed !== nR) {
    fail('群战：一场对决没有把 ' + nR + ' 只都算进击杀（killed=' + (resR && resR.killed) +
      ' squad=' + sqR.length + ' alive=' + gR.enemies.length +
      ' rounds=' + (resR && resR.rounds ? resR.rounds.length : -1) +
      ' hp=' + JSON.stringify(gR.enemies.map(function (e) { return e.hp; })) + '）');
  } else if (gR.kills !== k0 + nR) {
    fail('群战：击杀数没有按只数累计（' + k0 + ' → ' + gR.kills + '）');
  } else if (!(gR.gold > gold0)) {
    fail('群战：多杀没有产生金币');
  } else ok('群战多杀：killed=' + resR.killed + '，kills +' + (gR.kills - k0) +
    '，gold +' + (gR.gold - gold0));

  // (f) 界面：列表出现 · 默认目标高亮 · 方向键能换目标
  var gU = mkSquad({ classKey: 'warlord', difficulty: 'standard', seed: SEEDQ, meta: null }, 500);
  var LU = gU._fightBegin(gU._squadAt(gU.enemies[0].x, gU.enemies[0].y));
  gU.liveFight = LU;
  w.TideUI.playBattle(gU, {
    kind: 'duel', enemy: LU.enemy, enemies: LU.enemies, duel: LU.duel,
    aHp0: LU.hp0, bHp0: LU.ehp0
  }, function () {});
  var kq = function (key) {
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: key, bubbles: true }));
    w.dispatchEvent(new w.KeyboardEvent('keyup', { key: key, bubbles: true }));
  };
  var rail = d.getElementById('bs-foes');
  if (!rail || rail.classList.contains('hidden')) {
    fail('群战界面：敌群列表没有出现');
  } else {
    var rows = rail.querySelectorAll('.bs-foe-row');
    if (rows.length !== LU.enemies.length) {
      fail('群战界面：列表行数 ' + rows.length + ' vs ' + LU.enemies.length);
    } else if (!rows[0].classList.contains('on')) {
      fail('群战界面：默认目标没有高亮');
    } else {
      kq('ArrowRight');
      var rows2 = rail.querySelectorAll('.bs-foe-row');
      var onNow = -1;
      for (var ri = 0; ri < rows2.length; ri++) {
        if (rows2[ri].classList.contains('on')) onNow = ri;
      }
      if (onNow !== 1) fail('群战界面：方向键没有换到第 2 只（实际 ' + onNow + '）');
      else ok('群战界面：列表 ' + rows2.length + ' 行，方向键换目标生效');
    }
  }
  w.TideUI.closeBattle();
} catch (e) { fail('群战测试异常: ' + (e && e.stack ? e.stack : e)); }

  w.TideUI.closeBattle();
  w.TideMeta.reset();
} catch (e) { fail('规则层测试异常: ' + (e && e.stack ? e.stack : e)); }

  } catch (e) {
    fail('测试脚本异常: ' + (e && e.stack ? e.stack : e));
  }
  finish();
}

function finish() {
  log('');
  if (errors.length) {
    log('结果: FAIL (' + errors.length + ' 项)');
    errors.forEach(function (e, i) { log('  ' + (i + 1) + '. ' + e); });
  } else {
    log('结果: ALL PASS');
  }
  flush();
}
</script>
</body>
</html>
