<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tide-smoke</title>
<style>body{background:#05070d;color:#ccd6e6;font:13px Consolas,monospace;margin:0}
#out{white-space:pre-wrap;padding:12px}iframe{position:fixed;left:-4000px;top:0;width:1280px;height:800px}</style>
</head>
<body>
<pre id="out">booting...</pre>
<iframe id="fr" src="../src/index.html"></iframe>
<script>
/* ============================================================
   集成冒烟测试。
   为什么要单独做这一步（而不是"打开浏览器看一眼"）：
   这个游戏的绝大部分代码是 DOM 与 canvas 交互，逻辑模拟器碰不到它们。
   渲染层引用错一个函数名、UI 里查一个不存在的 id，
   在无头模拟里全都看不出来，但玩家一进去就是白屏。
   这里把真实页面塞进 iframe，驱动真实流程并捕获所有未处理异常。
   需要 Edge 参数 --allow-file-access-from-files（file:// 下跨 frame 访问）。

   参数：
     ?page=../release/数值潮汐/www/index.html   ← 换一个页面来测（用于验证分发包）
   ============================================================ */
var qp = {};
location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
  if (!kv) return; var p = kv.split('='); qp[p[0]] = decodeURIComponent(p[1] || '');
});
if (qp.page) document.getElementById('fr').src = qp.page;
var out = [];
var errors = [];
var fr = document.getElementById('fr');

function log(s) { out.push(s); flush(); }
function flush() { document.getElementById('out').textContent = 'SMOKE\n' + out.join('\n'); }
function fail(s) { errors.push(s); log('  FAIL ' + s); }
function ok(s) { log('  ok   ' + s); }

function approx(a, b, tol) { return Math.abs(a - b) <= (tol === undefined ? 1 : tol); }

fr.addEventListener('load', function () {
  var w = fr.contentWindow;
  var d = fr.contentDocument;
  w.addEventListener('error', function (ev) {
    // 资源型错误（没有 message / error，比如 favicon 404）**不是**游戏的问题 ——
    // 游戏自己也会忽略它们，第 27 节还会故意注入这种事件来验证这一点。
    // 脚手架如果把这种事件记成失败，就等于重复了游戏上一版犯的那个错：
    // 拿一个无害的 404 当崩溃。
    if (!ev.message && !ev.error) return;
    if (/^烟雾测试/.test(ev.message || '')) return;   // 第 27 节故意注入的假错误
    fail('window.onerror: ' + ev.message + ' @' + ev.filename + ':' + ev.lineno);
  });
  w.addEventListener('unhandledrejection', function (ev) {
    fail('unhandledrejection: ' + ev.reason);
  });

  setTimeout(function () {
    run(w, d);
  }, 700);
});

function run(w, d) {
  try {
    // ---------- 1. 模块加载 ----------
    ['TideData', 'TideMeta', 'TideSettings', 'TideIcons', 'TideArt', 'TideFX', 'TideAudio', 'TideCore',
      'TideRender', 'TideUI', 'TideMain'].forEach(function (m) {
        if (w[m]) ok('module ' + m); else fail('module ' + m + ' 未加载');
      });
    if (errors.length) return finish();

    // 测试必须可复现：先把玩家设置复位。
    // 真机存档里可能存着任意缩放倍率/音量，而"视口尺寸 950x800"这类断言
    // 是按 1× 写的 —— 不复位就会随上一个玩家的存档飘。
    // （同族教训：**不可复现的测试等于没有测试**。）
    try { w.TideSettings.reset(); w.TideRender.setZoom(1); } catch (e) { }

    // ---------- 2. 图标模块 ----------
    var icons = w.TideIcons.PATHS;
    var wantIcons = ['hearts', 'broadsword', 'magic-swirl', 'armor-punch', 'magic-shield',
      'checked-shield', 'shield-reflect', 'wingfoot', 'crossed-swords', 'droplets',
      'dodging', 'clover', 'visored-helm', 'breastplate', 'leather-boot', 'ring', 'backpack'];
    var missing = wantIcons.filter(function (n) { return !icons[n]; });
    if (missing.length) fail('缺少图标: ' + missing.join(',')); else ok('图标完整 (' + Object.keys(icons).length + ')');
    // 每个装备基底 / 词条引用的图标都要真的存在，否则界面上会出现空白方块
    var refs = {};
    w.TideData.BASES.forEach(function (b) { refs[b.icon] = 1; });
    w.TideData.EQUIP_SLOTS.forEach(function (s) { refs[s.icon] = 1; });
    w.TideData.AFFIXES.forEach(function (a) { refs[a.icon] = 1; });
    w.TideData.RELICS.forEach(function (r) { refs[r.icon] = 1; });
    Object.keys(w.TideData.STATS).forEach(function (k) { refs[w.TideData.STATS[k].icon] = 1; });
    var bad = Object.keys(refs).filter(function (n) { return !icons[n]; });
    if (bad.length) fail('数据层引用了不存在的图标: ' + bad.join(',')); else ok('数据层图标引用全部有效');

    // ---------- 3. 瓦片生成 ----------
    var tiles = w.TideArt.tiles;
    var tileKeys = ['floor0', 'water1', 'lava2', 'moss1', 'stairs1', 'chest',
      'prop_brazier1', 'wall0', 'wall7', 'shop0', 'fountain'];
    var missT = tileKeys.filter(function (k) { return !tiles[k]; });
    if (missT.length) fail('缺少瓦片: ' + missT.join(',')); else ok('瓦片全部就绪');

    // ---------- 4. 开始界面 DOM ----------
    if (d.querySelectorAll('#class-pick .cls-card').length !== 4) fail('职业卡数量不是 4');
    else ok('职业卡 4 张');
    if (d.querySelectorAll('#diff-pick .diff-card').length !== 3) fail('难度卡数量不是 3');
    else ok('难度卡 3 张');
    var artImg = d.querySelector('#class-pick .cls-art');
    if (!artImg || artImg.src.indexOf('data:image/png') !== 0) fail('职业立绘未生成');
    else ok('职业立绘 dataURL 已生成');

    // ---------- 5. 开局 ----------
    var core = w.TideCore;
    w.TideUI.pick.cls = 'warlord';
    w.TideUI.pick.diff = 'standard';
    w.TideMain.start({ mode: 'normal', seed: 20260922 });
    var g = w.TideMain.game;
    if (!g) { fail('start() 之后没有 game'); return finish(); }
    ok('开局 depth=' + g.depth + ' enemies=' + g.enemies.length + ' hp=' + g.hp);

    if (g.W !== 45 || g.H !== 35) fail('地图尺寸不是 45x35: ' + g.W + 'x' + g.H);
    else ok('地图 45x35');
    if (!g.base || g.base.length !== g.W * g.H) fail('缺少基准地形快照 base');
    else ok('基准地形快照存在');

    // 出生点必须可站立，且周围没有水
    if (!g.walkable(g.px, g.py)) fail('玩家出生点不可站立');
    else ok('出生点合法');

    // 出口必须可达（这是之前真实踩过的坑）
    var reach = g._reachable(g.px, g.py);
    if (!reach[g.exit.y * g.W + g.exit.x]) fail('潮汐之门不可达');
    else ok('潮汐之门可达');
    var unreach = 0;
    g.enemies.forEach(function (e) { if (!reach[e.y * g.W + e.x]) unreach++; });
    if (unreach) fail(unreach + ' 个敌人不可达'); else ok('全部敌人可达');

    // ---------- 6. 战斗数学 ----------
    if (!approx(core.rawDamage(50, 0, 50, 50), 25, 0.01)) fail('伤害公式：50攻打50防应为25');
    else ok('伤害公式 radDamage 正确');
    if (!approx(core.rawDamage(100, 50, 50, 50), 100, 0.01)) fail('穿透应把防御削到0');
    else ok('穿透计算正确');
    if (core.rawDamage(10, 0, 0, 50) !== 10) fail('零防御时伤害应等于攻击');
    else ok('零防御边界正确');
    // NaN 传染是上一版的经典事故，必须守住
    var nanTests = [
      ['缺 penP', { atkP: 10, defP: 5 }, { defP: 5 }],
      ['缺 defM', { atkM: 10, penM: 3 }, {}],
      ['全空', {}, {}]
    ];
    var nanBad = 0;
    nanTests.forEach(function (t) {
      var v = core.rawDamage(t[1].atkP || t[1].atkM, t[1].penP || t[1].penM, t[2].defP || t[2].defM, 50);
      if (!isFinite(v)) { nanBad++; fail('NaN 传染: ' + t[0]); }
    });
    if (!nanBad) ok('缺字段不会产生 NaN');

    // ---------- 7. 装备与掉落 ----------
    var rar = {};
    var flagItems = 0;
    for (var i = 0; i < 400; i++) {
      var it = g.makeItem({ depth: 1 + (i % 5), bonus: i % 3 });
      rar[it.rarity] = (rar[it.rarity] || 0) + 1;
      if (!it.name || !it.slot || !it.text.length) { fail('装备字段不全: ' + JSON.stringify(it).slice(0, 120)); break; }
      for (var k in it.total) if (!isFinite(it.total[k])) { fail('装备属性 NaN: ' + k); break; }
      for (var f in it.flags) flagItems++;
    }
    ok('400 件随机装备生成成功，品质分布 ' + JSON.stringify(rar));
    if (Object.keys(rar).length < 4) fail('品质分布过窄: ' + JSON.stringify(rar));
    else ok('品质分布覆盖 ' + Object.keys(rar).length + ' 档');

    // 掉率抽样
    var drops = 0, N = 3000;
    var fakeEnemy = { kind: 'normal', x: 0, y: 0 };
    for (var j = 0; j < N; j++) if (g._rollDrop(fakeEnemy)) drops++;
    var rate = drops / N;
    ok('普通怪掉率抽样 ' + (rate * 100).toFixed(1) + '% (配置 ' + (w.TideData.LOOT.baseChance * 100) + '%)');
    if (Math.abs(rate - w.TideData.LOOT.baseChance) > 0.05) fail('掉率偏离配置过多');

    // ---------- 8. 装备穿戴 / 卸下 ----------
    g.bag = [];
    for (var s = 0; s < 6; s++) g.bag.push(g.makeItem({ depth: 3 }));
    var before0 = g.bag.length;
    g.equipFromBag(0);
    if (g.bag.length !== before0 - 1) fail('穿戴后背包数量不对');
    else ok('穿戴装备 ok');
    var slot0 = Object.keys(g.equip).filter(function (k) { return g.equip[k]; })[0];
    if (!slot0) fail('穿戴后 equip 仍为空');
    else {
      var hpBefore = g.hp, maxBefore = g.stats().hp;
      g.unequip(slot0);
      if (g.equip[slot0]) fail('卸下失败');
      else ok('卸下装备 ok (生命 ' + hpBefore + '→' + g.hp + ', 上限 ' + maxBefore + '→' + g.stats().hp + ')');
      if (g.hp > g.stats().hp) fail('卸下后当前生命超过上限');
    }

    // ---------- 9. 潮汐 ----------
    var t0 = g.tideLevel;
    var lvls = [];
    g.turn = 0;
    var tideEvery = w.TideData.DIFFICULTIES.standard.tideEvery;
    for (var turn = 0; turn < 60; turn++) {
      g.turn += tideEvery;
      g._tideTick();
      lvls.push(g.tideLevel);
    }
    ok('潮汐水位序列 ' + lvls.slice(0, 14).join('') + '  (完整周期 ' + lvls.slice(0, 7).join('') + ')');
    if (lvls.indexOf(0) < 0) fail('潮汐从不回落 —— 水位会变成单向死亡时钟');
    else ok('潮汐有涨有落');
    if (lvls.indexOf(3) < 0) fail('潮汐涨不到满潮');
    else ok('潮汐能到满潮');
    // 水面必须真的跟着变
    var waterAt = function () {
      var n = 0;
      for (var q = 0; q < g.tiles.length; q++) if (g.tiles[q] === core.T.WATER) n++;
      return n;
    };
    g.tideLevel = 0; g._applyTide();
    var w0 = waterAt();
    g.tideLevel = 3; g._applyTide();
    var w3 = waterAt();
    if (w3 <= w0) fail('水位3 的水面没有比水位0 大 (' + w0 + ' → ' + w3 + ')');
    else ok('水面随水位变化 ' + w0 + ' → ' + w3 + ' 格');
    g.tideLevel = 0; g._applyTide();
    if (waterAt() !== w0) fail('退潮没有退回到基准 (' + waterAt() + ' vs ' + w0 + ')');
    else ok('退潮能回到基准');

    // ---------- 10. 走完整局（走真实 action 路径，含界面刷新） ----------
    w.TideMain.start({ mode: 'normal', seed: 20260922 });
    g = w.TideMain.game;
    var steps = 0, killed = 0, levels = 1;
    var guard = 0;
    while (g.status === 'playing' && guard++ < 1500) {
      if (g.pendingRelic) { w.TideMain.chooseRelic(g.pendingRelic[0].id); continue; }
      var beforeTurn = g.turn;
      // 复刻 AI 的一步，但每次都走 TideMain 的公开入口
      var st = g.stats();
      var tgt = null, bestSc = -1e9;
      for (var ei = 0; ei < g.enemies.length; ei++) {
        var e2 = g.enemies[ei];
        var dd = Math.abs(e2.x - g.px) + Math.abs(e2.y - g.py);
        var sc = -dd + (e2.isBoss ? -30 : 0);
        if (sc > bestSc) { bestSc = sc; tgt = e2; }
      }
      var path = tgt ? g.findPath(g.px, g.py, tgt.x, tgt.y, 400, 0) : null;
      if (!path) path = g.findPath(g.px, g.py, g.exit.x, g.exit.y, 400, 5);
      if (!path || path.length < 2) break;
      if (!g.stepTo(path[1].x, path[1].y)) break;
      if (g.turn === beforeTurn && g.status === 'playing') break;
      steps++;
      w.TideMain.refresh();
      if (steps % 40 === 0) w.TideRender.render(g, {}, { x: 0, y: 0 });
    }
    ok('实战推进 ' + steps + ' 步，结局=' + g.status + '，回合=' + g.turn +
      '，击杀=' + g.kills + '，深度=' + g.depth + '，秘藏=' + g.relics.length + '，背包=' + g.bag.length);
    if (g.hp > g.stats().hp) fail('生命超过上限: ' + g.hp + ' > ' + g.stats().hp);

    // 渲染在 showGame() 里是延时初始化的，这里显式确保它已经就绪
    w.TideRender.init();
    var vw = w.TideRender.view;
    if (vw.w < 100 || vw.h < 100) fail('视口尺寸异常: ' + vw.w + 'x' + vw.h);
    else ok('视口尺寸 ' + vw.w + 'x' + vw.h);

    // ---------- 11. 渲染不炸 ----------
    var threw = 0;
    try {
      w.TideRender.markDirty();
      for (var r = 0; r < 8; r++) {
        w.TideRender.render(g, { waterFrame: r % 3, lavaFrame: r % 3, path: path }, { x: 1, y: -1 }, 16);
      }
    } catch (e) { threw = 1; fail('render 抛异常: ' + (e && e.message)); }
    if (!threw) ok('render 连续 8 帧无异常（含插值与 dt）');

    // ---------- 11b. 画面不是黑屏 / 纯色 ----------
    // 看不到画面，就只能用像素统计兜底：
    // 全黑、全单色、对比度为零，这三种情况肉眼一看就知道坏了，
    // 但它们不会抛异常，必须靠检查才能发现。
    try {
      var cv = d.getElementById('view');
      var ictx = cv.getContext('2d');
      var img = ictx.getImageData(0, 0, cv.width, cv.height).data;
      var sum = 0, n = 0, buckets = {}, minL = 255, maxL = 0;
      for (var p = 0; p < img.length; p += 4 * 29) {
        var R = img[p], G = img[p + 1], B = img[p + 2];
        var L = (R * 0.299 + G * 0.587 + B * 0.114);
        sum += L; n++;
        if (L < minL) minL = L;
        if (L > maxL) maxL = L;
        buckets[(R >> 4) + ',' + (G >> 4) + ',' + (B >> 4)] = 1;
      }
      var mean = sum / n;
      var nc = Object.keys(buckets).length;
      ok('画面统计: 平均亮度=' + mean.toFixed(1) + ' 亮度范围=[' + minL.toFixed(0) + ',' +
        maxL.toFixed(0) + '] 色块种类=' + nc + ' (采样 ' + n + ' 点)');
      if (mean < 6) fail('画面几乎全黑（平均亮度 ' + mean.toFixed(1) + '）');
      if (nc < 40) fail('画面色彩过于单一（仅 ' + nc + ' 种色块）');
      if (maxL - minL < 60) fail('画面对比度过低（' + (maxL - minL).toFixed(0) + '）');
      // 视野内（画面上最亮的那批像素）必须真的有东西，否则就是"一片黑"
      var ls = [];
      for (var yy = 0; yy < cv.height; yy += 17) {
        for (var xx = 0; xx < cv.width; xx += 17) {
          var idx4 = (yy * cv.width + xx) * 4;
          ls.push(img[idx4] * 0.299 + img[idx4 + 1] * 0.587 + img[idx4 + 2] * 0.114);
        }
      }
      ls.sort(function (a, b) { return b - a; });
      var topMean = 0, topN = Math.max(1, Math.floor(ls.length * 0.15));
      for (var q = 0; q < topN; q++) topMean += ls[q];
      topMean /= topN;
      ok('最亮的 15% 像素平均亮度=' + topMean.toFixed(1) + '（视野内实际内容）');
      if (topMean < 30) fail('视野内几乎没有可见内容（最亮区仅 ' + topMean.toFixed(1) + '）');

      // 定位用：可见格数量 + 玩家位置附近的亮度。
      // 只报"整体偏暗"是没法修的，必须知道是"光照没打上"还是"视野没算出来"。
      var vsum = 0;
      for (var vi = 0; vi < g.visible.length; vi++) vsum += g.visible[vi];
      var cam = w.TideRender.cam;
      var scaleX = cv.width / vw.w, scaleY = cv.height / vw.h;
      var pxc = Math.round((g.px * 32 + 16 - cam.x) * scaleX);
      var pyc = Math.round((g.py * 32 + 16 - cam.y) * scaleY);
      var pb = 0, pn = 0;
      for (var dy2 = -6; dy2 <= 6; dy2++) {
        for (var dx2 = -6; dx2 <= 6; dx2++) {
          var Xi = pxc + dx2, Yi = pyc + dy2;
          if (Xi < 0 || Yi < 0 || Xi >= cv.width || Yi >= cv.height) continue;
          var id4 = (Yi * cv.width + Xi) * 4;
          pb += img[id4] * 0.299 + img[id4 + 1] * 0.587 + img[id4 + 2] * 0.114;
          pn++;
        }
      }
      ok('可见格 ' + vsum + ' 个 · 玩家处亮度 ' + (pn ? (pb / pn).toFixed(1) : 'N/A') +
        ' · 相机 ' + cam.x + ',' + cam.y);
      if (vsum < 20) fail('视野几乎没算出来（可见格仅 ' + vsum + '）');
    } catch (e) { fail('读取画布失败: ' + (e && e.message)); }

    // ---------- 12. 界面各面板 ----------
    w.TideUI.render(g);
    if (!d.getElementById('stat-panel').children.length) fail('属性面板为空');
    else ok('属性面板 ' + d.getElementById('stat-panel').children.length + ' 行');
    if (d.querySelectorAll('#equip-panel .eq-slot').length !== 5) fail('装备槽不是 5 个');
    else ok('装备槽 5 个');
    if (w.TideData.LOOT.backpackSize !== 40) fail('背包容量不是 40: ' + w.TideData.LOOT.backpackSize);
    else ok('背包容量 40 格');

    // ---------- 13. 各职业 / 各难度都能起局 ----------
    var combos = 0;
    w.TideData.CLASSES.forEach(function (c) {
      w.TideData.DIFF_ORDER.forEach(function (dd) {
        var gg = new core.Game({ classKey: c.key, difficulty: dd, seed: 42 });
        if (!gg.walkable(gg.px, gg.py)) fail('起局非法: ' + c.key + '/' + dd);
        var rr = gg._reachable(gg.px, gg.py);
        if (!rr[gg.exit.y * gg.W + gg.exit.x]) fail('出口不可达: ' + c.key + '/' + dd);
        combos++;
      });
    });
    ok(combos + ' 个职业×难度组合全部能起局且出口可达');

    // ---------- 14. 结束弹窗 ----------
    w.TideUI.showOver(g);
    if (d.getElementById('over-modal').classList.contains('hidden')) fail('结算弹窗没弹出');
    else ok('结算弹窗正常');

    // ---------- 15. 真实点击路径 ----------
    // 前面全是直接调模块 API，绕过了 DOM 事件。
    // 但玩家走的是"点按钮"这条路，而按钮回调里的任何异常都不会被 API 测试发现 ——
    // 曾经就是这样漏掉了一个"音频抛异常导致开始按钮失效"的 bug。
    w.TideUI.showTitle();
    var btnStart = d.getElementById('btn-start');
    var before = errors.length;
    btnStart.click();
    if (errors.length > before) {
      fail('点击「开始下潜」抛异常（见上方 window.onerror）');
    } else if (!d.getElementById('title-screen').classList.contains('hidden')) {
      fail('点击「开始下潜」后标题页没有隐藏');
    } else if (d.getElementById('game-screen').classList.contains('hidden')) {
      fail('点击「开始下潜」后游戏页没有显示');
    } else if (!w.TideMain.game) {
      fail('点击「开始下潜」后没有创建对局');
    } else {
      ok('点击「开始下潜」→ 进入游戏，depth=' + w.TideMain.game.depth);
    }

    // 难度 / 职业卡片的点击也要真的生效
    var dcard = d.querySelector('#diff-pick .diff-card[data-diff="abyss"]');
    if (dcard) {
      dcard.click();

    // 选中的职业真的会被开局采用

    d.getElementById('btn-start').click();
    if (w.TideMain.game && w.TideMain.game.cls.key !== 'arcanist') {
      fail('开局没有采用选中的职业: ' + w.TideMain.game.cls.key);
    } else ok('开局采用选中的职业 arcanist');

    // 说明弹窗
    d.getElementById('btn-help2') && d.getElementById('btn-help2').click();
    if (!d.getElementById('help-modal').classList.contains('hidden')) ok('说明弹窗可打开');
    else fail('说明弹窗没打开');
    w.TideUI.closeHelp();

    // ---------- 16. 秘藏三选一 ----------
    w.TideUI.showTitle();
    // 钉死种子。标题页的「开始下潜」走 mode:'normal'、不传 seed，
    // 于是 Game 用 Date.now() ^ Math.random() 做种（core.js:210）——
    // 每次跑出来的地图 / 敌人 / 装备都不一样，凡是打印数值的断言都不可复现，
    // 逐位对照直接失效。（本次 1vN 重构里那个把 `src === a` 误写成
    // `src.isPlayer` 的 bug，正是靠"数值从 42 变成 62"才暴露的；
    // 在抖动的基线上它会被当成噪声放过去。）
    //
    // ⚠ 必须钉 **iframe 的** w.Math / w.Date。游戏在 iframe 自己的 window 里
    //   执行，钉外层页面的 Math/Date 对它毫无作用 —— 这个坑本轮实测踩到过。
    // 只在这一次点击期间生效，点完立刻还原，路径覆盖不变。
    var _randSave = w.Math.random, _nowSave = w.Date.now;
    w.Math.random = function () { return 0.5; };
    w.Date.now = function () { return 1758000000000; };
    try {
      d.getElementById('btn-start').click();
    } finally {
      w.Math.random = _randSave;
      w.Date.now = _nowSave;
    }
    var g2 = w.TideMain.game;
    g2.bag = [];
    for (var bi = 0; bi < 4; bi++) g2.bag.push(g2.makeItem({ depth: 3 }));

    var rcards = d.querySelectorAll('#relic-cards .relic-card');

    else {

      else if (g2.pendingRelic) fail('选择秘藏后 pendingRelic 没有清空');
      else ok('秘藏三选一：点击即获得且状态清空');
    }

    // ---------- 17. 装备气泡（悬停路径） ----------
    try {
      // 气泡现在挂在整屏背包里，先把它打开

      w.TideUI.render(g2);
      g2.bag = [];
      for (var ci = 0; ci < 4; ci++) g2.bag.push(g2.makeItem({ depth: 4 }));
      w.TideUI.render(g2);

      function hoverCell(sel) {
        var c = d.querySelector(sel);
        if (!c) return null;

        c.dispatchEvent(new w.MouseEvent('mousemove', {
          bubbles: true, clientX: rr.left + rr.width / 2, clientY: rr.top + rr.height / 2
        }));

      var tt = hoverCell('#inv-grid .inv-slot.filled');

      else if (!tt.querySelector('.tt-cmp')) fail('气泡缺少对比区块');

      for (var ci2 = 0; ci2 < 4; ci2++) g2.bag.push(g2.makeItem({ depth: 4, slot: 'chest' }));
      g2.equipFromBag(0);
      w.TideUI.render(g2);
      var tt2 = hoverCell('#inv-grid .inv-slot.filled');
      var cmp2 = tt2 && tt2.querySelector('.tt-cmp');
      // 文案会改（现在是"对比已装备的「布袍」"），但必须点出对比目标的**名字**
      if (!cmp2 || cmp2.textContent.indexOf('对比') < 0 || cmp2.textContent.indexOf('「') < 0) {
        fail('同槽位气泡没有显示对比目标: ' + (cmp2 ? cmp2.textContent : '(无)'));
      } else {
        var hasDelta = !!tt2.querySelector('.tt-cmp .up, .tt-cmp .dn, .tt-cmp .eq');
        if (!hasDelta) fail('对比区块没有任何差值标记');
        else ok('同槽位对比差值可见');
      }
      // ---- 委托路径回归测试 ----
      // 重点不是"某个面板能弹气泡"，而是"任何带 data-tip 的元素都能弹"。
      // 这些气泡原来由各面板各自挂 mousemove 实现，漏一处就少一处提示；
      // 改成 document 级委托后，"属性没写进 DOM"或"bindTips 没被调用"都会在这里暴露。
      w.TideUI.closeInventory();
      w.TideUI.render(g2);
      var dtCount = d.querySelectorAll('[data-tip]').length;
      if (dtCount < 8) fail('带 data-tip 的元素太少（' + dtCount + '）：渲染层没把提示属性写进 DOM');
      else ok('data-tip 属性已写入 DOM（' + dtCount + ' 个元素）');

      var statTip = hoverCell('#stat-panel .stat-row');
      if (!statTip || statTip.classList.contains('hidden') ||
          statTip.textContent.indexOf('当前值') < 0) {
        fail('侧栏属性行悬停没有气泡（document 委托未生效）');
      } else ok('侧栏属性行悬停：委托自动生效');

      w.TideUI.openInventory('bag');
      var sellTip = hoverCell('#inv-sell');
      if (!sellTip || sellTip.classList.contains('hidden') ||
          sellTip.textContent.indexOf('出售区') < 0) {
        fail('出售区悬停没有气泡（document 委托未生效）');
      } else ok('出售区悬停：委托自动生效');

      w.TideUI.tooltip('');
    } catch (e) { fail('气泡测试异常: ' + (e && e.message)); }

    // ---------- 19. 背包拖拽 / 出售 / 金币 / 商店 ----------
    try {
      w.TideUI.openInventory('bag');
      g2.bag = [];
      for (var di = 0; di < 3; di++) g2.bag.push(g2.makeItem({ depth: 3, slot: 'helm' }));
      g2.equip.helm = null;
      g2.gold = 0;
      w.TideUI.render(g2);
      w.TideUI.render(g2);

      function rectOf(el) { var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
      function dragTo(srcEl, dstEl) {
        var a = rectOf(srcEl), b = rectOf(dstEl);
        srcEl.dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true, clientX: a.x, clientY: a.y }));
        d.dispatchEvent(new w.MouseEvent('mousemove', { bubbles: true, clientX: b.x, clientY: b.y }));
        d.dispatchEvent(new w.MouseEvent('mouseup', { bubbles: true, clientX: b.x, clientY: b.y }));
      }

      // (a) 拖到装备槽 → 穿戴
      var fromCell = d.querySelector('#inv-grid .inv-slot.filled');
      var helmWrap = d.querySelector('#inv-equip .inv-eq-wrap:nth-child(2)');
      if (!fromCell || !helmWrap) fail('拖拽测试找不到源/目标元素');
      else {
        var bagBefore = g2.bag.length;
        dragTo(fromCell, helmWrap.querySelector('.inv-slot'));
        if (!g2.equip.helm) fail('拖到装备槽没有穿上头盔');
        else if (g2.bag.length !== bagBefore - 1) fail('穿戴后背包数量不对');
        else ok('拖拽穿戴成功: ' + g2.equip.helm.name);
      }

      // (b) 拖到出售区 → 换金币
      w.TideUI.render(g2);
      var sellZone = d.getElementById('inv-sell');
      var goldBefore = g2.gold, bagN = g2.bag.length;
      var sellCell = d.querySelector('#inv-grid .inv-slot.filled');
      if (!sellCell) fail('没有可出售的物品');
      else {
        var expect = g2.sellPrice(g2.bag[0]);
        dragTo(sellCell, sellZone);
        if (g2.gold !== goldBefore + expect) {
          fail('出售金币不对: ' + g2.gold + ' 期望 ' + (goldBefore + expect));
        } else if (g2.bag.length !== bagN - 1) fail('出售后背包数量不对');
        else ok('拖拽出售成功，+' + expect + ' 金币');
      }

      // (c) 无套利：买价必须严格高于卖价，否则可以无限刷钱
      var bad = 0;
      for (var ai = 0; ai < 60; ai++) {
        var ti = g2.makeItem({ depth: 1 + (ai % 5), bonus: ai % 3 });
        if (g2.buyPrice(ti) <= g2.sellPrice(ti)) bad++;
      }
      if (bad) fail('存在套利漏洞：' + bad + '/60 件装备的买价 <= 卖价');
      else ok('买价恒高于卖价，无套利空间');

      // (d) 击杀给金币
      var g3b = g2.gold;
      var anyE = g2.enemies[0];
      if (anyE) {
        g2.hp = 9999; g2.fight(anyE);
        if (g2.gold <= g3b) fail('击杀没有产生金币');
        else ok('击杀掉落金币 +' + (g2.gold - g3b));
      }

      // (e) 商店：不在商栈上不能买，站上去就能买
      w.TideMain.start({ mode: 'normal', seed: 20260922 });
      var g4 = w.TideMain.game;
      g4.gold = 99999;
      w.TideUI.openInventory('shop');
      if (!g4.shopStock || g4.shopStock.length < 5) fail('商店货架为空');
      else ok('商店货架 ' + g4.shopStock.length + ' 项');
      var shopItemIdx = -1;
      for (var si = 0; si < g4.shopStock.length; si++) if (g4.shopStock[si].type === 'item') { shopItemIdx = si; break; }
      var stockBefore = g4.shopStock.length;
      g4.buyItem(shopItemIdx);
      if (g4.shopStock.length !== stockBefore) fail('不在商栈上竟然买成功了');
      else ok('不在潮汐商栈上无法购买（这是有意的设计）');

      // 把玩家挪到商栈上
      var shopPos = null;
      for (var sy2 = 0; sy2 < g4.H && !shopPos; sy2++)
        for (var sx2 = 0; sx2 < g4.W; sx2++)
          if (g4.tileAt(sx2, sy2) === w.TideCore.T.SHOP) { shopPos = { x: sx2, y: sy2 }; break; }
      if (!shopPos) ok('本层没有商栈（随机生成，属正常）');
      else {
        g4.px = shopPos.x; g4.py = shopPos.y;
        var bagB2 = g4.bag.length;
        if (g4.buyItem(shopItemIdx)) {
          if (g4.bag.length !== bagB2 + 1) fail('购买成功但背包没增加');
          else ok('站在商栈上购买成功: ' + g4.bag[g4.bag.length - 1].name);
        } else fail('站在商栈上仍然买不了');
      }

      // (f) 刷新货架花钱
      var goldB3 = g4.gold;
      g4.refreshShop();
      if (g4.gold >= goldB3) fail('刷新货架没有扣钱');
      else ok('刷新货架扣费 ' + (goldB3 - g4.gold) + ' 金币');

      w.TideUI.closeInventory();
      if (!d.getElementById('inv-screen').classList.contains('hidden')) fail('背包界面关不掉');
      else ok('背包界面可关闭');
    } catch (e) { fail('背包/商店测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 18. 敌人信息面板 ----------
    try {
      var anyE = g2.enemies[0];
      if (!anyE) fail('场上没有敌人，无法测试信息面板');
      else {
        // 先把它标成可见，否则 UI 会因为"看不见"而主动隐藏
        g2.visible[anyE.y * g2.W + anyE.x] = 1;
        w.TideUI.enemyInfo(g2, anyE, { clientX: 300, clientY: 300 });
        var ei = d.getElementById('enemy-info');
        if (ei.classList.contains('hidden')) fail('敌人信息面板没有显示');
        // 这条断言被**反过来**了，而且是刻意的：
        // 旧断言是「面板必须有'建议'和'掉血预估'」—— 它固化的设计决策是
        // 「引擎替玩家把题做了」。而现在整个方向反了过来：面板只给**入参**
        // （攻击 / 穿透 / 对方防御 / 有效防御），算哪一路更高是玩家自己的事。
        // 把新原则写成断言，以后谁再顺手加个"建议"就会当场红掉。
        else if (ei.textContent.indexOf('建议') >= 0 || ei.textContent.indexOf('预计这场要掉') >= 0)
          fail('敌人信息面板又在替玩家做题了：出现了"建议"或掉血预估');
        else if (ei.textContent.indexOf('有效') < 0)
          fail('敌人信息面板缺少"有效防御"这一列入参');
        else if (ei.textContent.indexOf('攻击') < 0 || ei.textContent.indexOf('穿透') < 0)
          fail('敌人信息面板缺少攻击/穿透入参');
        else ok('敌人信息面板：只给入参（攻击/穿透/对方防御/有效防御），不替玩家做题');
        // 战斗层（v11.2-h）必须被切屏清理掉。
        // 这条断言来自一次真实的翻车：新加了模态层却忘了登记进 showTitle/showGame，
        // 表现是**别的**用例大面积"按键失灵" —— 因为输入全被那个永远开着的层吞了。
        if (!d.getElementById('battle-screen').classList.contains('hidden')) {
          fail('切屏后战斗层没有被关闭（会吞掉所有输入）');
        } else {
          ok('切屏后战斗层已关闭（模态层登记完整）');
        }
      }
      w.TideUI.enemyInfo(g2, null, { clientX: 0, clientY: 0 });
      if (!d.getElementById('enemy-info').classList.contains('hidden')) fail('移开敌人后面板没有隐藏');
      else ok('敌人信息面板能正确隐藏');
    } catch (e) { fail('敌人信息面板测试异常: ' + (e && e.message)); }

    // ---------- 20. 键盘输入 ----------
    // 键盘是主操作方式，但前面所有测试都只覆盖了鼠标。
    // 用真实 KeyboardEvent 打一遍，避免出现"能点不能走"这种低级但致命的问题。
    try {
      w.TideUI.closeInventory();
      w.TideMain.start({ mode: 'normal', seed: 20260922 });
      var gk = w.TideMain.game;

      // (a) E 开关背包 —— 这个断言与地图无关，必定可复现
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'e', bubbles: true }));
      if (!w.TideUI.isInventoryOpen()) fail('按 E 没有打开背包');
      else ok('按 E 打开背包');
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'e', bubbles: true }));
      if (w.TideUI.isInventoryOpen()) fail('再按 E 没有关掉背包');
      else ok('再按 E 关闭背包');
      // Esc 的语义是**逐层往回退**：先把弹窗关掉，全关完了才轮到暂停菜单。
      // 这里本意只是"确保没有弹窗挡着后面的输入测试"，而现在无弹窗时按 Esc
      // 会打开暂停菜单 —— 所以必须把它收掉，否则 (b)(c) 两段会被菜单挡住。
      // （这不是产品问题，是这条测试要跟上新的按键语义；新语义由第 29 节专门验。）
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      if (w.TideUI.isHelpOpen()) fail('Esc 没有关掉说明');
      else ok('Esc 生效（弹窗层已清空）');
      if (w.TideUI.isPauseOpen()) w.TideUI.closePause();

      // (b) 方向键真的会走一格 —— 找一个四周有可走格的位置
      var dirs = [['ArrowRight', 1, 0], ['ArrowLeft', -1, 0], ['ArrowDown', 0, 1], ['ArrowUp', 0, -1]];
      var moved = false, tried = 0;
      for (var s2 = 0; s2 < gk.H * gk.W && !moved; s2++) {
        var tx = s2 % gk.W, ty = (s2 / gk.W) | 0;
        if (!gk.walkable(tx, ty) || gk.enemyAt(tx, ty)) continue;
        for (var di2 = 0; di2 < dirs.length; di2++) {
          var d3 = dirs[di2];
          var nx = tx + d3[1], ny = ty + d3[2];
          if (!gk.walkable(nx, ny) || gk.enemyAt(nx, ny)) continue;
          gk.px = tx; gk.py = ty;
          var turnBefore = gk.turn;
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: d3[0], bubbles: true }));
          w.dispatchEvent(new w.KeyboardEvent('keyup', { key: d3[0], bubbles: true }));
          tried++;
          if (gk.px === nx && gk.py === ny && gk.turn > turnBefore) { moved = true; break; }
        }
      }
      if (!moved) fail('方向键没有让角色移动（尝试了 ' + tried + ' 个方向）');
      else ok('方向键移动生效（' + tried + ' 次尝试内成功）');

      // (c) 空格等一回合
      var turnB = gk.turn;
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
      if (gk.turn <= turnB) fail('空格没有消耗回合');
      else ok('空格原地等待生效');

      // (d) 背包打开时方向键不应该让角色乱走
      w.TideUI.openInventory('bag');
      var pxB = gk.px, pyB = gk.py, turnB2 = gk.turn;
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      w.dispatchEvent(new w.KeyboardEvent('keyup', { key: 'ArrowRight', bubbles: true }));
      if (gk.px !== pxB || gk.py !== pyB || gk.turn !== turnB2) fail('背包打开时角色仍然在移动');
      else ok('背包打开时屏蔽了移动输入');
      w.TideUI.closeInventory();
    } catch (e) { fail('键盘测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 21. 相机滚动后地形必须铺满视口 ----------
    // 这是本轮修复的回归测试，针对的是"地图是黑的、人物错位、偶尔又正常"。
    // 地形层被烘焙成一张离屏画布再贴上来，它的目标偏移必须是「源偏移 − 相机」。
    // 写成「源偏移」不会报错、不会崩、像素统计也很难发现：
    // 只是地形和玩家错开整整一个相机位移、视口左上留出等宽黑带，
    // 而且**相机停在原点时恰好正确** —— 于是看起来像偶发故障。
    //
    // 判据：把玩家挪到地图正中（位移够大时相机会瞬移，不必等平滑收敛），
    //       强制全图已探索（排除"迷雾本来就是黑的"这个干扰），
    //       然后视口最左/最上都不许出现"整列都是填充色"的空白带。
    //       注意必须报告相机位置：相机没滚起来时这条测试是无效的，要当失败报。
    try {
      var g6 = w.TideMain.game;
      if (!g6) fail('相机偏移测试：没有对局');
      else {
        g6.explored.fill(1);
        g6.px = Math.floor(g6.W / 2);
        g6.py = Math.floor(g6.H / 2);
        if (g6._recomputeFOV) g6._recomputeFOV();
        w.TideRender.markDirty();
        for (var ri = 0; ri < 20; ri++) w.TideRender.render(g6, {}, null, 500);
        var cam6 = w.TideRender.cam;
        if (Math.abs(cam6.x) < 200 || Math.abs(cam6.y) < 100) {
          fail('相机没滚到地图中央，这条测试无效（cam=' + cam6.x + ',' + cam6.y + '）');
        } else {
          var cv6 = d.getElementById('view');
          var ctx6 = cv6.getContext('2d');
          var im6 = ctx6.getImageData(0, 0, cv6.width, cv6.height).data;
          var CW6 = cv6.width, CH6 = cv6.height;
          function nearBG6(i) {
            return Math.abs(im6[i] - 5) <= 3 && Math.abs(im6[i + 1] - 7) <= 3 && Math.abs(im6[i + 2] - 13) <= 3;
          }
          function blankCol(x) {
            for (var y = 0; y < CH6; y += 2) { if (!nearBG6((y * CW6 + x) * 4)) return false; }
            return true;
          }
          function blankRow(y) {
            for (var x = 0; x < CW6; x += 2) { if (!nearBG6((y * CW6 + x) * 4)) return false; }
            return true;
          }
          var lb6 = 0; while (lb6 < CW6 && blankCol(lb6)) lb6++;
          var tb6 = 0; while (tb6 < CH6 && blankRow(tb6)) tb6++;
          if (lb6 > 4 || tb6 > 4) {
            fail('相机滚起来后地形没铺满视口：左空白 ' + lb6 + 'px、上空白 ' + tb6 +
              'px（相机 ' + cam6.x + ',' + cam6.y + '）—— 地形层的目标偏移漏了 −cam');
          } else {
            ok('相机滚动后地形铺满视口（左 ' + lb6 + 'px / 上 ' + tb6 + 'px 空白，相机 ' +
              cam6.x + ',' + cam6.y + '）');
          }
        }
      }
    } catch (e) { fail('相机偏移测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 22. 层级梯子（气泡 / 提示条必须在所有界面之上） ----------
    // 这是本轮修的 bug：气泡与 toast 的 z-index 分别是 90 / 95，而整屏背包是 96，
    // 于是"在背包里悬停装备看不到详情""在背包里拖错槽位时那句提示根本看不见"。
    // 根因不是某处写错，而是没有梯子 —— 每个数字都各自就事论事。
    // 所以这里直接断言**大小关系**（梯子），而不是断言某个具体数字。
    try {
      function zi(sel) {
        var el = d.querySelector(sel);
        if (!el) return NaN;
        return parseInt(w.getComputedStyle(el).zIndex, 10);
      }
      // 拖影只在拖拽过程中存在，平时查不到 —— 临时造一个来量它的层级规则
      var ghostProbe = d.createElement('div');
      ghostProbe.className = 'drag-ghost';
      d.body.appendChild(ghostProbe);
      var zGhost = zi('.drag-ghost');
      ghostProbe.parentNode.removeChild(ghostProbe);
      var zTip = zi('#tooltip'), zToast = zi('#toast'), zInv = zi('#inv-screen'),
        zModal = zi('.modal');
      if (!isFinite(zTip) || !isFinite(zToast) || !isFinite(zInv) ||
          !isFinite(zModal) || !isFinite(zGhost)) {
        fail('层级检查：有元素的 z-index 不是数字（气泡 ' + zTip + ' / 提示条 ' + zToast +
          ' / 背包 ' + zInv + ' / 弹窗 ' + zModal + ' / 拖影 ' + zGhost + '）');
      } else if (!(zTip > zInv)) {
        fail('悬停气泡在背包之下（气泡 ' + zTip + ' ≤ 背包 ' + zInv + '）：背包里看不到装备详情');
      } else if (!(zTip > zModal)) {
        fail('悬停气泡在弹窗之下（气泡 ' + zTip + ' ≤ 弹窗 ' + zModal + '）');
      } else if (!(zToast > zInv && zToast > zModal)) {
        fail('消息提示条在背包/弹窗之下（提示条 ' + zToast + ' ≤ 背包 ' + zInv +
          ' / 弹窗 ' + zModal + '）：在背包里操作失败时的提示会看不见');
      } else if (!(zGhost > zInv)) {
        fail('拖拽幽灵在背包之下（拖影 ' + zGhost + ' ≤ 背包 ' + zInv + '）：拖动时看不见手上的东西');
      } else {
        ok('层级梯子正确（气泡 ' + zTip + ' / 提示条 ' + zToast + ' > 背包 ' + zInv +
          '、弹窗 ' + zModal + '；拖影 ' + zGhost + '）');
      }
    } catch (e) { fail('层级检查异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 23. 魂技（元气骑士式主动技能） ----------
    // 新机制最容易漏掉的不是"能不能用"，而是三件事：
    //   ① 失败时会不会白罚冷却（玩家按了没反应的挫败感来源）
    //   ② 模拟器的 AI 会不会用（不会用 → 平衡数据是假的）
    //   ③ 免费行动会不会被当成卡死（新机制污染旧的不变量判断）
    try {
      var SK = ['warlord', 'arcanist', 'ranger', 'warden'];
      var skBad = [];
      for (var si = 0; si < SK.length; si++) {
        var sd = w.TideData.skillByClass(SK[si]);
        if (!sd || !sd.name || !sd.icon || !sd.cd || !sd.kind) skBad.push(SK[si] + ':定义不全');
        else if (!w.TideIcons.PATHS[sd.icon]) skBad.push(SK[si] + ':图标 ' + sd.icon + ' 不存在');
      }
      if (skBad.length) fail('魂技定义有问题: ' + skBad.join(', '));
      else ok('四个职业的魂技定义与图标都齐全');
    } catch (e) { fail('魂技定义检查异常: ' + (e && e.stack ? e.stack : e)); }

    // (a) 空放不吃冷却 —— "按了没反应"和"还在冷却"必须分得清
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'warlord', difficulty: 'standard' });
      var gA = w.TideMain.game;
      gA.enemies = [];
      var rA = gA.useSkill();
      if (rA.ok) fail('附近没有目标竟然放成功了');
      else if (rA.reason !== 'empty') fail('空放的失败原因不对: ' + rA.reason);
      else if (gA.skillCd !== 0) fail('空放消耗了冷却（' + gA.skillCd + '）—— 玩家点空一次就被白罚十几回合');
      else ok('魂技空放：不生效也不吃冷却');
    } catch (e) { fail('魂技空放测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (b) burst 型：单方面命中（不吃反击）+ 正常进冷却 + 冷却中拒绝
    try {
      var gB = w.TideMain.game;
      gB.enemies = [];
      var dirsB = [[1, 0], [-1, 0], [0, 1], [0, -1]], placed = 0, enemyB = null;
      for (var di = 0; di < 4 && placed < 2; di++) {
        var bx = gB.px + dirsB[di][0], by = gB.py + dirsB[di][1];
        if (!gB.walkable(bx, by) || gB.enemyAt(bx, by)) continue;
        var eb = gB._makeEnemy(bx, by, 2);
        gB.enemies.push(eb);
        if (!enemyB) enemyB = eb;
        placed++;
      }
      if (!placed) fail('周围没有可放敌人的空格，这条测试安排不上');
      else {
        var hpB = enemyB.hp;
        var rB = gB.useSkill();
        var evsB = gB.drainEvents(), hitB = null, fightsB = 0;
        for (var ei = 0; ei < evsB.length; ei++) {
          if (evsB[ei].kind === 'hit' && evsB[ei].skill) hitB = evsB[ei];
          if (evsB[ei].kind === 'fight') fightsB++;
        }
        if (!rB.ok) fail('贴身有敌人却放不出裂地斩: ' + rB.reason);
        else if (!hitB) fail('魂技没有产生命中事件');
        else if (!(enemyB.hp < hpB)) fail('魂技没有造成伤害（' + hpB + ' → ' + enemyB.hp + '）');
        else if (hitB.rounds.length !== 1) fail('魂技命中的回合数不是 1：' + hitB.rounds.length + '（技能不该触发对拼）');
        else if (fightsB) fail('魂技触发了整场对决，应该是单方面一击');
        else if (gB.skillCd !== gB.skill().cd - gB.skill().cost) {
          // 冷却按"回合"结算：施放本身消耗一个回合，所以放完之后
          // 剩余冷却 = cd - 1（第 T 回合放，第 T+cd 回合又好）。
          // 这个 -1 不是 bug，是语义 —— 写清楚免得下次有人"修"它。
          fail('魂技冷却不对: ' + gB.skillCd + '，期望 ' + (gB.skill().cd - gB.skill().cost));
        }
        else {
          var rB2 = gB.useSkill();
          if (rB2.ok) fail('冷却中竟然还能放');
          else if (rB2.reason !== 'cd') fail('冷却中被拒的原因不对: ' + rB2.reason);
          else ok('魂技：单方面命中 + 进冷却 ' + gB.skillCd + ' 回合 + 冷却中正确拒绝');
        }
      }
    } catch (e) { fail('魂技命中测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (c) buff 型：生效 / 提高面板 / 回血 / 按期消失并还原
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'warden', difficulty: 'standard' });
      var gC = w.TideMain.game;
      gC.enemies = [];
      var defBase = gC.stats().defP;
      gC.hp = Math.round(gC.stats().hp * 0.35);
      var defLow = gC.stats().defP, hpLow = gC.hp;
      var rC = gC.useSkill();
      if (!rC.ok) fail('不退之壁放不出来: ' + rC.reason);
      else if (!gC.buffs.length) fail('不退之壁没有留下增益');
      else if (!(gC.stats().defP > defLow)) fail('不退之壁没有提高物防（' + defLow + ' → ' + gC.stats().defP + '）');
      else if (!(gC.hp > hpLow)) fail('不退之壁没有回血（' + hpLow + ' → ' + gC.hp + '）');
      else {
        // 持续时间的口径要盯死：面板写 3 回合，就必须真的护到玩家能行动的第 3 个回合。
        // （施放那一手本身也是这 3 回合里的第 1 回合 —— 出生那回合不倒计时）
        var tC = 0;
        while (gC.buffs.length && tC < 12) { gC.endTurn(); tC++; }
        if (gC.buffs.length) fail('增益没有按期消失（' + tC + ' 回合后还在）');
        else if (tC !== 3) fail('不退之壁的回合数与面板文案不符：文案写 3，实测 ' + tC);
        else if (gC.stats().defP > defBase * 1.02) fail('增益消失后面板没还原: ' + gC.stats().defP + ' vs 基准 ' + defBase);
        else ok('不退之壁：增益 + 回血生效，' + tC + ' 回合后自然消失并还原面板（与文案一致）');
      }
    } catch (e) { fail('魂技增益测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (d) 免费行动：不推进回合、逐次递减、用完后恢复正常推进
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'ranger', difficulty: 'standard' });
      var gD = w.TideMain.game;
      gD.enemies = [];
      var rD = gD.useSkill();
      if (!rD.ok) fail('疾影放不出来: ' + rD.reason);
      else if (gD.freeMoves !== 2) fail('疾影没有给出 2 次免费行动: ' + gD.freeMoves);
      else {
        var dirsD = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        function stepOnce(g) {
          for (var i = 0; i < 4; i++) {
            var nx = g.px + dirsD[i][0], ny = g.py + dirsD[i][1];
            if (g.walkable(nx, ny) && !g.enemyAt(nx, ny) && !g.isExplored(nx, ny)) return g.stepTo(nx, ny);
          }
          for (var j = 0; j < 4; j++) {
            var mx = g.px + dirsD[j][0], my = g.py + dirsD[j][1];
            if (g.walkable(mx, my) && !g.enemyAt(mx, my)) return g.stepTo(mx, my);
          }
          return false;
        }
        var t1 = gD.turn, ok1 = stepOnce(gD);
        var t2 = gD.turn, fm1 = gD.freeMoves, ok2 = stepOnce(gD);
        var t3 = gD.turn, ok3 = stepOnce(gD);
        if (!ok1 || !ok2 || !ok3) fail('免费行动测试：走不动，安排不上');
        else if (t2 !== t1) fail('第一次免费行动推进了回合（' + t1 + ' → ' + t2 + '）—— 敌人会跟着动');
        else if (fm1 !== 1) fail('免费行动次数没有递减: ' + fm1);
        else if (t3 !== t2) fail('第二次免费行动推进了回合（' + t2 + ' → ' + t3 + '）');
        else if (gD.freeMoves !== 0) fail('免费行动用完后计数不是 0: ' + gD.freeMoves);
        else if (gD.turn <= t3) fail('免费行动用完后，正常移动没有推进回合');
        else ok('疾影：2 次免费行动不推进回合，用完后恢复正常');
      }
    } catch (e) { fail('免费行动测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (e) 模拟器的 AI 必须真的会用魂技 —— 否则新机制在平衡数据里等于不存在
    try {
      var gE = new w.TideCore.Game({ classKey: 'warlord', difficulty: 'standard', seed: 4242 });
      var outE = gE.playHeadless(1200);
      if (!(gE.skillUses > 0)) fail('一整局里 AI 一次魂技都没放（结局 ' + outE + '）—— 平衡数据会失真');
      else ok('模拟器 AI 会主动使用魂技（本局 ' + gE.skillUses + ' 次，结局 ' + outE + '）');
    } catch (e) { fail('AI 用技能测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (f) 免费行动不能被误判成卡死
    try {
      var badF = [];
      for (var fi = 0; fi < SK.length; fi++) {
        var oF = w.TideCore.Game.simulate(20, {
          difficulty: 'standard', classKey: SK[fi], seedBase: 777, maxTurns: 2400
        });
        if (oF.stalls) badF.push(SK[fi] + ' 卡死 ' + JSON.stringify(oF.stalls));
        if (oF.outcome && (oF.outcome.stall || oF.outcome.timeout)) {
          badF.push(SK[fi] + ' 结局异常 ' + JSON.stringify(oF.outcome));
        }
      }
      if (badF.length) fail('魂技上线后出现卡死/超时: ' + badF.join(' | '));
      else ok('四职业各 20 局：无卡死、无超时（免费行动没有被误判成卡死）');
    } catch (e) { fail('魂技模拟测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 24. 装备融合（元气骑士式武器融合） ----------
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'warden', difficulty: 'standard' });
      var gG = w.TideMain.game;
      var mk = function (r, d) { return gG.makeItem({ depth: d || 3, slot: 'helm', rarity: r }); };
      var cA = mk('common'), cB = mk('common');
      if (gG.fuseCost(cA, cB) < 0) fail('两件同品质竟然不能融合');
      else if (gG.fuseCost(cA, mk('rare')) >= 0) fail('不同品质竟然可以融合');
      else if (gG.fuseCost(mk('legendary'), mk('legendary')) >= 0) fail('最高品质竟然还能继续融合');
      else if (gG.fuseCost(cA, cA) >= 0) fail('同一件装备竟然能和自己融合');
      else ok('融合前置条件正确（同品质 / 非最高档 / 必须是两件）');
    } catch (e) { fail('融合前置测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      var gG2 = w.TideMain.game;
      gG2.bag = [mk('epic'), mk('epic'), mk('common')];
      gG2.gold = 1000;
      var costG = gG2.fuseCost(gG2.bag[0], gG2.bag[1]);
      var goldG = gG2.gold, bagG = gG2.bag.length;
      var rG = gG2.fuseItems(0, 1);
      if (!rG.ok) fail('融合失败: ' + rG.reason);
      else if (rG.item.rarity !== 'legendary') fail('融合结果品质不是高一档: ' + rG.item.rarity);
      else if (gG2.bag.length !== bagG - 1) fail('融合后背包数量不对: ' + gG2.bag.length);
      else if (gG2.gold !== goldG - costG) fail('融合没有按价扣钱: ' + gG2.gold + '，期望 ' + (goldG - costG));
      else if (gG2.bag.indexOf(rG.item) < 0) fail('融合产物没有进背包');
      else ok('融合：两件史诗 → 一件传说，扣 ' + costG + ' 金币');
    } catch (e) { fail('融合执行测试异常: ' + (e && e.stack ? e.stack : e)); }

    // 反套利：融合费必须 ≥ 产物售价，否则「融合—出售」就是净赚回路
    try {
      var gG3 = w.TideMain.game, arb = 0, triedF = 0;
      for (var fi2 = 0; fi2 < 60; fi2++) {
        var rk2 = w.TideData.RARITIES[fi2 % 4].key;
        var xF = gG3.makeItem({ depth: 1 + (fi2 % 5), slot: 'weapon', rarity: rk2 });
        var yF = gG3.makeItem({ depth: 1 + (fi2 % 5), slot: 'boots', rarity: rk2 });
        var ccF = gG3.fuseCost(xF, yF);
        if (ccF < 0) continue;
        triedF++;
        var resF = gG3.fuseResult(xF, yF);
        var resItem = {
          depth: resF.depth, rarity: resF.rarity.key, slot: resF.slot,
          affixes: new Array(resF.rarity.affixes)
        };
        if (ccF < gG3.sellPrice(resItem)) arb++;
      }
      if (arb) fail('存在融合套利：' + arb + '/' + triedF + ' 组的融合费低于产物售价');
      else ok('融合反套利成立（' + triedF + ' 组：融合费均 ≥ 产物售价）');
    } catch (e) { fail('融合反套利测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      var gG4 = w.TideMain.game;
      gG4.bag = [mk('epic'), mk('epic')];
      gG4.gold = 0;
      var needG = gG4.fuseCost(gG4.bag[0], gG4.bag[1]);
      var rG2 = gG4.fuseItems(0, 1);
      if (rG2.ok) fail('没钱竟然也能融合');
      else if (rG2.reason !== 'gold') fail('没钱的失败原因不对: ' + rG2.reason);
      else if (rG2.cost !== needG) fail('失败提示里的费用不对: ' + rG2.cost + ' vs ' + needG);
      else if (gG4.bag.length !== 2 || gG4.gold !== 0) fail('融合失败竟然改动了背包或金币');
      else ok('金币不足时融合被拒绝，且不产生任何改动');
    } catch (e) { fail('融合缺钱测试异常: ' + (e && e.stack ? e.stack : e)); }

    // AI 也要会用融合 —— 否则新机制在平衡数据里等于不存在
    try {
      var gH = new w.TideCore.Game({ classKey: 'warden', difficulty: 'standard', seed: 99 });
      gH.gold = 5000;
      gH.bag = [];
      for (var hi = 0; hi < 8; hi++) gH.bag.push(gH.makeItem({ depth: 3, slot: 'helm', rarity: 'rare' }));
      gH.playHeadless(400);
      // 判据是「背包里出现了比材料更高一档的东西」，**不是**"背包里有史诗"。
      // 原来写死了 epic：战力口径统一之后 AI 会把稀有一路合到传说，
      // 背包里一件史诗都不剩 —— 这条断言于是报了个假失败。
      // 实测它这一局成功融合了 42 次（取证见 tools/probe_ai.html）。
      // 判据钉在"有没有合上去"，才不会随 AI 的合成深度而飘。
      var baseRankH = w.TideData.rarRank('rare');
      var upg = 0;
      for (var hj = 0; hj < gH.bag.length; hj++) {
        if (w.TideData.rarRank(gH.bag[hj].rarity) > baseRankH) upg++;
      }
      if (!upg) fail('AI 一件都没融合 —— 新机制在平衡数据里等于不存在');
      else ok('模拟器 AI 会主动融合（背包里合出了 ' + upg + ' 件高于稀有的装备）');
    } catch (e) { fail('AI 融合测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 25. 新界面有没有挤坏布局 ----------
    // 加一个 HUD 键最容易撑破那一行按钮；这类"看得见但测不到"的问题
    // 以前只能靠截图肉眼看。DOM 的几何是可以直接判定的，就把它变成断言。
    try {
      var hudEl = d.getElementById('hud-top');
      var hbEl = hudEl ? hudEl.querySelector('.hud-btns') : null;
      var stageEl = d.getElementById('stage');
      if (!hudEl || !hbEl || !stageEl) fail('布局检查：找不到 HUD 或舞台');
      else {
        var sr = stageEl.getBoundingClientRect();
        var hr = hbEl.getBoundingClientRect();
        if (sr.width < 100) ok('布局检查：舞台未布局（标题页），跳过');
        else if (hr.right > sr.right + 1) {
          fail('HUD 按钮溢出舞台：按钮区右缘 ' + Math.round(hr.right) +
            ' > 舞台右缘 ' + Math.round(sr.right));
        } else if (d.getElementById('btn-skill') === null) {
          fail('HUD 上没有魂技键');
        } else {
          ok('HUD 未溢出（按钮区右缘 ' + Math.round(hr.right) + ' ≤ 舞台右缘 ' +
            Math.round(sr.right) + '）');
        }
      }
    } catch (e) { fail('布局检查异常: ' + (e && e.stack ? e.stack : e)); }

    // 侧栏与角色卡上的新元素必须真的渲染出来了（数据对但没画 = 玩家看不见）
    try {
      var spEl = d.getElementById('skill-panel');
      if (!spEl || !spEl.innerHTML) fail('侧栏没有渲染出魂技卡');
      else if (spEl.innerHTML.indexOf('sk-cd') < 0) fail('魂技卡里没有冷却条');
      else ok('侧栏魂技卡已渲染（含冷却条）');
      var bbEl = d.getElementById('hero-buffs');
      if (!bbEl) fail('角色卡上没有增益条容器');
      else ok('角色卡增益条容器就位');
    } catch (e) { fail('新界面渲染检查异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 26. 技能必须"有感觉"，不只是数值生效 ----------
    // 玩家反馈过「技能没有任何感觉，虽然有效」—— 实测那一次它只产生了震屏，
    // 零粒子零飘字。所以这里把"有感觉"翻译成可判定的条件：
    //   ① 事件里带着命中目标与主色（表演层的输入）
    //   ② 主循环必须把它翻译成施法姿态（渲染层的 cast 状态被点亮）
    //   ③ 粒子 / 技能名飘字 / 形状型特效，三个都不能是 0
    function feelOf(className, setup) {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: className, difficulty: 'standard' });
      var g = w.TideMain.game;
      w.TideFX.clear();
      var sk = g.skill();
      if (setup) setup(g);
      var r = g.useSkill();
      if (!r.ok) return { err: '放不出来: ' + r.reason, key: sk.key };
      w.TideMain.flush();                       // 走完整条链：模型 → 主循环 → 特效/渲染
      var c = w.TideFX.counts();
      var cast = w.TideRender.cast;
      return { key: sk.key, ok: true, parts: c.parts, texts: c.texts, rings: c.rings,
        streaks: c.streaks, shake: c.shake, castT: cast.t, castKey: cast.key, name: sk.name };
    }
    try {
      // 破军 · 裂地斩：贴脸放。要求"地裂"是环形 → rings > 0
      var fq = feelOf('warlord', function (g) {
        g.enemies = [];
        var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (var i = 0; i < 4; i++) {
          var nx = g.px + dirs[i][0], ny = g.py + dirs[i][1];
          if (g.walkable(nx, ny)) g.enemies.push(g._makeEnemy(nx, ny, 2));
        }
      });
      if (fq.err) fail('裂地斩：' + fq.err);
      else if (!fq.parts) fail('裂地斩没有任何粒子 —— 玩家看不到自己放了技能');
      else if (!fq.texts) fail('裂地斩没有技能名飘字 —— 玩家不知道刚才放的是什么');
      else if (!fq.rings) fail('裂地斩没有地面冲击环（它的招牌形状）');
      else if (!(fq.castT > 0)) fail('施法姿态没有被触发（渲染层 cast.t = ' + fq.castT + '）');
      else ok('裂地斩有感觉：' + fq.parts + ' 粒子 / ' + fq.rings + ' 冲击环 / ' +
        fq.texts + ' 条飘字 / 施法姿态已触发');
    } catch (e) { fail('裂地斩表演测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      // 秘仪 · 潮语洪流：要求"打出去的水束" → streaks > 0
      var ft = feelOf('arcanist', function (g) {
        var e0 = g.enemies[0];
        if (!e0) return;
        // 站到它旁边并刷新视野，保证它在射程内且可见
        var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (var i = 0; i < 4; i++) {
          var nx = e0.x + dirs[i][0], ny = e0.y + dirs[i][1];
          if (g.walkable(nx, ny) && !g.enemyAt(nx, ny)) { g.px = nx; g.py = ny; break; }
        }
        if (g._recomputeFOV) g._recomputeFOV();
      });
      if (ft.err) fail('潮语洪流：' + ft.err);
      else if (!ft.parts || !ft.texts) fail('潮语洪流没有粒子或飘字');
      else if (!ft.streaks) fail('潮语洪流没有能量束（它的招牌形状）');
      else ok('潮语洪流有感觉：' + ft.parts + ' 粒子 / ' + ft.streaks + ' 道水束 / ' +
        ft.texts + ' 条飘字');
    } catch (e) { fail('潮语洪流表演测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      // 疾风 · 疾影：不需要目标，但必须有残影 → streaks > 0
      var fb = feelOf('ranger', null);
      if (fb.err) fail('疾影：' + fb.err);
      else if (!fb.parts || !fb.texts) fail('疾影没有粒子或飘字');
      else if (!fb.streaks) fail('疾影没有残影拖尾（它的招牌形状）');
      else ok('疾影有感觉：' + fb.parts + ' 粒子 / ' + fb.streaks + ' 道残影 / ' +
        fb.texts + ' 条飘字');
    } catch (e) { fail('疾影表演测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      // 铁壁 · 不退之壁：环形 + 回血飘字，而且**护盾罩要一直亮着**
      var fw = feelOf('warden', function (g) { g.enemies = []; });
      if (fw.err) fail('不退之壁：' + fw.err);
      else if (!fw.parts || !fw.texts || !fw.rings) {
        fail('不退之壁特效不全（粒子 ' + fw.parts + ' / 飘字 ' + fw.texts + ' / 环 ' + fw.rings + '）');
      } else {
        // 增益还在时，渲染层必须画出护盾罩 —— 只闪一下的护盾等于没加
        var gShield = w.TideMain.game;
        if (!gShield.buffs.length) fail('不退之壁没有留下增益');
        else ok('不退之壁有感觉：' + fw.parts + ' 粒子 / ' + fw.rings + ' 环 / 增益持续 ' +
          gShield.buffs[0].turns + ' 回合（护盾罩随增益存在）');
      }
    } catch (e) { fail('不退之壁表演测试异常: ' + (e && e.stack ? e.stack : e)); }

    // 融合也必须有反馈：事件队列要被消费掉，否则音效/提示条全都不出现
    try {
      var gF2 = w.TideMain.game;
      gF2.bag = [gF2.makeItem({ depth: 3, slot: 'helm', rarity: 'epic' }),
        gF2.makeItem({ depth: 3, slot: 'helm', rarity: 'epic' })];
      gF2.gold = 2000;
      gF2.drainEvents();
      var rF2 = gF2.fuseItems(0, 1);
      if (!rF2.ok) fail('融合失败: ' + rF2.reason);
      else {
        var evsF = gF2.drainEvents();
        var hasFuse = false;
        for (var fi3 = 0; fi3 < evsF.length; fi3++) if (evsF[fi3].kind === 'fuse') hasFuse = true;
        if (!hasFuse) fail('融合没有产生事件 —— 界面拿不到任何可以反馈的东西');
        else ok('融合会产生 fuse 事件（主循环据此播音效 + 弹提示条）');
      }
    } catch (e) { fail('融合反馈测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 27. 出错兜底不能反过来把游戏锁死 ----------
    // 上一版的兜底把**任何** window error 事件都当成"游戏崩了"，
    // 而浏览器在资源加载失败（比如 favicon 404）时也会在 window 上报 error，
    // 那种事件没有 message。于是一个无害的 404 变成一张盖住整个游戏的黑屏 ——
    // 玩家看到的就是"一开局就弹出错误、无法开始游戏"。
    try {
      // (a) 资源型错误：没有 message / error → 必须完全忽略
      w.dispatchEvent(new w.Event('error'));
      if (d.getElementById('fatal-restart')) {
        fail('一个没有 message 的资源错误就触发了停机浮层 —— 游戏会被 404 锁死');
      } else if (w.__tideHardStop) {
        fail('资源错误竟然停掉了主循环');
      } else {
        ok('资源型错误被正确忽略（不会拿 404 当崩溃）');
      }

      // (b) 真 JS 错误：只给一条可忽略的提示，绝不停机
      var ev1 = new w.ErrorEvent('error', { message: '烟雾测试用的假错误' });
      w.dispatchEvent(ev1);
      if (d.getElementById('fatal-restart')) {
        fail('单个真错误就触发了停机浮层 —— 玩家会被一次无害异常卡在外面');
      } else if (w.__tideHardStop) {
        fail('单个真错误就停掉了主循环');
      } else {
        ok('单个真错误只提示不停机（游戏可以继续玩）');
      }

      // (c) 短时间内反复出错 → 这才值得停机
      for (var ei2 = 0; ei2 < 6; ei2++) {
        w.dispatchEvent(new w.ErrorEvent('error', { message: '烟雾测试连续错误 ' + ei2 }));
      }
      if (!d.getElementById('fatal-restart')) {
        fail('连续 7 次真错误仍然不停机 —— 那才是真的会黑屏刷错');
      } else if (!w.__tideHardStop) {
        fail('停机浮层出现了但主循环没停');
      } else {
        ok('连续出错才升级为停机浮层（且带"复制错误信息"按钮）');
      }
    } catch (e) { fail('出错兜底测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 28. 四个技能的招牌机制 ----------
    // "把技能做好"不等于"技能有数字"。每个技能都要有一个**只属于它**、
    // 而且能改变打法的机制。这一节逐条验它们真的生效。
    //
    // 伤害类断言全部先把随机源钉死（chance→false、float→0.5），
    // 否则暴击/闪避/回响会让"多了 25%"这种结论完全不可复现。
    function stubRng(g) {
      g.rng.chance = function () { return false; };
      g.rng.float = function () { return 0.5; };
      g.rng.pick = function (arr) { return arr[0]; };
      return g;
    }
    function duelDamage(g, dummy, opts) {
      opts = opts || {};
      const A = Object.assign({}, g.stats());
      A.hp = 1e6; A.maxHp = 1e6;
      const B = Object.assign({}, dummy);
      B.hp = 1e6; B.maxHp = 1e6;
      if (opts.wet) B.wet = 1;
      const r = g._duel(A, B, opts.flags || {}, null, true,
        { name: g.cls.name, isPlayer: true }, { name: '木桩' });
      let sum = 0, types = {};
      for (const rd of (r.log || [])) {
        if (rd.dodge) continue;
        if (rd.from !== g.cls.name) continue;
        sum += rd.dmg;
        types[rd.type] = (types[rd.type] || 0) + 1;
      }
      return { sum: sum, types: types };
    }
    // 一块"物防高、法防 0"的木桩：保证玩家一定走法术那一路，湿透才有意义
    var DUMMY = {
      hp: 1e6, atkP: 30, atkM: 0, penP: 0, penM: 0,
      defP: 40, defM: 0, spd: 1, crit: 0, dodge: 0, leech: 0
    };

    // (a) 裂地斩：把敌人掀开一格
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'warlord', difficulty: 'standard' });
      var gK = w.TideMain.game;
      gK.enemies = [];
      var dirsK = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      var put = null;
      for (var ki = 0; ki < 4; ki++) {
        var ex = gK.px + dirsK[ki][0], ey = gK.py + dirsK[ki][1];
        var bx2 = ex + dirsK[ki][0], by2 = ey + dirsK[ki][1];
        // 要一条"站在旁边、身后是空地"的直线，才推得动
        if (gK.walkable(ex, ey) && !gK.enemyAt(ex, ey) && gK.walkable(bx2, by2) && !gK.enemyAt(bx2, by2)) {
          put = { ex: ex, ey: ey, bx: bx2, by: by2 };
          break;
        }
      }
      if (!put) fail('裂地斩击退测试：找不到"旁边有空地"的位置，安排不上');
      else {
        var eK = gK._makeEnemy(put.ex, put.ey, 3);
        eK.hp = eK.maxHp = 9999;
        gK.enemies.push(eK);
        var rK = gK.useSkill();
        if (!rK.ok) fail('裂地斩放不出来: ' + rK.reason);
        else if (eK.x !== put.bx || eK.y !== put.by) {
          fail('裂地斩没有把敌人掀开：期望 (' + put.bx + ',' + put.by + ')，实际 (' + eK.x + ',' + eK.y + ')');
        } else if (eK.stun > 0) {
          fail('推得动却给了眩晕，两者应该是二选一');
        } else ok('裂地斩把敌人掀开了一格（' + put.ex + ',' + put.ey + ' → ' + eK.x + ',' + eK.y + '）');
      }
    } catch (e) { fail('裂地斩击退测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (b) 裂地斩：推不动就震晕，且被震晕的敌人这一轮不会动
    try {
      var gS = w.TideMain.game;
      gS.enemies = [];
      // 不指望地图上恰好有"敌人身后是墙"的地形 —— 自己砌一个。
      // 让测试依赖随机地形的形状，就是在给自己制造偶发失败。
      var dirP = null;
      for (var si2 = 0; si2 < 4; si2++) {
        var wx = gS.px + dirsK[si2][0], wy = gS.py + dirsK[si2][1];
        if (gS.walkable(wx, wy) && !gS.enemyAt(wx, wy)) { dirP = si2; break; }
      }
      if (dirP === null || !w.TideCore.T) fail('裂地斩震晕测试：安排不上（四周没有空格）');
      else {
        var exS = gS.px + dirsK[dirP][0], eyS = gS.py + dirsK[dirP][1];
        var bxS = exS + dirsK[dirP][0], byS = eyS + dirsK[dirP][1];
        gS.tiles[byS * gS.W + bxS] = w.TideCore.T.WALL;      // 在它身后砌一堵墙
        var eS = gS._makeEnemy(exS, eyS, 3);
        eS.hp = eS.maxHp = 9999;
        eS.stats = Object.assign({}, eS.stats, { atkP: 40, atkM: 40, penP: 0, penM: 0 });
        gS.enemies.push(eS);
        gS.hp = gS.stats().hp;
        gS.skillCd = 0;      // 上一条已经放过一次，这里测的是机制而不是冷却
        var rS = gS.useSkill();
        // useSkill 内部已经推进过一回合（技能消耗回合），所以事件都在这批里
        var evsS = gS.drainEvents();
        var stunEv = false, skipped = false, attacked = false;
        for (var qi = 0; qi < evsS.length; qi++) {
          if (evsS[qi].kind === 'stun') stunEv = true;
          if (evsS[qi].kind === 'stunned' && evsS[qi].enemy === eS) skipped = true;
          // 判据必须排除**技能自己那一下**：_skillHit 也会推 kind:'hit'（额外带 skill:true），
          // 那是"我打它"，不是"它打我"。两者混在一起，这条断言会永远判失败。
          if (evsS[qi].kind === 'hit' && evsS[qi].enemy === eS && !evsS[qi].skill) attacked = true;
        }
        if (!rS.ok) fail('裂地斩（撞墙）放不出来: ' + rS.reason);
        else if (eS.x !== exS || eS.y !== eyS) {
          fail('身后是墙，敌人竟然还是被推动了（' + exS + ',' + eyS + ' → ' + eS.x + ',' + eS.y + '）');
        } else if (!stunEv) {
          fail('推不动，但既没推动也没有震晕事件 —— 掀开和震晕应该二选一');
        } else if (!skipped) {
          fail('震晕挂上了，但它该动的那一刻没有被跳过（没有 stunned 事件）');
        } else if (attacked) {
          fail('被震晕的敌人还是出手了 —— 眩晕没有生效');
        } else {
          // 语义：施放本身花掉一个回合，眩晕就在**紧接的那次 endTurn** 里被消费掉，
          // 也就是"它对你这一手的回应被跳过了"。所以放完之后 stun 已经是 0 是正常的，
          // 判据要看"那一次行动到底有没有发生"，而不是看残留回合数。
          ok('裂地斩撞墙 → 震晕：这一次它没有出手（眩晕在敌人该动的那一刻被消费）');
        }
      }
    } catch (e) { fail('裂地斩震晕测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (c) 潮语洪流：上"潮湿"，且法术伤害确实 +25%
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'arcanist', difficulty: 'standard' });
      stubRng(w.TideMain.game);
      var gW = w.TideMain.game;
      var dry = duelDamage(gW, DUMMY, {});
      var wet2 = duelDamage(gW, DUMMY, { wet: true });
      if (!(dry.types.m > 0)) fail('木桩没有让玩家走法术路线，这条测试无效');
      else if (!(wet2.sum > dry.sum)) {
        fail('潮湿没有提高法术伤害（干 ' + dry.sum + ' vs 湿 ' + wet2.sum + '）');
      } else {
        var ratio = wet2.sum / dry.sum;
        if (Math.abs(ratio - 1.25) > 0.06) fail('潮湿的增伤不是 25%（实测 ' + ratio.toFixed(3) + '）');
        else ok('潮湿生效：法术伤害 ×' + ratio.toFixed(2) + '（干 ' + dry.sum + ' → 湿 ' + wet2.sum + '）');
      }
    } catch (e) { fail('潮湿测试异常: ' + (e && e.stack ? e.stack : e)); }

    try {
      // 上状态这件事本身：真的打到人了才有 wet
      var gW2 = w.TideMain.game;
      var eW = gW2.enemies[0];
      if (!eW) fail('潮湿测试：场上没有敌人');
      else {
        gW2.enemies = [eW];
        // 站到它旁边（射程内且可见）
        for (var di2 = 0; di2 < 4; di2++) {
          var nx2 = eW.x + dirsK[di2][0], ny2 = eW.y + dirsK[di2][1];
          if (gW2.walkable(nx2, ny2) && !gW2.enemyAt(nx2, ny2)) { gW2.px = nx2; gW2.py = ny2; break; }
        }
        if (gW2._recomputeFOV) gW2._recomputeFOV();
        eW.hp = eW.maxHp = 9999;
        var rW = gW2.useSkill();
        if (!rW.ok) fail('潮语洪流放不出来: ' + rW.reason);
        else if (!(eW.wet > 0)) fail('潮语洪流没有让敌人湿透');
        else if (eW.wet !== 2) fail('潮湿的回合数与文案不符：文案写 2，实测 ' + eW.wet);
        else ok('潮语洪流上了潮湿 ' + eW.wet + ' 回合（与文案一致；出生那回合不倒计时）');
      }
    } catch (e) { fail('潮湿施加测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (d) 疾影：额外行动 + 本轮爆发窗口（+35%）
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'ranger', difficulty: 'standard' });
      stubRng(w.TideMain.game);
      var gB2 = w.TideMain.game;
      var base = duelDamage(gB2, DUMMY, {});
      var burst = duelDamage(gB2, DUMMY, { flags: { dmgOut: 0.35 } });
      if (!(burst.sum > base.sum)) fail('疾影的爆发窗口没有提高伤害');
      else if (Math.abs(burst.sum / base.sum - 1.35) > 0.06) {
        fail('疾影的增伤不是 35%（实测 ' + (burst.sum / base.sum).toFixed(3) + '）');
      } else ok('疾影爆发窗口生效：伤害 ×' + (burst.sum / base.sum).toFixed(2));
      // 放一次技能，确认窗口真的挂上去了
      var rB2 = gB2.useSkill();
      if (!rB2.ok) fail('疾影放不出来: ' + rB2.reason);
      else if (gB2.freeMoves !== 2) fail('疾影没有给 2 次免费行动: ' + gB2.freeMoves);
      else if (!(gB2.flags().dmgOut > 0)) fail('疾影的爆发窗口没有反映到 flags 上');
      else ok('疾影：免费行动 ' + gB2.freeMoves + ' 次 + 输出增伤 ' +
        Math.round(gB2.flags().dmgOut * 100) + '%（一轮后消失）');
    } catch (e) { fail('疾影爆发测试异常: ' + (e && e.stack ? e.stack : e)); }

    // (e) 不退之壁：双防 ×2.5 + 反伤 50%
    try {
      w.TideMain.start({ mode: 'normal', seed: 20260922, classKey: 'warden', difficulty: 'standard' });
      stubRng(w.TideMain.game);
      var gR2 = w.TideMain.game;
      gR2.enemies = [];
      var defBefore2 = gR2.stats().defP;
      var thornsBefore = gR2.flags().thorns;
      var rR = gR2.useSkill();
      if (!rR.ok) fail('不退之壁放不出来: ' + rR.reason);
      else if (!(gR2.stats().defP > defBefore2 * 2)) fail('不退之壁没有把双防抬起来');
      else if (!(gR2.flags().thorns > thornsBefore)) {
        fail('不退之壁的反伤没有进 flags（' + thornsBefore + ' → ' + gR2.flags().thorns + '）');
      } else {
        // 反伤要真的能打回去：让一个敌人打玩家一下，看它自己掉不掉血
        var eR = gR2._makeEnemy(gR2.px + 1, gR2.py, 3);
        if (!eR || !gR2.walkable(gR2.px + 1, gR2.py)) fail('反伤测试：旁边没有位置放敌人');
        else {
          eR.hp = eR.maxHp = 9999;
          gR2.enemies.push(eR);
          var ehp0 = eR.hp;
          gR2.enemyHit(eR);
          if (!(eR.hp < ehp0)) fail('敌人打了我，却没有被反伤（' + ehp0 + ' → ' + eR.hp + '）');
          else ok('不退之壁：双防 ×' + (gR2.stats().defP / defBefore2).toFixed(2) +
            '，反伤 ' + Math.round(gR2.flags().thorns * 100) + '%（敌人被打掉 ' + (ehp0 - eR.hp) + ' 血）');
        }
      }
    } catch (e) { fail('不退之壁测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 24. 元进度（潮汐结晶） ----------
    // 这一节要盯死两件事：
    //   ① 存档是**不可信输入** —— 手改过的存档不能把游戏搞坏，也不能变出幽灵解锁
    //   ② 元进度**只在显式传入时**才生效 —— 一旦它偷偷泄漏进模拟器，
    //      通关率这个唯一的验收标准就作废了，而且是无声作废
    var metaBackup = null;
    try {
      var MU = w.TideMeta;
      metaBackup = MU ? MU.load() : null;
      if (!MU) fail('没有 TideMeta 模块');
      else if (typeof w.TideData.META.effects !== 'function') fail('TideData.META.effects 不是函数');
      else {
        // ① 存档净化：非法输入必须被修成合法值，且不抛异常
        var bad1 = MU.sanitize({
          crystals: -50, total: -1,
          owned: { gift: 1, god: 1, pouch1: 'yes' },
          runs: -3, wins: 99, best: 1000000
        });
        if (bad1.crystals !== 0) fail('负数结晶没有被修正: ' + bad1.crystals);
        if (bad1.owned.god) fail('不存在的解锁 id 竟然被保留（幽灵解锁能进模型层）');
        if (bad1.owned.gift) fail('前置没满足的解锁被当成已购');
        if (!bad1.owned.pouch1) fail('合法解锁被误伤');
        if (bad1.best > 999) fail('最深层的越界值没有夹住: ' + bad1.best);
        if (bad1.wins > bad1.runs) fail('通关次数大于总局数没有被修正');
        var bad2 = MU.sanitize('这不是对象'), bad3 = MU.sanitize(null);
        if (!bad2 || bad2.crystals !== 0 || !bad3 || !bad3.owned) fail('非对象 / null 存档没有兜底成新档');
        ok('存档净化：负数/越界/幽灵解锁/类型错误全部就地修好，且不抛异常');

        // ② 存读一致
        MU.save({ crystals: 500, total: 900, owned: { pouch1: 1 }, runs: 3, wins: 1, best: 4 });
        var rd = MU.load();
        if (rd.crystals !== 500 || !rd.owned.pouch1 || rd.best !== 4 || rd.wins !== 1) {
          fail('存读不一致: ' + JSON.stringify(rd));
        } else ok('存档存读一致（结晶 / 已购 / 最深层 / 通关数都对得上）');

        // ③ 购买的三条失败分支都要有明确理由，扣费要准
        MU.save({ crystals: 0, total: 0, owned: {}, runs: 0, wins: 0, best: 0 });
        var bPoor = MU.buy('pouch1');
        if (bPoor.ok || bPoor.reason !== 'poor') fail('没钱时没有正确拒绝: ' + JSON.stringify(bPoor));
        var bReq = MU.buy('pouch2');
        if (bReq.ok || bReq.reason !== 'req') fail('前置没满足时没有正确拒绝: ' + JSON.stringify(bReq));
        MU.save({ crystals: 9999, total: 9999, owned: {}, runs: 0, wins: 0, best: 0 });
        var bOk = MU.buy('pouch1');
        if (!bOk.ok || bOk.meta.crystals !== 9999 - 60) fail('扣费不对: ' + JSON.stringify(bOk.meta));
        var bDup = MU.buy('pouch1');
        if (bDup.ok || bDup.reason !== 'owned') fail('重复购买没有被拒绝');
        ok('购买三分支正确：poor / req / owned，且扣费准确');

        // ④ 结算幂等 —— 同一局结两次不能翻倍（翻倍不可逆，玩家已经花掉了）
        MU.save({ crystals: 0, total: 0, owned: {}, runs: 0, wins: 0, best: 0 });
        var fakeG = { status: 'dead', depth: 2, kills: 10 };
        var s1 = MU.settle(fakeG, 'run-A');
        var s2 = MU.settle(fakeG, 'run-A');
        if (!(s1.gain > 0)) fail('结算没有给出结晶');
        else if (s2.duplicate !== true || s2.gain !== 0) fail('同一局被结算了两次（结晶凭空翻倍）');
        else if (MU.load().crystals !== s1.gain) fail('结算入账金额不对');
        else ok('结算幂等：同一局重复结算第二次给 0（首次 +' + s1.gain + '）');
      }
    } catch (e) { fail('元进度测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 25. 元进度必须真的作用于开局，且绝不能泄漏到没有它的那一局 ----------
    try {
      var allOwned = {};
      for (var ui2 = 0; ui2 < w.TideData.META.unlocks.length; ui2++) {
        allOwned[w.TideData.META.unlocks[ui2].id] = 1;
      }
      // 走 TideMain.start 而不是直接 new Game：这样连"主循环有没有把 meta 传下去"一起验了
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gBase = w.TideMain.game;
      var baseHp = gBase.stats().hp, baseBag = gBase.bagCap(), baseLives = gBase.lives;

      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: allOwned });
      var gMeta = w.TideMain.game;
      if (gMeta.gold !== 300) fail('金币加成不对: ' + gMeta.gold + '（期望 120+180=300）');
      else if (gMeta.bagCap() !== baseBag + 8) fail('背包加成不对: ' + gMeta.bagCap() + ' vs 基准 ' + baseBag);
      else if (gMeta.lives !== baseLives + 1) fail('复活次数加成不对: ' + gMeta.lives);
      else if (!(gMeta.stats().hp > baseHp)) fail('生命上限加成没有生效: ' + gMeta.stats().hp + ' vs ' + baseHp);
      else if (!gMeta.bag.length) fail('开局装备没有进背包');
      else ok('元进度确实作用于开局：金币 ' + gMeta.gold + ' / 背包 ' + gMeta.bagCap() +
        ' / 复活 ' + gMeta.lives + ' / 生命 ' + baseHp + '→' + gMeta.stats().hp +
        ' / 开局装备 ' + gMeta.bag[0].rarityName);

      // 最关键的一条：没传 meta 的那一局必须**一丁点都不受影响**
      if (gBase.meta !== null || gBase.gold !== 0 || gBase.bagCap() !== 40 ||
          gBase.stats().hp >= gMeta.stats().hp) {
        fail('基准被污染了 —— 元进度泄漏到了"没传 meta"的那一局（模拟器的通关率会因此失真）');
      } else {
        ok('元进度不泄漏：不传 meta 的一局 金币 0 / 背包 40 / 生命 ' + baseHp +
          '（模拟器的基准仍然干净）');
      }
    } catch (e) { fail('元进度生效测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 26. BGM 状态机 ----------
    try {
      var AU2 = w.TideAudio;
      if (typeof AU2.musicState !== 'function') fail('音频层没有 musicState，BGM 无法断言');
      else {
        AU2.init();
        AU2.music('title');
        var st1 = AU2.musicState();
        if (st1.scene !== 'title' || st1.level !== 0) fail('标题页没有切到静谧段: ' + JSON.stringify(st1));
        AU2.music('game', 1);
        var st2 = AU2.musicState();
        if (st2.scene !== 'game' || st2.level !== 1) fail('局内没有切到探索段: ' + JSON.stringify(st2));
        AU2.music('game', 2);
        var st3 = AU2.musicState();
        if (st3.level !== 2) fail('危机段没有切过去: ' + JSON.stringify(st3));
        else if (!(st3.tempo > st2.tempo)) fail('危机段没有提速: ' + st2.tempo + ' → ' + st3.tempo);
        // 幂等：重复调同一场景不能把步进归零（否则音乐卡在第 0 步反复重来）
        AU2.music('game', 2); AU2.music('game', 2);
        var st4 = AU2.musicState();
        if (st4.scene !== 'game' || st4.level !== 2) fail('重复调用把音乐状态改坏了');
        // 静音必须**真的停掉音序器**，不是靠把增益拧到 0
        var wasOn = AU2.isOn();
        AU2.toggle(false);
        if (AU2.musicState().running) fail('静音之后音序器还在跑（白烧 CPU）');
        AU2.toggle(wasOn);
        ok('BGM 状态机：标题静谧(72) / 局内探索(' + st2.tempo + ') / 危机提速(' + st3.tempo +
          ')，且静音会真正停掉音序器');
      }
    } catch (e) { fail('BGM 测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 27. 标题页的潮汐结晶面板真的画出来了 ----------
    try {
      var MU3 = w.TideMeta;
      MU3.save({ crystals: 999, total: 999, owned: { pouch1: 1 }, runs: 5, wins: 2, best: 3 });
      w.TideUI.showTitle();
      var grid2 = d.getElementById('meta-grid');
      var cry2 = d.getElementById('meta-crystals');
      var ownedN = grid2 ? grid2.querySelectorAll('.meta-card.owned').length : -1;
      if (!grid2 || !grid2.querySelectorAll('[data-meta]').length) fail('标题页没有渲染潮汐结晶面板');
      else if (!cry2 || cry2.textContent !== '999') fail('结晶数量没有显示: ' + (cry2 && cry2.textContent));
      else if (ownedN !== 1) fail('已购状态没有画出来（.owned 卡片数 = ' + ownedN + '）');
      else if (grid2.innerHTML.indexOf('还差') < 0 &&
               grid2.innerHTML.indexOf('需先解锁') < 0) {
        fail('买不起 / 前置不满的卡片没有给出原因 —— 只置灰不解释，玩家会以为坏了');
      } else {
        ok('标题页潮汐结晶面板：' + grid2.querySelectorAll('[data-meta]').length +
          ' 个解锁项，已购 / 买不起 / 前置不满三种状态都画出来了');
      }
      if (metaBackup) MU3.save(metaBackup); else MU3.reset();
    } catch (e) { fail('结晶面板测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 28. 标题页必须装得下（按 exe 的真实窗口尺寸量） ----------
    // 这一节的由来，删掉之前先读完：
    //   v10.7 往标题页塞了第三块「潮汐结晶」区块，把内容撑到 1132px，
    //   而 exe 的窗口客户区只有 880px → 「开始下潜」被挤到可视区之外，
    //   玩家一打开就是"卡住了"。而当时冒烟 118 项**全绿**。
    //
    //   原因：**程序化 click() 不关心元素在不在屏幕里。** element.click() 永远成功，
    //   真人用鼠标点才需要它真的可见。这是测试的结构性盲区。
    //   所以这条断言只看几何，不看"能不能点"。
    try {
      w.TideUI.showTitle();
      // 临时把 iframe 调成 exe 的客户区尺寸（launcher.cs: ClientSize = 1380x880）
      fr.style.width = '1380px';
      fr.style.height = '880px';
      void fr.offsetHeight;                     // 强制一次同步布局，别量到旧尺寸

      var innerT = d.querySelector('.title-inner');
      var startT = d.getElementById('btn-start');
      var irT = innerT.getBoundingClientRect();
      var srT = startT.getBoundingClientRect();
      var overT = innerT.scrollHeight - innerT.clientHeight;

      if (srT.bottom > irT.height + 1) {
        fail('「开始下潜」落在可视区之外（按钮 bottom ' + Math.round(srT.bottom) +
          ' > 可视高 ' + Math.round(irT.height) + '）—— 真机上看起来就是"卡住"。' +
          '注意：程序化 click() 测不出这个，只有几何断言能。');
      } else {
        // 判据是「主按钮在可视区内」，**不是**"整页不许滚动"。
        // 底部那行署名要滚一下才看全，完全正常；重点是别让人找不到开始按钮。
        ok('标题页在真机尺寸 1380×880 下可用：「开始下潜」bottom=' +
          Math.round(srT.bottom) + ' 在可视区(高 ' + Math.round(irT.height) +
          ')内；整页内容 ' + innerT.scrollHeight + 'px' +
          (overT > 1 ? '（底部署名需滚动 ' + overT + 'px 才看全，可接受）' : ''));
      }

      // 结晶面板现在住弹窗里，两条路（按钮 / Esc）都要能进出
      w.TideUI.showMeta();
      var mmT = d.getElementById('meta-modal');
      if (mmT.classList.contains('hidden')) fail('结晶弹窗没有打开');
      else if (!d.getElementById('meta-grid').querySelectorAll('[data-meta]').length) {
        fail('结晶弹窗里没有解锁项');
      } else {
        w.TideUI.closeMeta();
        if (!d.getElementById('meta-modal').classList.contains('hidden')) fail('结晶弹窗关不掉');
        else ok('潮汐结晶改成弹窗后：可打开、可关闭，解锁项都渲染在弹窗里');
      }

      fr.style.width = '1280px';                // 还原，后面的断言依赖这个尺寸
      fr.style.height = '800px';
      void fr.offsetHeight;
    } catch (e) { fail('标题页布局测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 29. ESC 暂停菜单：能开、能关、且真的拔掉了输入 ----------
    // 最后一类是"菜单开着，角色还在走" —— 这是弹窗类界面的经典漏法：
    // 门禁散在各个输入分支里，新加一个界面就漏一条。这里直接断言行为。
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gP = w.TideMain.game;
      var p0 = { x: gP.px, y: gP.py };
      var key = function (k) {
        w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
        w.dispatchEvent(new w.KeyboardEvent('keyup', { key: k, bubbles: true }));
      };

      // 先验一条容易被忽略的：按住 Esc 时系统会持续发 keydown（repeat=true），
      // 那种事件不能当成"玩家又想开菜单" —— 否则"关掉弹窗的那一次长按"
      // 会顺手把菜单弹出来。这是写代码时才想到的，所以更要钉住。
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', repeat: true, bubbles: true }));
      if (w.TideUI.isPauseOpen()) { fail('按住 Esc 的重复事件误触发了暂停菜单'); w.TideUI.closePause(); }
      else ok('按住 Esc 的重复事件不会误触发菜单（只在首次按下时响应）');

      key('Escape');
      if (!w.TideUI.isPauseOpen()) fail('按 Esc 没有打开暂停菜单');
      else if (d.getElementById('pause-modal').classList.contains('hidden')) fail('暂停菜单状态是开着，但没显示出来');
      else {
        ok('Esc 能打开暂停菜单（并且弹窗确实显示了）');

        // ① 方向键必须完全驱动不了角色
        ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'w', 'a', 's', 'd'].forEach(key);
        if (gP.px !== p0.x || gP.py !== p0.y) {
          fail('暂停菜单开着，方向键还能让角色动（' + p0.x + ',' + p0.y + ' → ' + gP.px + ',' + gP.py + '）');
        } else if (gP.turn !== 0) {
          fail('暂停期间回合被推进了: ' + gP.turn);
        } else {
          ok('暂停时方向键完全驱动不了角色，回合也没有被推进');
        }

        // ② 动作键（空格等待 / Q 魂技 / E 背包）也要被挡住
        var turnB = gP.turn, invB = w.TideUI.isInventoryOpen(), cdB = gP.skillCd;
        [' ', 'q', 'e'].forEach(key);
        if (gP.turn !== turnB) fail('暂停期间空格/Q 还能推进回合');
        else if (w.TideUI.isInventoryOpen() !== invB) fail('暂停期间按 E 竟然打开了背包');
        else if (gP.skillCd !== cdB) fail('暂停期间按 Q 竟然放出了魂技');
        else ok('暂停期间动作键（空格等待 / Q 魂技 / E 背包）也被挡住');

        // ③ 菜单里的音效开关要真的生效，文案要跟着变
        var sndB = w.TideAudio.isOn();
        w.TideUI.pauseSound();
        var sndA = w.TideAudio.isOn();
        var sndLabel = d.getElementById('btn-pause-sound').textContent || '';
        if (sndA === sndB) fail('暂停菜单里的音效开关没有生效');
        else if (sndLabel.indexOf(sndA ? '开' : '关') < 0) {
          fail('音效开关的文案没跟着刷新: ' + JSON.stringify(sndLabel));
        } else {
          w.TideUI.pauseSound();     // 还原
          ok('暂停菜单的音效开关可用，文案同步（' + sndLabel + '）');
        }

        // ④ 再按 Esc 关掉；关掉之后输入必须恢复
        key('Escape');
        if (w.TideUI.isPauseOpen()) fail('再按一次 Esc 关不掉暂停菜单');
        else {
          // 恢复的判据：找到一个可走的方向，走一格，回合应该 +1
          var dirsP = [[1, 0], [-1, 0], [0, 1], [0, -1]], walked = false;
          for (var qi2 = 0; qi2 < 4 && !walked; qi2++) {
            var nx2 = p0.x + dirsP[qi2][0], ny2 = p0.y + dirsP[qi2][1];
            if (gP.walkable(nx2, ny2)) {
              key(['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'][qi2]);
              walked = (gP.px === nx2 && gP.py === ny2);
            }
          }
          if (!walked) fail('关闭暂停菜单后，方向键恢复不了输入（角色走不动）');
          else ok('再按 Esc 关闭后输入恢复：角色能正常走动了（' + p0.x + ',' + p0.y +
            ' → ' + gP.px + ',' + gP.py + '）');
        }
      }
    } catch (e) { fail('暂停菜单测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 30. 视角缩放：只改「看」，不改「玩」 ----------
    // 这条不变量是缩放功能的地基：绘制代码一个字符都没改，
    // 全靠「可见世界缩小 + 画布被拉伸」这一个恒等式成立。
    // 恒等式一破，整屏坐标（剔除、地形、光照、粒子、指针）会一起错位。
    try {
      var R2 = w.TideRender;
      var TS = w.TideSettings;
      if (!TS) fail('没有 TideSettings 模块');
      else if (!R2.setZoom || !R2.zoomBy) fail('渲染层没有缩放接口');
      else {
        // ① 设置的净化（localStorage 是不可信输入）
        var sb = TS.sanitize({ volSfx: 'x', volBgm: 99, zoom: -5, guide: 'yes' });
        if (sb.volSfx !== 1) fail('音量非数字没有被修成默认值: ' + sb.volSfx + '（默认应为 1 = 与加音量功能之前的混音一致）');
        else if (sb.volBgm !== 1) fail('音量越界没有被夹住: ' + sb.volBgm);
        else if (sb.zoom !== 1) fail('非法缩放没有被修成默认值: ' + sb.zoom);
        else if (sb.guide !== true) fail('只有显式 false 才算关闭: ' + sb.guide);
        else if (!TS.sanitize(null) || TS.sanitize(null).volSfx !== 1) fail('null 设置没有兜底');
        else ok('玩家设置净化：非数字 / 越界 / 非法缩放 / 非布尔全部就地修好，且不抛异常');

        // ② 缩放恒等式 + 玩法状态必须一个字节都不变
        w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
        var gZ = w.TideMain.game;
        R2.setZoom(1);
        var beforeZ = {
          px: gZ.px, py: gZ.py, turn: gZ.turn, hp: gZ.hp,
          kills: gZ.kills, enemies: gZ.enemies.length, depth: gZ.depth
        };
        var v1 = R2.view, p1 = R2.viewPx;
        if (Math.abs(p1.w / v1.w - 1) > 0.02) fail('zoom=1 时 viewPx/view 不是 1: ' + (p1.w / v1.w));

        R2.setZoom(1.5);
        var v2 = R2.view, p2 = R2.viewPx;
        if (Math.abs(p2.w / v2.w - 1.5) > 0.03) {
          fail('缩放恒等式不成立：viewPx.w / view.w = ' + (p2.w / v2.w).toFixed(3) + '，应为 1.5');
        } else if (Math.abs(v1.w / v2.w - 1.5) > 0.06) {
          // 注意比的是 view（可见世界），不是 viewPx（画布元素）：
          // 画布的显示宽度**本来就不该随缩放变**，变的是它能装下多少世界。
          // 这一条第一版写成了比 viewPx，于是自己给自己报了个假失败。
          fail('放大后可见世界没有缩小：' + v1.w + 'px → ' + v2.w + 'px');
        } else {
          ok('缩放恒等式成立：画布 ' + p2.w + 'px / 可见世界 ' + v2.w + 'px = ' +
            (p2.w / v2.w).toFixed(3) + '×（应为 1.500×）');
        }

        var afterZ = {
          px: gZ.px, py: gZ.py, turn: gZ.turn, hp: gZ.hp,
          kills: gZ.kills, enemies: gZ.enemies.length, depth: gZ.depth
        };
        var sameZ = true;
        for (var kk in beforeZ) if (beforeZ[kk] !== afterZ[kk]) sameZ = false;
        if (!sameZ) {
          fail('缩放竟然改动了游戏状态: ' + JSON.stringify(beforeZ) + ' → ' + JSON.stringify(afterZ));
        } else {
          ok('缩放只改「看」不改「玩」：坐标 / 回合 / 血量 / 敌人数 / 层数全部未变');
        }

        // ③ 指针映射在缩放后依然准（点哪个格子必须还是那个格子）
        var cvZ = d.getElementById('view');
        var rZ = cvZ.getBoundingClientRect();
        var txZ = beforeZ.px, tyZ = beforeZ.py;
        var kxZ = rZ.width / R2.view.w, kyZ = rZ.height / R2.view.h;
        var cliX = rZ.left + (txZ * R2.TILE + R2.TILE / 2 - R2.cam.x) * kxZ;
        var cliY = rZ.top + (tyZ * R2.TILE + R2.TILE / 2 - R2.cam.y) * kyZ;
        var backZ = R2.toCell(cliX, cliY);
        if (backZ.x !== txZ || backZ.y !== tyZ) {
          fail('缩放后指针映射错位：(' + txZ + ',' + tyZ + ') 反算回来成了 (' +
            backZ.x + ',' + backZ.y + ')');
        } else {
          ok('缩放后指针映射依然准确（客户端坐标反算回格子 (' + backZ.x + ',' + backZ.y + ')）');
        }

        // ④ 档位要夹得住，不能无限放大/缩小
        R2.setZoom(99); var zHi = R2.zoom;
        R2.setZoom(0.01); var zLo = R2.zoom;
        var zMax = R2.ZOOM_STEPS[R2.ZOOM_STEPS.length - 1], zMin = R2.ZOOM_STEPS[0];
        if (zHi > zMax + 1e-6) fail('放大没有被夹住: ' + zHi);
        else if (zLo < zMin - 1e-6) fail('缩小没有被夹住: ' + zLo);
        else ok('缩放档位夹得住（上限 ' + zHi + '× / 下限 ' + zLo + '×）');
        R2.setZoom(1);
      }
    } catch (e) { fail('缩放测试异常: ' + (e && e.stack ? e.stack : e)); }

    // ---------- 31. 背包三件事：Tab / 自动装备 / 「绝不静默降级」 ----------
    // 重点是最后那条：自动装备最容易写成"悄悄把你变弱"。
    // 所以断言的不是"能不能换"，而是**拒绝时有没有带回解释所需的数字** ——
    // 玩家点了没反应却又不知道为什么，比不做这个功能还糟。
    try {
      w.TideMain.start({ classKey: 'warlord', difficulty: 'standard', seed: 20260922, meta: null });
      var gE = w.TideMain.game;

      // ① Tab 开关背包（Tab 是浏览器的焦点键，必须被拦掉）
      var tabEv = new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true });
      w.dispatchEvent(tabEv);
      if (!w.TideUI.isInventoryOpen()) fail('按 Tab 没有打开背包');
      else if (!tabEv.defaultPrevented) fail('Tab 没有被拦掉 —— 焦点会跑走，之后键盘操作全失效');
      else {
        w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        if (w.TideUI.isInventoryOpen()) fail('再按 Tab 没有关掉背包');
        else ok('Tab 能开关背包，并且被 preventDefault（不会把焦点抢走）');
      }
      w.TideUI.closeInventory();

      // ② 战力必须能区分品质（一个能一眼比较的数）
      var mkE = function (rarity, slot) {
        return gE.makeItem({ depth: 3, rarity: rarity, slot: slot || 'helm' });
      };
      var weakE = mkE('common'), strongE = mkE('legendary');
      if (!(gE.power(strongE) > gE.power(weakE))) {
        fail('战力没有区分出品质：' + gE.power(weakE) + ' vs ' + gE.power(strongE));
      } else {
        ok('战力可用：普通 ' + gE.power(weakE) + ' < 传说 ' + gE.power(strongE));
      }

      // ③ 空槽 → 直接穿
      gE.equip = { weapon: null, helm: null, chest: null, boots: null, trinket: null };
      gE.bag = [weakE];
      var rEmpty = gE.autoEquip(0);
      if (!rEmpty.ok || rEmpty.reason !== 'empty') fail('空槽没有直接穿上: ' + JSON.stringify(rEmpty));
      else if (gE.equip.helm !== weakE) fail('空槽自动装备后身上不是那一件');
      else ok('空槽自动装备直接穿上');

      // ④ **绝不静默降级**：明显更弱的一件必须被拒，并带回两边战力
      var weakerE = mkE('common');
      weakerE.total = { hp: 1 }; weakerE.flags = {};
      gE.bag = [weakerE];
      var rWeak = gE.autoEquip(0);
      if (rWeak.ok) fail('更弱的装备竟然被穿上了（这就是静默降级）');
      else if (typeof rWeak.oldPower !== 'number' || typeof rWeak.newPower !== 'number') {
        fail('拒绝替换时没带回两边战力，界面就没法解释原因: ' + JSON.stringify(rWeak));
      } else if (rWeak.newPower >= rWeak.oldPower) {
        fail('判定自相矛盾：拒绝了，但新战力并不低（' + rWeak.newPower + ' vs ' + rWeak.oldPower + '）');
      } else if (gE.equip.helm !== weakE) {
        fail('被拒绝之后，身上的装备却被动了');
      } else {
        ok('绝不静默降级：更弱的会被拒，并带回两边战力（' + rWeak.newPower + ' < ' +
          rWeak.oldPower + '，reason=' + rWeak.reason + '）');
      }

      // ⑤ 更强的一件要换上，且旧装备**退回背包**（不能凭空消失）
      gE.bag = [strongE];
      var rUp = gE.autoEquip(0);
      if (!rUp.ok) fail('明显更强的一件没有被换上: ' + JSON.stringify(rUp));
      else if (gE.equip.helm !== strongE) fail('换上了，但身上不是新那件');
      else if (gE.bag.indexOf(weakE) < 0) fail('换装后旧装备没有退回背包 —— 凭空消失了');
      else ok('更强的一件会换上（战力 ' + gE.power(weakE) + ' → ' + gE.power(strongE) +
        '），旧装备退回背包');

      // ⑥ 口径③：品质更低、但战力碾压时仍然允许替换（好词条的低品质件有机会）
      var crushE = mkE('common');
      crushE.total = { atkP: 9999 }; crushE.flags = {};
      var rCrush = gE.canUpgrade(crushE, 'helm');
      if (!rCrush.ok) fail('品质更低但战力碾压时应当允许替换（约定③），实际被拒: ' + JSON.stringify(rCrush));
      else ok('复合判定生效：品质更低但战力 ≥ +10% 时仍会替换（不是单纯比品质）');

      // ⑦ 战力必须真的画进气泡里 —— 算了但不显示 = 玩家看不见
      gE.bag = [mkE('rare')];
      w.TideUI.openInventory('bag');
      w.TideUI.render(gE);
      var cellE = d.querySelector('#inv-grid .inv-slot.filled');
      if (!cellE) fail('背包格没有渲染出来');
      else {
        var rrE = cellE.getBoundingClientRect();
        cellE.dispatchEvent(new w.MouseEvent('mousemove', {
          bubbles: true, clientX: rrE.left + rrE.width / 2, clientY: rrE.top + rrE.height / 2
        }));
        var tipE = d.getElementById('tooltip');
        if (!tipE || tipE.classList.contains('hidden')) fail('悬停装备没有弹出气泡');
        else if ((tipE.textContent || '').indexOf('战力') < 0) {
          fail('气泡里没有「战力」（算了但没画出来 = 玩家看不见）');
        } else {
          ok('气泡里显示了战力：' + (tipE.textContent.match(/战力\s*-?\d+/) || [''])[0] +
            '（玩家能直接比较，而不是靠感觉）');
        }
      }
      w.TideUI.closeInventory();
